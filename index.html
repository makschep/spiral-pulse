      activeTouches.set(t.identifier, sx < W * 0.5 ? 'L' : 'R');
    }
  }, { passive: false });

  function clearTouches(e) {
    for (const t of e.changedTouches) activeTouches.delete(t.identifier);
  }
  canvas.addEventListener('touchend', clearTouches);
  canvas.addEventListener('touchcancel', clearTouches);

  canvas.addEventListener('mousedown', (e) => {
    ensureAudio();
    const sx = clientToStageX(e.clientX, e.clientY);
    mouseSide = sx < W * 0.5 ? 'L' : 'R';
  });
  window.addEventListener('mouseup', () => { mouseSide = null; });

  // ===== UI & LOCALIZATION =====
  function formatTime(t) {
    const secs = Math.floor(t);
    const cs = Math.floor((t - secs) * 100);
    return `${secs}:${cs < 10 ? '0' : ''}${cs}`;
  }
  function getMedal(t) {
    if (t >= 45) return 'gold';
    if (t >= 30) return 'silver';
    if (t >= 15) return 'bronze';
    return '';
  }

  function applyTheme(lvl, accentOverride = null) {
    const acc = accentOverride || lvl.accent;
    document.documentElement.style.setProperty('--bg', lvl.bg);
    document.documentElement.style.setProperty('--accent', acc);
    const metaTheme = document.querySelector('meta[name="theme-color"]');
    if (metaTheme) metaTheme.setAttribute('content', lvl.bgDeep);
  }

  function applyLanguageUI() {
    const t = tr();
    document.documentElement.lang = save.lang;
    document.getElementById('playBtn').textContent = t.play;
    document.getElementById('pauseBackBtn').textContent = t.menu;
    document.getElementById('overMenuBtn').textContent = t.menu;
    document.getElementById('retryBtn').textContent = t.retry;
    document.getElementById('shopOpenBtn').textContent = t.shop;
    document.getElementById('settingsOpenBtn').textContent = t.settings;
    document.getElementById('installBtn').textContent = t.install;
    document.getElementById('shopTitle').textContent = t.shop;
    document.getElementById('shopCloseBtn').textContent = t.close;
    document.getElementById('skinsLabel').textContent = t.skins;
    document.getElementById('perksLabel').textContent = t.perks;
    document.getElementById('settingsTitle').textContent = t.settings;
    document.getElementById('settingsCloseBtn').textContent = t.close;
    document.getElementById('setLangLabel').textContent = t.setLang;
    document.getElementById('setSoundLabel').textContent = t.setSound;
    document.getElementById('setVibeLabel').textContent = t.setVibe;
    document.getElementById('soundOnBtn').textContent = t.on;
    document.getElementById('soundOffBtn').textContent = t.off;
    document.getElementById('vibeOnBtn').textContent = t.on;
    document.getElementById('vibeOffBtn').textContent = t.off;
    document.getElementById('hintTurn').textContent = t.hintTurn;
    document.getElementById('hintPhase').textContent = t.hintPhase;
    renderSettingsButtons();
    renderMenu();
    renderShop();
  }

  function renderSettingsButtons() {
    document.getElementById('langRuBtn').classList.toggle('active', save.lang === 'ru');
    document.getElementById('langEnBtn').classList.toggle('active', save.lang === 'en');
    document.getElementById('soundOnBtn').classList.toggle('active', !!save.sound);
    document.getElementById('soundOffBtn').classList.toggle('active', !save.sound);
    document.getElementById('vibeOnBtn').classList.toggle('active', !!save.vibe);
    document.getElementById('vibeOffBtn').classList.toggle('active', !save.vibe);
  }

  function renderMenu() {
    const t = tr();
    document.getElementById('menuCoins').textContent = `◈ ${save.coins}`;
    const grid = document.getElementById('levelsGrid');
    grid.innerHTML = '';
    LEVELS.forEach((lvl, idx) => {
      const best = save.best[idx] || 0;
      const med = getMedal(best);
      const card = document.createElement('div');
      card.className = 'lvlCard' + (idx === save.selectedLevel ? ' selected' : '');
      card.style.setProperty('--c', lvl.accent);
      card.innerHTML = `
        <div class="lvlNum"><span>${lvl.num}</span><span class="medal ${med}"></span></div>
        <div>
          <div class="lvlName">${lvl.name[save.lang]}</div>
          <div class="lvlTag">${lvl.tag[save.lang]}</div>
        </div>
        <div class="lvlFoot">
          <span>${t.best}</span>
          <span>${formatTime(best)}</span>
        </div>
      `;
      card.onclick = () => {
        ensureAudio();
        save.selectedLevel = idx;
        curLvl = lvl;
        applyTheme(lvl);
        persist();
        renderMenu();
      };
      grid.appendChild(card);
    });
  }

  function renderShop() {
    const t = tr();
    document.getElementById('shopCoins').textContent = `◈ ${save.coins}`;
    const sRow = document.getElementById('skinsRow');
    sRow.innerHTML = '';
    SKINS.forEach((s) => {
      const owned = save.ownedSkins.includes(s.id);
      const active = save.skin === s.id;
      const el = document.createElement('div');
      el.className = 'shopItem' + (owned ? ' owned' : '') + (active ? ' active' : '');
      el.innerHTML = `
        <div class="skinGlyph">${s.id}</div>
        <div class="priceTag">${active ? t.equipped : owned ? t.equip : `◈ ${s.price}`}</div>
      `;
      el.onclick = () => {
        ensureAudio();
        if (owned) {
          save.skin = s.id;
          playSfx('coin');
        } else if (save.coins >= s.price) {
          save.coins -= s.price;
          save.ownedSkins.push(s.id);
          save.skin = s.id;
          playSfx('split');
        } else {
          playSfx('scrape');
        }
        persist();
        renderShop();
        renderMenu();
      };
      sRow.appendChild(el);
    });

    const pRow = document.getElementById('perksRow');
    pRow.innerHTML = '';
    PERKS.forEach((p) => {
      const owned = !!save.perks[p.id];
      const meta = t.perksMeta[p.id];
      const el = document.createElement('div');
      el.className = 'shopItem' + (owned ? ' active' : '');
      el.innerHTML = `
        <div class="perkName">${meta.name}</div>
        <div class="perkSub">${meta.sub}</div>
        <div class="priceTag">${owned ? t.active : `◈ ${p.price}`}</div>
      `;
      el.onclick = () => {
        ensureAudio();
        if (!owned && save.coins >= p.price) {
          save.coins -= p.price;
          save.perks[p.id] = true;
          playSfx('split');
          persist();
          renderShop();
          renderMenu();
        } else if (!owned) {
          playSfx('scrape');
        }
      };
      pRow.appendChild(el);
    });
  }

  function showBanner(text, dur = 1.9) {
    eventBanner.textContent = text;
    eventBanner.classList.add('show');
    bannerTimer = dur;
  }

  function openMenu() {
    mode = 'menu';
    chromaAmt = 0;
    applyTheme(curLvl);
    activeTouches.clear();
    mouseSide = null;
    keyL = false;
    keyR = false;
    timerBox.style.display = 'none';
    hudTopLeft.style.display = 'none';
    overOverlay.classList.add('hidden');
    shopModal.classList.add('hidden');
    settingsModal.classList.add('hidden');
    menuOverlay.classList.remove('hidden');
    eventBanner.classList.remove('show');
    renderMenu();
  }

  // Button bindings
  document.getElementById('playBtn').onclick = () => { ensureAudio(); startRun(save.selectedLevel); };
  document.getElementById('retryBtn').onclick = () => { ensureAudio(); startRun(curLvl.id); };
  document.getElementById('overMenuBtn').onclick = () => openMenu();
  document.getElementById('pauseBackBtn').onclick = () => openMenu();
  document.getElementById('shopOpenBtn').onclick = () => { ensureAudio(); renderShop(); shopModal.classList.remove('hidden'); };
  document.getElementById('shopCloseBtn').onclick = () => shopModal.classList.add('hidden');
  document.getElementById('settingsOpenBtn').onclick = () => { ensureAudio(); renderSettingsButtons(); settingsModal.classList.remove('hidden'); };
  document.getElementById('settingsCloseBtn').onclick = () => settingsModal.classList.add('hidden');

  document.getElementById('langRuBtn').onclick = () => { save.lang = 'ru'; persist(); applyLanguageUI(); };
  document.getElementById('langEnBtn').onclick = () => { save.lang = 'en'; persist(); applyLanguageUI(); };
  document.getElementById('soundOnBtn').onclick = () => { save.sound = true; ensureAudio(); persist(); renderSettingsButtons(); };
  document.getElementById('soundOffBtn').onclick = () => { save.sound = false; persist(); renderSettingsButtons(); };
  document.getElementById('vibeOnBtn').onclick = () => { save.vibe = true; vibe(15); persist(); renderSettingsButtons(); };
  document.getElementById('vibeOffBtn').onclick = () => { save.vibe = false; persist(); renderSettingsButtons(); };

  // ===== START RUN =====
  function startRun(lvlIdx) {
    curLvl = LEVELS[lvlIdx] || LEVELS[0];
    applyTheme(curLvl);
    mode = 'play';
    runTime = 0;
    runCoins = 0;
    worldRot = 0;
    worldSpin = curLvl.baseSpin;
    shake = 0;
    hitStop = 0;
    deathTimer = 0;
    lastSpeedTier = 0;
    depth3D = 0;
    chromaAmt = 0;
    chromaPhase = 0;
    camTiltX = 0;
    camTiltY = 0;
    camZoom = 1;
    camSway = 0;
    beatAccum = 0;
    stepIdx = 0;
    beatPulse = 0;
    sonarRipples = [];

    player.ang = -Math.PI / 2;
    player.angVel = 0;
    player.radialBounce = 0;
    player.radialVel = 0;
    player.scale = 1.0;
    player.phaseMax = save.perks.phasePlus ? 4.0 : 3.0;
    player.phaseFuel = player.phaseMax;
    player.phasing = false;
    player.nearMissCd = 0;
    player.grace = 0.65;

    duality.active = false;
    duality.splitBlend = 0;
    duality.respawnTimer = 5.0;

    walls = [];
    coins = [];
    lasers = [];
    sparks = [];
    shards = [];
    floatTexts = [];
    laserTimer = 4.6;
    patternCount = 0;
    lastSafeGapAng = player.ang;
    nextRequiredClearance = 0;

    activeTouches.clear();
    mouseSide = null;
    menuOverlay.classList.add('hidden');
    shopModal.classList.add('hidden');
    settingsModal.classList.add('hidden');
    overOverlay.classList.add('hidden');
    timerBox.style.display = 'block';
    hudTopLeft.style.display = 'flex';
    bestHud.textContent = `${tr().best}: ${formatTime(save.best[curLvl.id] || 0)}`;
    coinHud.textContent = `◈ ${save.coins}`;
    showBanner(`${curLvl.num} · ${curLvl.name[save.lang]}`, 1.6);
  }

  // ===== ARCHITECTURAL FAIR SPATIAL WAVE GENERATOR =====
  function getSpawnRadius() {
    const vW = W / arenaScale;
    const vH = H / arenaScale;
    return Math.hypot(vW, vH) * 0.54 + 42;
  }

  function getOutermostWallOuterR() {
    let maxR = 0;
    for (let i = 0; i < walls.length; i++) {
      const w = walls[i];
      const extra = w.turretH || 0;
      const outer = w.r + w.thick + extra;
      if (outer > maxR) maxR = outer;
    }
    return maxR;
  }

  function addWall(opts) {
    walls.push({
      r: opts.r,
      thick: opts.thick || 24,
      start: normAng(opts.start),
      span: clamp(opts.span, 0.14, TAU - 0.14),
      rotSpd: opts.rotSpd || 0,
      kind: opts.kind || 'arc',          // 'arc' | 'gear' | 'phantom' | 'split' | 'breathe'
      profile: opts.profile || 'arc',    // 'arc' | 'bastion' | 'fortress' | 'blade' | 'chevron' | 'notch' | 'wing' | 'piston'
      turretH: opts.turretH || 0,
      flip: !!opts.flip,
      baseStart: normAng(opts.start),
      baseSpan: clamp(opts.span, 0.14, TAU - 0.14),
      oscAmp: opts.oscAmp || 0.15,
      phase: opts.phase || 0,
      phantomAlpha: 1,
      vanishSfxDone: false,
      vanished: false,
      hitFlash: 0,
      vibeOff: 0,
      nearAwarded: false,
      height3D: opts.height3D || 34
    });
  }

  function addCoin(r, ang) {
    coins.push({ r, ang: normAng(ang), taken: false, pulse: Math.random() * TAU });
  }

  function addRingWithGap(r, thick, gapCenter, gapWidth, extra = {}) {
    const start = normAng(gapCenter + gapWidth * 0.5);
    const span = TAU - gapWidth;
    addWall({ r, thick, start, span, ...extra });
  }

  function addSymmetricPair(r, thick, gapCenter, gapWidth, extra = {}) {
    const startA = normAng(gapCenter + gapWidth * 0.5);
    const span = Math.PI - gapWidth;
    addWall({ r, thick, start: startA, span, ...extra });
    addWall({ r, thick, start: normAng(startA + Math.PI), span, ...extra });
  }

  function spawnFairWave(wallSpd) {
    const R0 = getSpawnRadius();
    const t = runTime;
    const ease = clamp(1 - t / 44, 0, 1);
    patternCount++;

    const isDualLvl = (curLvl.id === 3);
    const maxDelta = isDualLvl ? 0.92 : 1.38;
    const minDelta = 0.42;
    const dir = Math.random() < 0.5 ? 1 : -1;
    const delta = dir * (minDelta + Math.random() * (maxDelta - minDelta));
    const gapAng = normAng(lastSafeGapAng + delta);

    const stdGap = lerp(1.18, 1.62, ease);
    const dualGap = lerp(1.06, 1.34, ease);

    let exitGapAng = gapAng;
    let extraClearance = 0;

    // --- LEVEL 01: ЦИАН-ПУЛЬС (Reference-inspired Stepped Bastion Monoliths, Fortress Rings, Turbine Blades, Chevron Crystals) ---
    if (curLvl.id === 0) {
      const pick = patternCount % 5;
      if (pick === 0) {
        // Signature Stepped Bastion Monolith (just like image_b492a4.png!) + Outer Stepped Fortress Ring
        const monSpan = lerp(2.65, 2.35, ease);
        const monStart = normAng(gapAng + stdGap * 0.55);
        addWall({ r: R0, thick: 72, start: monStart, span: monSpan, profile: 'bastion', turretH: 48, height3D: 48 });
        // Companion stepped outer fortress arc framing it
        addRingWithGap(R0 + 138, 34, normAng(gapAng + dir * 0.72), stdGap + 0.14, { profile: 'fortress', turretH: 30, height3D: 36 });
        if (Math.random() < 0.65) addCoin(R0 + 36, gapAng);
        exitGapAng = normAng(gapAng + dir * 0.72);
        extraClearance = 38;
      } else if (pick === 1) {
        // Twin Swept Turbine Blades (asymmetric tapered wedges)
        const bladeGap = lerp(1.08, 1.36, ease);
        addSymmetricPair(R0, 22, gapAng, bladeGap, { profile: 'blade', turretH: 48, flip: dir > 0, height3D: 42 });
        if (Math.random() < 0.55) addCoin(R0 + 28, gapAng);
        exitGapAng = gapAng;
        extraClearance = 24;
      } else if (pick === 2) {
        // Stepped Fortress Battlement Ring (alternating thick/thin castle blocks)
        addRingWithGap(R0, 28, gapAng, stdGap, { profile: 'fortress', turretH: 32, height3D: 40 });
        if (Math.random() < 0.5) addCoin(R0 + 18, gapAng);
        exitGapAng = gapAng;
      } else if (pick === 3) {
        // Crystalline Chevron Cloverleaf (3 pointed diamond spearheads) + notched follow-up
        const open = lerp(0.80, 0.96, ease);
        const span = TAU / 3 - open;
        for (let k = 0; k < 3; k++) {
          addWall({ r: R0, thick: 28, start: gapAng + open * 0.5 + k * (TAU / 3), span, profile: 'chevron', turretH: 30, height3D: 38 });
        }
        const a2 = normAng(gapAng + dir * 0.68);
        addRingWithGap(R0 + 136, 36, a2, stdGap + 0.12, { profile: 'notch', height3D: 36 });
        exitGapAng = a2;
        extraClearance = 32;
      } else {
        // Classic Stepped Snail Spiral with bold architectural depth
        const steps = 4;
        const arcTotal = TAU - stdGap;
        const segSpan = arcTotal / steps;
        const s0 = normAng(gapAng + stdGap * 0.5);
        for (let k = 0; k < steps; k++) {
          const idx = dir > 0 ? k : (steps - 1 - k);
          addWall({ r: R0 + idx * 20, thick: 26 + (k % 2) * 14, start: s0 + k * segSpan, span: segSpan + 0.02, height3D: 32 + idx * 5 });
        }
        addCoin(R0 + 30, gapAng);
        exitGapAng = gapAng;
      }
    }

    // --- LEVEL 02: АЛЫЙ МИРАЖ (Disguised Solid-Looking Phantom Tiles that Vanish RIGHT in Front of Player + Massive Bastions!) ---
    else if (curLvl.id === 1) {
      const pick = patternCount % 4;
      if (pick === 0) {
        // Disguised Mirage Fortress Ring: looks like a SOLID fortress ring with a disguised mirage gate that dissolves right before impact!
        const mirageGap = lerp(1.36, 1.70, ease);
        addRingWithGap(R0, 32, gapAng, mirageGap, { profile: 'fortress', turretH: 26, height3D: 38 });
        // Disguised phantom door matches thickness & solid crimson color until close to player!
        addWall({
          r: R0, thick: 32,
          start: normAng(gapAng - mirageGap * 0.5 + 0.03),
          span: mirageGap - 0.06,
          kind: 'phantom',
          profile: 'arc',
          height3D: 38
        });
        addCoin(R0 + 16, gapAng);
        exitGapAng = gapAng;
        extraClearance = 32;
      } else if (pick === 1) {
        // Dual Massive Bastion Wedges + Disguised Mirage Seal across the corridor!
        const wedgeSpan = lerp(1.12, 0.96, ease);
        const laneHalf = (Math.PI - wedgeSpan) * 0.5;
        addWall({ r: R0, thick: 74, start: gapAng + laneHalf, span: wedgeSpan, profile: 'bastion', turretH: 40, height3D: 48 });
        addWall({ r: R0, thick: 74, start: gapAng + laneHalf + Math.PI, span: wedgeSpan, profile: 'bastion', turretH: 40, height3D: 48 });
        // Disguised bar blocking the gap, dissolves dramatically right in front of the player
        addWall({ r: R0 + 16, thick: 28, start: gapAng - laneHalf + 0.04, span: laneHalf * 2 - 0.08, kind: 'phantom', height3D: 36 });
        addCoin(R0 + 38, gapAng);
        exitGapAng = gapAng;
        extraClearance = 44;
      } else if (pick === 2) {
        // Splitting / Rejoining Armored Blades + Disguised Decoy
        const baseGap = lerp(1.14, 1.40, ease);
        addSymmetricPair(R0, 26, gapAng, baseGap, { kind: 'split', profile: 'blade', turretH: 32, oscAmp: 0.14, flip: dir > 0, height3D: 38 });
        exitGapAng = gapAng;
        extraClearance = 24;
      } else {
        // Notched Bastion + Disguised Inner Phantom Plug
        const mirageW = lerp(1.30, 1.56, ease);
        addRingWithGap(R0, 42, gapAng, mirageW, { profile: 'notch', height3D: 42 });
        addWall({ r: R0 + 6, thick: 30, start: normAng(gapAng - mirageW * 0.5 + 0.04), span: mirageW - 0.08, kind: 'phantom', height3D: 40 });
        exitGapAng = gapAng;
        extraClearance = 30;
      }
    }

    // --- LEVEL 03: ЗОЛОТОЙ МЕХАНИЗМ (Clockwork Gears, Pumping Radial Pistons, Chevron Blades + Core Lasers) ---
    else if (curLvl.id === 2) {
      const pick = patternCount % 4;
      if (pick === 0) {
        // Rotating Clockwork Gear Crown
        const g = lerp(1.28, 1.62, ease);
        const rot = dir * 0.26;
        addRingWithGap(R0, 30, gapAng, g, { kind: 'gear', rotSpd: rot, height3D: 42 });
        if (Math.random() < 0.6) addCoin(R0 + 15, gapAng);
        exitGapAng = normAng(gapAng + rot * 1.4);
      } else if (pick === 1) {
        // Pumping Clockwork Pistons (rhythmic radial hammers!)
        const pGap = lerp(1.12, 1.38, ease);
        addSymmetricPair(R0, 28, gapAng, pGap, { profile: 'piston', turretH: 34, phase: 0, rotSpd: dir * 0.18, height3D: 44 });
        addCoin(R0 + 18, gapAng);
        exitGapAng = gapAng;
        extraClearance = 30;
      } else if (pick === 2) {
        // Massive Golden Bastion Turret + Counter-Rotating Outer Gear
        const monSpan = lerp(2.45, 2.2, ease);
        addWall({ r: R0, thick: 64, start: normAng(gapAng + stdGap * 0.55), span: monSpan, profile: 'bastion', turretH: 42, rotSpd: 0.16, height3D: 48 });
        const a2 = normAng(gapAng + dir * 0.72);
        addRingWithGap(R0 + 144, 26, a2, stdGap + 0.14, { kind: 'gear', rotSpd: -0.22, height3D: 36 });
        exitGapAng = a2;
        extraClearance = 40;
      } else {
        // Triple Swept Golden Turbine Blades
        const open = lerp(0.84, 1.0, ease);
        const span = TAU / 3 - open;
        const rot = -dir * 0.22;
        for (let k = 0; k < 3; k++) {
          addWall({ r: R0, thick: 24, start: gapAng + open * 0.5 + k * (TAU / 3), span, profile: 'blade', turretH: 38, rotSpd: rot, flip: dir < 0, height3D: 40 });
        }
        if (Math.random() < 0.55) addCoin(R0 + 16, gapAng);
        exitGapAng = gapAng;
        extraClearance = 28;
      }
    }

    // --- LEVEL 04: ДВОЙНАЯ ПРИЗМА (100% 180°-Symmetric Sculptural Wings, Twin Bastions, Twin Chevrons & Breathing Gates) ---
    else {
      const pick = patternCount % 4;
      if (pick === 0) {
        // Twin Sculptural Prism Wings (breathing gently, guaranteed wide safe opening!)
        const safeBaseGap = Math.max(1.22, dualGap);
        addSymmetricPair(R0, 26, gapAng, safeBaseGap, { kind: 'breathe', profile: 'wing', turretH: 34, oscAmp: 0.12, phase: 0, height3D: 42 });
        if (Math.random() < 0.65) {
          addCoin(R0 + 15, gapAng);
          addCoin(R0 + 15, gapAng + Math.PI);
        }
        exitGapAng = gapAng;
        extraClearance = 24;
      } else if (pick === 1) {
        // Twin Stepped Bastion Monoliths (massive architectural pair at 180°!)
        const bGap = lerp(1.16, 1.40, ease);
        addSymmetricPair(R0, 52, gapAng, bGap, { profile: 'bastion', turretH: 36, height3D: 48 });
        addCoin(R0 + 26, gapAng);
        exitGapAng = gapAng;
        extraClearance = 42;
      } else if (pick === 2) {
        // Flowing Twin Chevron Staircase (3 crystalline pairs)
        const step = dir * 0.42;
        for (let k = 0; k < 3; k++) {
          const a = normAng(gapAng + k * step);
          const r = R0 + k * 116;
          addSymmetricPair(r, 22, a, dualGap + 0.08, { profile: 'chevron', turretH: 24, height3D: 34 + k * 4 });
          if (k === 1) addCoin(r + 12, a);
          exitGapAng = a;
        }
        extraClearance = 36;
      } else {
        // Symmetric 4-Way Swept Turbine Blades (still 100% 180°-symmetric!)
        const open = lerp(0.74, 0.88, ease);
        const span = Math.PI * 0.5 - open;
        const rot = dir * 0.24;
        for (let k = 0; k < 4; k++) {
          addWall({ r: R0, thick: 22, start: gapAng + open * 0.5 + k * Math.PI * 0.5, span, profile: 'blade', turretH: 32, rotSpd: rot, height3D: 38 });
        }
        exitGapAng = gapAng;
        extraClearance = 28;
      }
    }

    lastSafeGapAng = exitGapAng;
    const safeTurnTime = (maxDelta / (TURN_SPEED * 0.68)) + 0.34;
    nextRequiredClearance = Math.max(134, safeTurnTime * wallSpd) + extraClearance;
  }

  // ===== PARTICLES & SHATTER PHYSICS =====
  function emitSparks(x, y, nx, ny, count, color, speedMul = 1) {
    for (let i = 0; i < count; i++) {
      const spread = (Math.random() - 0.5) * 1.9;
      const baseA = Math.atan2(ny, nx) + spread;
      const spd = (80 + Math.random() * 175) * speedMul;
      sparks.push({
        x, y,
        vx: Math.cos(baseA) * spd,
        vy: Math.sin(baseA) * spd,
        life: 0.25 + Math.random() * 0.28,
        maxLife: 0.53,
        size: 1.8 + Math.random() * 2.4,
        color
      });
    }
  }

  function shatterAt(ang, scale, color) {
    const r = ORBIT_R + player.radialBounce;
    const ox = Math.cos(ang) * r;
    const oy = Math.sin(ang) * r;
    emitSparks(ox, oy, Math.cos(ang), Math.sin(ang), 24, '#ffffff', 1.35);
    for (let i = 0; i < 18; i++) {
      const a = (i / 18) * TAU + (Math.random() - 0.5) * 0.4;
      const spd = 110 + Math.random() * 230;
      const sz = (3.4 + Math.random() * 5.2) * Math.sqrt(scale);
      shards.push({
        x: ox + (Math.random() - 0.5) * 8,
        y: oy + (Math.random() - 0.5) * 8,
        vx: Math.cos(a) * spd,
        vy: Math.sin(a) * spd,
        rot: Math.random() * TAU,
        vrot: (Math.random() - 0.5) * 15,
        sz,
        life: 1.05 + Math.random() * 0.5,
        maxLife: 1.55,
        color: i % 3 === 0 ? '#ffffff' : color
      });
    }
  }

  function addFloatText(x, y, text, color) {
    floatTexts.push({ x, y, text, color, life: 0.85, maxLife: 0.85 });
  }

  function triggerDeath(hitAng) {
    const pal = getDynamicPalette();
    playSfx('shatter');
    vibe([35, 30, 55]);
    hitStop = 0.08;
    shake = 13;
    shatterAt(hitAng, player.scale, pal.accentA);
    if (duality.active) {
      shatterAt(normAng(hitAng + Math.PI), player.scale, '#00f5ff');
    }
    mode = 'dying';
    deathTimer = 0.92;
    if (runTime > (save.best[curLvl.id] || 0)) {
      save.best[curLvl.id] = runTime;
    }
    persist();
  }

  // ===== EXACT PROFILE-AWARE COLLISION (SIDE SLIDE = SAFE, FRONTAL HIT = DEATH) =====
  function processCloneCollisions(cloneAng, dt, wallSpd) {
    const pR = ORBIT_R + player.radialBounce;
    const halfW = (PLAYER_BASE_W * 0.42 * player.scale) / pR;
    const noseR = pR + PLAYER_BASE_H * 0.44 * player.scale;
    const tailR = pR - PLAYER_BASE_H * 0.30 * player.scale;
    let pushedAng = cloneAng;
    let died = false;

    for (let i = 0; i < walls.length; i++) {
      const w = walls[i];
      if (w.vanished) continue;
      // Disguised phantom tiles are already dissolving & non-lethal once below r = 96 so last-moment vanish is 100% fair!
      if (w.kind === 'phantom' && w.r < 96) continue;

      // Compute exact profile radial bounds at player's angle inside this wall
      const relAng = normAng(pushedAng - w.start);
      const f = clamp(relAng / w.span, 0, 1);
      const bounds = getWallRadialProfile(w, f);
      const innerR = bounds.rIn;
      const outerR = bounds.rOut;
      const prevInnerR = innerR + wallSpd * dt;

      // Near Miss bonus
      if (!w.nearAwarded && !player.phasing && outerR < pR && outerR > pR - wallSpd * dt - 8) {
        const dStart = Math.abs(angDiff(pushedAng, w.start));
        const dEnd = Math.abs(angDiff(pushedAng, w.start + w.span));
        const nearThresh = halfW + 0.16;
        if ((dStart < nearThresh || dEnd < nearThresh) && !isAngleInArc(pushedAng, w.start, w.span)) {
          w.nearAwarded = true;
          if (player.nearMissCd <= 0) {
            player.nearMissCd = 0.48;
            save.coins += 1;
            runCoins += 1;
            coinHud.textContent = `◈ ${save.coins}`;
            playSfx('nearmiss');
            const mx = Math.cos(pushedAng) * pR;
            const my = Math.sin(pushedAng) * pR;
            emitSparks(mx, my, Math.cos(pushedAng), Math.sin(pushedAng), 8, '#ffd800', 0.8);
            addFloatText(mx, my - 12, '+1 ◈', '#ffd800');
          }
        }
      }

      if (innerR > noseR || outerR < tailR) continue;

      const inCore = isAngleInArc(pushedAng, w.start, w.span);
      const inLeft = isAngleInArc(pushedAng - halfW, w.start, w.span);
      const inRight = isAngleInArc(pushedAng + halfW, w.start, w.span);
      if (!inCore && !inLeft && !inRight) continue;

      if (player.phasing || player.grace > 0) continue;

      const dToStart = angDiff(pushedAng, w.start);
      const dToEnd = angDiff(pushedAng, normAng(w.start + w.span));
      const distStart = Math.abs(dToStart);
      const distEnd = Math.abs(dToEnd);
      const sideEdgeMargin = halfW + 0.24;

      const isAlreadyPastNose = innerR < pR - 1;
      const touchingSideEdge = !inCore || distStart < sideEdgeMargin || distEnd < sideEdgeMargin;

      if (isAlreadyPastNose && touchingSideEdge) {
        if (distStart <= distEnd) {
          pushedAng = normAng(w.start - halfW - 0.012);
          player.angVel = Math.min(player.angVel, -0.7);
        } else {
          pushedAng = normAng(w.start + w.span + halfW + 0.012);
          player.angVel = Math.max(player.angVel, 0.7);
        }
        player.radialVel -= 32;
        w.hitFlash = 1.0;
        w.vibeOff = (Math.random() < 0.5 ? 1 : -1) * 3.2;
        const sx = Math.cos(pushedAng) * pR;
        const sy = Math.sin(pushedAng) * pR;
        emitSparks(sx, sy, -Math.sin(pushedAng) * (distStart <= distEnd ? 1 : -1), Math.cos(pushedAng) * (distStart <= distEnd ? 1 : -1), 3, '#ffffff', 0.7);
        if (scrapeCooldown <= 0) {
          playSfx('scrape');
          vibe(7);
          scrapeCooldown = 0.08;
        }
      } else if (prevInnerR >= noseR - 12 || inCore) {
        died = true;
        break;
      }
    }

    if (!died && !player.phasing && player.grace <= 0) {
      for (const lz of lasers) {
        if (lz.state === 'fire') {
          if (Math.abs(angDiff(pushedAng, lz.ang)) < lz.halfWidth + halfW * 0.55) {
            died = true;
            break;
          }
        }
      }
    }

    return { ang: pushedAng, died };
  }

  // ===== MAIN UPDATE LOOP =====
  function update(dt) {
    if (bannerTimer > 0) {
      bannerTimer -= dt;
      if (bannerTimer <= 0) eventBanner.classList.remove('show');
    }

    for (const p of bgParticles) {
      p.r -= p.spd * dt * (1 + chromaAmt * 0.4);
      p.ang += 0.08 * dt * (curLvl.id === 1 ? -1 : 1);
      if (p.r < CORE_R) {
        p.r = 440 + Math.random() * 80;
        p.ang = Math.random() * TAU;
      }
    }
    for (let i = sonarRipples.length - 1; i >= 0; i--) {
      const rp = sonarRipples[i];
      rp.r += 230 * dt;
      rp.alpha -= 0.72 * dt;
      if (rp.alpha <= 0) sonarRipples.splice(i, 1);
    }

    if (mode === 'menu') {
      worldRot += 0.28 * dt;
      depth3D = lerp(depth3D, 0.35, dt * 2);
      chromaAmt = lerp(chromaAmt, 0, dt * 3);
      camTiltX = Math.sin(performance.now() * 0.00065) * 0.26;
      camTiltY = Math.cos(performance.now() * 0.00048) * 0.15;
      return;
    }

    if (hitStop > 0) {
      hitStop -= dt;
      return;
    }

    // Sparks & ricocheting shards
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.vx *= Math.pow(0.18, dt);
      s.vy *= Math.pow(0.18, dt);
      const dist = Math.hypot(s.x, s.y);
      if (dist < CORE_R + 2 && dist > 0.1) {
        const nx = s.x / dist, ny = s.y / dist;
        const dot = s.vx * nx + s.vy * ny;
        if (dot < 0) { s.vx -= 1.8 * dot * nx; s.vy -= 1.8 * dot * ny; }
        s.x = nx * (CORE_R + 3);
        s.y = ny * (CORE_R + 3);
      }
      s.life -= dt;
      if (s.life <= 0) sparks.splice(i, 1);
    }

    for (let i = shards.length - 1; i >= 0; i--) {
      const sh = shards[i];
      sh.x += sh.vx * dt;
      sh.y += sh.vy * dt;
      sh.rot += sh.vrot * dt;
      sh.vx *= Math.pow(0.32, dt);
      sh.vy *= Math.pow(0.32, dt);
      const dist = Math.hypot(sh.x, sh.y);
      if (dist < CORE_R + sh.sz * 0.6 && dist > 0.1) {
        const nx = sh.x / dist, ny = sh.y / dist;
        const dot = sh.vx * nx + sh.vy * ny;
        if (dot < 0) {
          sh.vx -= 1.75 * dot * nx;
          sh.vy -= 1.75 * dot * ny;
          sh.vrot = -sh.vrot * 0.85;
          emitSparks(sh.x, sh.y, nx, ny, 2, '#ffffff', 0.45);
        }
        sh.x = nx * (CORE_R + sh.sz * 0.65);
        sh.y = ny * (CORE_R + sh.sz * 0.65);
      }
      const shAng = normAng(Math.atan2(sh.y, sh.x));
      for (const w of walls) {
        if (w.vanished) continue;
        if (isAngleInArc(shAng, w.start, w.span)) {
          const b = getWallRadialProfile(w, clamp(normAng(shAng - w.start) / w.span, 0, 1));
          if (dist >= b.rIn - sh.sz * 0.5 && dist <= b.rOut + sh.sz * 0.5) {
            const nx = sh.x / (dist || 1), ny = sh.y / (dist || 1);
            const dot = sh.vx * nx + sh.vy * ny;
            if ((dist < (b.rIn + b.rOut) * 0.5 && dot > 0) || (dist >= (b.rIn + b.rOut) * 0.5 && dot < 0)) {
              sh.vx -= 1.7 * dot * nx;
              sh.vy -= 1.7 * dot * ny;
            }
            break;
          }
        }
      }
      sh.life -= dt;
      if (sh.life <= 0) shards.splice(i, 1);
    }

    for (let i = floatTexts.length - 1; i >= 0; i--) {
      floatTexts[i].y -= 28 * dt;
      floatTexts[i].life -= dt;
      if (floatTexts[i].life <= 0) floatTexts.splice(i, 1);
    }

    shake = Math.max(0, shake - 32 * dt);

    if (mode === 'dying') {
      deathTimer -= dt;
      worldRot += worldSpin * 0.25 * dt;
      if (deathTimer <= 0) {
        mode = 'over';
        const t = tr();
        document.getElementById('overLevel').textContent = `${curLvl.num} · ${curLvl.name[save.lang]}`;
        document.getElementById('overTime').textContent = formatTime(runTime);
        document.getElementById('overBest').textContent = `${t.best} ${formatTime(save.best[curLvl.id] || 0)}`;
        document.getElementById('overRunCoins').textContent = `+${runCoins} ◈`;
        overOverlay.classList.remove('hidden');
      }
      return;
    }
    if (mode !== 'play') return;

    // ===== ACTIVE GAMEPLAY UPDATE =====
    runTime += dt;
    timerBox.textContent = formatTime(runTime);
    if (runTime > (save.best[curLvl.id] || 0)) {
      bestHud.textContent = `${tr().best}: ${formatTime(runTime)}`;
    }
    if (player.grace > 0) player.grace -= dt;
    if (player.nearMissCd > 0) player.nearMissCd -= dt;
    if (scrapeCooldown > 0) scrapeCooldown -= dt;

    const t = tr();
    const speedTier = Math.floor(runTime / 10);
    if (speedTier > lastSpeedTier) {
      lastSpeedTier = speedTier;
      if (speedTier === 2 || (speedTier > 2 && speedTier % 3 === 2)) {
        showBanner(t.bannerChroma, 2.2);
        vibe([18, 26, 30]);
      } else if (speedTier === 3) {
        showBanner(t.bannerOverdrive, 1.8);
        vibe(24);
      } else if (speedTier === 1) {
        showBanner(t.banner3D, 1.6);
        vibe(16);
      } else {
        showBanner(t.bannerSpeed(Math.min(40, speedTier * 5)), 1.4);
      }
    }

    // ===== SMOOTH GRADIENT IRIDESCENCE (20:00–30:00 + cyclic every 30s) =====
    // Replaces 3D Hyper-Tunnel with lush base-color gradient flow!
    let targetChroma = 0;
    if (runTime >= 20.0) {
      const cyc30 = (runTime - 20.0) % 30.0;
      if (cyc30 <= 10.0) {
        targetChroma = Math.min(smoothstep(cyc30 / 1.8), smoothstep((10.0 - cyc30) / 1.8));
      }
    }
    chromaAmt = lerp(chromaAmt, targetChroma, 1 - Math.exp(-3.5 * dt));
    if (chromaAmt > 0.01) {
      chromaPhase += dt * 1.15;
      const pal = getDynamicPalette();
      document.documentElement.style.setProperty('--accent', pal.accentA);
    } else if (runTime > 19) {
      document.documentElement.style.setProperty('--accent', curLvl.accent);
    }

    // Smooth 3D phases (retained smoothly without any hyper-tunnel rush!)
    let target3D = 0;
    if (runTime >= 10.0 && runTime <= 18.8) {
      target3D = Math.min(smoothstep((runTime - 10.0) / 1.8), smoothstep((18.8 - runTime) / 1.8)) * 0.84;
    } else if (runTime > 20.0 && runTime < 30.0) {
      // Gentle sculptural 3D lift during Gradient Flow so the iridescent walls look luminous
      target3D = chromaAmt * 0.58;
    } else if (runTime >= 32.0) {
      const cyc = (runTime - 32.0) % 18.0;
      if (cyc < 11.0) {
        target3D = Math.min(smoothstep(cyc / 1.8), smoothstep((11.0 - cyc) / 1.8)) * 0.86;
      }
    }
    depth3D = lerp(depth3D, target3D, 1 - Math.exp(-3.5 * dt));

    const speedMul = 1 + Math.min(0.40, speedTier * 0.05);
    const wallSpd = curLvl.baseSpeed * speedMul;

    // Beat Sequencer
    const effBpm = curLvl.bpm * (1 + Math.min(0.12, speedTier * 0.02));
    const stepDur = 60 / effBpm / 2;
    beatAccum += dt;
    while (beatAccum >= stepDur) {
      beatAccum -= stepDur;
      const idx = stepIdx % 8;
      if (idx % 2 === 0) {
        playKick(idx === 0);
        beatPulse = 1.0;
        if (curLvl.id === 0 || chromaAmt > 0.25) {
          sonarRipples.push({ r: CORE_R + 4, alpha: 0.42 + chromaAmt * 0.2 });
        }
      }
      playBass(curLvl.notes[idx], stepDur * 0.9, chromaAmt > 0.25);
      if (chromaAmt > 0.25 && idx % 2 === 1) {
        playShimmerPad(curLvl.lead[idx], stepDur);
      }
      if (stepIdx % 4 === 2 || chromaAmt > 0.35) {
        playHat(chromaAmt > 0.35 ? 0.1 : 0.06);
      }
      if (runTime >= 30 && idx % 2 === 0) {
        playLead(curLvl.lead[idx], stepDur * 0.72);
      }
      stepIdx++;
    }
    beatPulse = Math.max(0, beatPulse - dt * 4.2);

    // Smooth Beat Camera
    let tX = 0, tY = 0;
    if (curLvl.camProfile === 'dive') {
      tX = depth3D * 0.48;
      tY = Math.sin(runTime * 0.85) * 0.20 * depth3D;
    } else if (curLvl.camProfile === 'bank') {
      tX = depth3D * 0.40;
      tY = Math.sin(runTime * 1.15) * 0.36 * depth3D;
    } else if (curLvl.camProfile === 'iso') {
      tX = depth3D * 0.52;
      tY = Math.cos(runTime * 0.8) * 0.32 * depth3D;
    } else {
      tX = (0.34 + Math.sin(runTime * 1.0) * 0.16) * depth3D;
      tY = Math.cos(runTime * 0.9) * 0.34 * depth3D;
    }
    camTiltX = lerp(camTiltX, tX, 1 - Math.exp(-4.0 * dt));
    camTiltY = lerp(camTiltY, tY, 1 - Math.exp(-4.0 * dt));
    const targetZoom = 1 + beatPulse * 0.03 + chromaAmt * 0.035;
    camZoom = lerp(camZoom, targetZoom, 1 - Math.exp(-9 * dt));
    camSway = lerp(camSway, Math.sin(runTime * 1.8) * 0.02 * (1 + beatPulse * 0.65), 1 - Math.exp(-6 * dt));

    // World Rotation
    if (curLvl.id === 3) {
      const targetSpin = Math.sin(runTime * 0.38) * 0.56 * (1 + Math.min(0.25, speedTier * 0.04));
      worldSpin = lerp(worldSpin, targetSpin, 1 - Math.exp(-2.4 * dt));
    } else {
      const dirFlip = (curLvl.id === 1 && Math.floor(runTime / 15) % 2 === 1) ? -1 : 1;
      const targetSpin = curLvl.baseSpin * dirFlip * (1 + Math.min(0.3, speedTier * 0.05));
      worldSpin = lerp(worldSpin, targetSpin, 1 - Math.exp(-2.0 * dt));
    }
    worldRot += worldSpin * dt;

    // Level 4 Duality Split
    if (curLvl.id === 3) {
      if (!duality.active) {
        duality.respawnTimer -= dt;
        if (duality.respawnTimer <= 0) {
          duality.active = true;
          duality.splitBlend = 0;
          player.grace = 0.8;
          playSfx('split');
          vibe([18, 22, 22]);
          showBanner(t.bannerDual, 1.6);
        }
      } else {
        duality.splitBlend = lerp(duality.splitBlend, 1, 1 - Math.exp(-5.0 * dt));
      }
    }

    // Player Input, Phase Shield & Irreversible Growth
    const inp = getInput();
    const bothHeld = inp.left && inp.right;

    if (bothHeld && player.phaseFuel > 0) {
      player.phasing = true;
      player.phaseFuel = Math.max(0, player.phaseFuel - dt);
      const maxScale = save.perks.stabilizer ? 1.55 : 2.0;
      const usedFrac = 1 - (player.phaseFuel / player.phaseMax);
      const grown = 1.0 + usedFrac * (maxScale - 1.0);
      if (grown > player.scale) player.scale = grown;
    } else {
      player.phasing = false;
    }

    let targetAngVel = 0;
    if (!bothHeld) {
      if (inp.right) targetAngVel = TURN_SPEED;
      else if (inp.left) targetAngVel = -TURN_SPEED;
    }
    player.angVel = lerp(player.angVel, targetAngVel, 1 - Math.exp(-26 * dt));
    if (Math.abs(player.angVel) < 0.02 && targetAngVel === 0) player.angVel = 0;
    player.ang = normAng(player.ang + player.angVel * dt);

    player.radialVel += (-player.radialBounce * 180 - player.radialVel * 14) * dt;
    player.radialBounce += player.radialVel * dt;

    // Spatial Wave Spawner
    const spawnR = getSpawnRadius();
    if (getOutermostWallOuterR() <= spawnR - nextRequiredClearance) {
      spawnFairWave(wallSpd);
    }

    // Update Walls (including DISGUISED LAST-MOMENT VANISH on Level 2!)
    for (let i = walls.length - 1; i >= 0; i--) {
      const w = walls[i];
      w.r -= wallSpd * dt;
      w.start = normAng(w.start + w.rotSpd * dt);
      if (w.hitFlash > 0) w.hitFlash = Math.max(0, w.hitFlash - dt * 5);
      w.vibeOff *= Math.pow(0.01, dt);

      if (w.kind === 'phantom' && !w.vanished) {
        // Disguised as a solid wall until close to the player!
        // Between r = 136 and r = 84 it rapidly dissolves right in front of the player!
        if (w.r < 138) {
          if (!w.vanishSfxDone) {
            w.vanishSfxDone = true;
            playSfx('vanish');
          }
          w.phantomAlpha = clamp((w.r - 84) / (138 - 84), 0, 1);
          // Dissolving crimson-white glitch sparks right before the player
          if (Math.random() < 0.8) {
            const pa = w.start + Math.random() * w.span;
            const pr = w.r + Math.random() * w.thick;
            emitSparks(Math.cos(pa) * pr, Math.sin(pa) * pr, Math.cos(pa), Math.sin(pa), 2, Math.random() < 0.45 ? '#ffffff' : curLvl.accent, 0.55);
          }
          if (w.r <= 85) {
            w.vanished = true;
            w.phantomAlpha = 0;
          }
        }
      } else if (w.kind === 'split') {
        const osc = Math.sin(runTime * 2.6 + w.phase);
        w.span = clamp(w.baseSpan + osc * w.oscAmp, 0.4, Math.PI - 0.96);
        w.start = normAng(w.baseStart - osc * w.oscAmp * 0.5);
      } else if (w.kind === 'breathe') {
        const osc = Math.sin(runTime * 2.8 + w.phase);
        w.span = clamp(w.baseSpan + osc * w.oscAmp, 0.42, Math.PI - 0.96);
      }

      if (w.r + w.thick + (w.turretH || 0) < CORE_R - 8) walls.splice(i, 1);
    }

    // Level 3 Solar Core Lasers
    if (curLvl.id === 2 && runTime > 3.5) {
      laserTimer -= dt;
      if (laserTimer <= 0) {
        const aimAng = normAng(player.ang + (Math.random() - 0.5) * 0.4);
        lasers.push({
          ang: aimAng,
          state: 'warn',
          timer: 1.70,
          maxWarn: 1.70,
          ticks: 3,
          halfWidth: 0.082
        });
        laserTimer = Math.max(3.6, 5.4 - speedTier * 0.22);
      }
    }
    for (let i = lasers.length - 1; i >= 0; i--) {
      const lz = lasers[i];
      lz.timer -= dt;
      if (lz.state === 'warn') {
        const remainTicks = Math.ceil(lz.timer / 0.52);
        if (remainTicks < lz.ticks && remainTicks >= 0) {
          lz.ticks = remainTicks;
          playSfx('tick');
        }
        if (lz.timer <= 0) {
          lz.state = 'fire';
          lz.timer = 0.42;
          playSfx('laser');
          shake = Math.max(shake, 4.0);
        }
      } else if (lz.timer <= 0) {
        lasers.splice(i, 1);
      }
    }

    // Coins
    const pR = ORBIT_R + player.radialBounce;
    const magnetRange = save.perks.magnet ? 115 : 28 * player.scale;
    for (let i = coins.length - 1; i >= 0; i--) {
      const c = coins[i];
      c.r -= wallSpd * dt;
      c.pulse += dt * 5;
      const checkAngs = duality.active ? [player.ang, normAng(player.ang + Math.PI * duality.splitBlend)] : [player.ang];
      for (const a of checkAngs) {
        const dx = Math.cos(c.ang) * c.r - Math.cos(a) * pR;
        const dy = Math.sin(c.ang) * c.r - Math.sin(a) * pR;
        const dist = Math.hypot(dx, dy);
        if (save.perks.magnet && dist < magnetRange && dist > 1) {
          c.r = lerp(c.r, pR, dt * 7);
          c.ang = normAng(c.ang + angDiff(a, c.ang) * dt * 8);
        }
        if (dist < 24 * Math.sqrt(player.scale)) {
          c.taken = true;
          save.coins += 1;
          runCoins += 1;
          coinHud.textContent = `◈ ${save.coins}`;
          playSfx('coin');
          vibe(10);
          emitSparks(Math.cos(c.ang) * c.r, Math.sin(c.ang) * c.r, Math.cos(c.ang), Math.sin(c.ang), 10, '#ffd800', 0.85);
          addFloatText(Math.cos(c.ang) * c.r, Math.sin(c.ang) * c.r - 10, '+1 ◈', '#ffd800');
          break;
        }
      }
      if (c.taken || c.r < CORE_R) coins.splice(i, 1);
    }

    // Collisions
    if (curLvl.id === 3 && duality.active) {
      const angA = player.ang;
      const angB = normAng(player.ang + Math.PI * duality.splitBlend);
      const resA = processCloneCollisions(angA, dt, wallSpd);
      const resB = processCloneCollisions(angB, dt, wallSpd);

      if (resA.died && resB.died) {
        triggerDeath(angA);
      } else if (resA.died || resB.died) {
        const hitAng = resA.died ? angA : angB;
        const survAng = resA.died ? angB : angA;
        playSfx('shatter');
        vibe([25, 25, 20]);
        hitStop = 0.06;
        shake = 9;
        shatterAt(hitAng, player.scale, resA.died ? getDynamicPalette().accentA : '#00f5ff');
        duality.active = false;
        duality.splitBlend = 0;
        duality.respawnTimer = 9.0;
        player.ang = survAng;
        player.grace = 0.9;
        showBanner(t.bannerCloneLost, 1.7);
      } else {
        if (resA.ang !== angA) player.ang = resA.ang;
        else if (resB.ang !== angB) player.ang = normAng(resB.ang - Math.PI * duality.splitBlend);
      }
    } else {
      const res = processCloneCollisions(player.ang, dt, wallSpd);
      if (res.died) triggerDeath(player.ang);
      else player.ang = res.ang;
    }
  }

  // ===== 3D PROJECTION =====
  function project(wx, wy, wz) {
    const rot = worldRot + camSway;
    const cr = Math.cos(rot), sr = Math.sin(rot);
    let x = wx * cr - wy * sr;
    let y = wx * sr + wy * cr;
    let z = wz * depth3D;

    const cx = Math.cos(camTiltX), sx = Math.sin(camTiltX);
    const y1 = y * cx - z * sx;
    const z1 = y * sx + z * cx;

    const cy = Math.cos(camTiltY), sy = Math.sin(camTiltY);
    const x2 = x * cy + z1 * sy;
    const z2 = -x * sy + z1 * cy;

    const fov = 720;
    const persp = fov / Math.max(170, fov - z2);
    const s = persp * camZoom * arenaScale;
    return { x: W * 0.5 + x2 * s, y: H * 0.5 + y1 * s, s };
  }

  // ===== LEVEL-SPECIFIC BACKGROUNDS + SMOOTH GRADIENT FLOW AURORA =====
  function drawLevelBackground(pal) {
    const t = performance.now() * 0.001;

    // 1. Base radial gradient (smoothly shifts hue during Chroma Flow!)
    const grad = ctx.createRadialGradient(W * 0.5, H * 0.5, 16 * arenaScale, W * 0.5, H * 0.5, Math.max(W, H) * 0.74);
    grad.addColorStop(0, pal.bgInner);
    grad.addColorStop(0.55, pal.bgMid);
    grad.addColorStop(1, pal.bgDeep);
    ctx.fillStyle = grad;
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // 2. Smooth Gradient Iridescence Aurora Lobes (20:00–30:00 CHROMA FLOW!)
    if (chromaAmt > 0.01) {
      ctx.save();
      const orbitR = Math.min(W, H) * 0.34;
      const lobes = [
        { x: W * 0.5 + Math.cos(chromaPhase * 0.7) * orbitR, y: H * 0.5 + Math.sin(chromaPhase * 0.7) * orbitR * 0.75, r: Math.max(W, H) * 0.52, col: pal.lobe1 },
        { x: W * 0.5 + Math.cos(chromaPhase * 0.7 + 2.1) * orbitR, y: H * 0.5 + Math.sin(chromaPhase * 0.7 + 2.1) * orbitR * 0.75, r: Math.max(W, H) * 0.48, col: pal.lobe2 },
        { x: W * 0.5 + Math.cos(chromaPhase * 0.55 + 4.2) * orbitR * 0.8, y: H * 0.5 + Math.sin(chromaPhase * 0.55 + 4.2) * orbitR * 0.65, r: Math.max(W, H) * 0.45, col: pal.lobe3 }
      ];
      ctx.globalCompositeOperation = 'lighter';
      for (const lb of lobes) {
        const lg = ctx.createRadialGradient(lb.x, lb.y, 10, lb.x, lb.y, lb.r);
        lg.addColorStop(0, lb.col);
        lg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = lg;
        ctx.fillRect(0, 0, W, H);
      }
      ctx.restore();
    }

    // 3. Unique Level Architectural Motif
    ctx.save();
    if (curLvl.id === 0) {
      ctx.strokeStyle = hsl(pal.hA, 90, 58, 0.09);
      ctx.lineWidth = 1.2;
      for (let k = 0; k < 6; k++) {
        const a = (k / 6) * TAU;
        const p1 = project(Math.cos(a) * CORE_R, Math.sin(a) * CORE_R, -12);
        const p2 = project(Math.cos(a) * 520, Math.sin(a) * 520, -12);
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
      }
    } else if (curLvl.id === 1) {
      ctx.strokeStyle = hsl(pal.hA, 90, 56, 0.10);
      ctx.lineWidth = 1;
      for (let rad = 110; rad <= 440; rad += 110) {
        ctx.beginPath();
        for (let s = 0; s <= 44; s++) {
          const a = (s / 44) * TAU;
          const p = project(Math.cos(a) * rad, Math.sin(a) * rad, -10);
          if (s === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();
        ctx.stroke();
      }
      const sweepA = t * 1.15;
      const c0 = project(0, 0, -8);
      ctx.beginPath();
      ctx.moveTo(c0.x, c0.y);
      for (let s = 0; s <= 12; s++) {
        const a = sweepA - (s / 12) * 0.72;
        const p = project(Math.cos(a) * 480, Math.sin(a) * 480, -8);
        ctx.lineTo(p.x, p.y);
      }
      ctx.closePath();
      ctx.fillStyle = hsl(pal.hA, 95, 55, 0.085);
      ctx.fill();
    } else if (curLvl.id === 2) {
      const drawBgGear = (rad, teeth, rotOff, alpha) => {
        ctx.strokeStyle = pal.accentA;
        ctx.globalAlpha = alpha;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        const total = teeth * 2;
        for (let i = 0; i <= total; i++) {
          const a = rotOff + (i / total) * TAU;
          const rr = rad + (i % 2 === 0 ? 18 : -6);
          const p = project(Math.cos(a) * rr, Math.sin(a) * rr, -22);
          if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();
        ctx.stroke();
      };
      drawBgGear(190, 16, t * 0.25, 0.11);
      drawBgGear(325, 24, -t * 0.18, 0.08);
      const c0 = project(0, 0, 0);
      const sg = ctx.createRadialGradient(c0.x, c0.y, 12 * arenaScale, c0.x, c0.y, 170 * arenaScale);
      sg.addColorStop(0, hsl(pal.hA, 95, 55, 0.16));
      sg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = sg;
      ctx.beginPath(); ctx.arc(c0.x, c0.y, 170 * arenaScale, 0, TAU); ctx.fill();
    } else {
      ctx.strokeStyle = hsl(pal.hB, 90, 62, 0.08);
      ctx.lineWidth = 1.2;
      for (let ring = 1; ring <= 3; ring++) {
        const rad = ring * 135;
        ctx.beginPath();
        for (let s = 0; s <= 6; s++) {
          const a = (s / 6) * TAU + (ring % 2) * 0.52;
          const p = project(Math.cos(a) * rad, Math.sin(a) * rad, -18);
          if (s === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();
        ctx.stroke();
      }
      if (mode === 'play') {
        const spinDir = worldSpin >= 0 ? 1 : -1;
        const indR = CORE_R + 14;
        ctx.strokeStyle = spinDir > 0 ? pal.accentA : '#00f5ff';
        ctx.globalAlpha = 0.35 + Math.abs(worldSpin) * 0.45;
        ctx.lineWidth = 2;
        for (let side = 0; side < 2; side++) {
          const base = side * Math.PI + t * spinDir * 1.4;
          ctx.beginPath();
          for (let s = 0; s <= 8; s++) {
            const a = base + (s / 8) * 0.55 * spinDir;
            const p = project(Math.cos(a) * indR, Math.sin(a) * indR, 4);
            if (s === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
          }
          ctx.stroke();
        }
      }
    }

    // Sonar / Chroma harmonic ripples
    for (const rp of sonarRipples) {
      ctx.strokeStyle = chromaAmt > 0.2 ? pal.accentB : pal.accentA;
      ctx.globalAlpha = clamp(rp.alpha, 0, 1);
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      for (let s = 0; s <= 40; s++) {
        const a = (s / 40) * TAU;
        const p = project(Math.cos(a) * rp.r, Math.sin(a) * rp.r, -6);
        if (s === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      }
      ctx.closePath();
      ctx.stroke();
    }

    // Ambient motes
    for (const bp of bgParticles) {
      const p = project(Math.cos(bp.ang) * bp.r, Math.sin(bp.ang) * bp.r, -25);
      ctx.globalAlpha = bp.alpha * (curLvl.id === 3 || chromaAmt > 0.3 ? 0.78 : 0.42);
      ctx.fillStyle = curLvl.id === 3 && (bp.sz > 2.2) ? '#00f5ff' : pal.rim;
      ctx.fillRect(p.x, p.y, bp.sz * arenaScale, bp.sz * arenaScale);
    }
    ctx.restore();
  }

  // ===== SCULPTURAL 3D EXTRUDED WALL RENDERER WITH LIVE GRADIENT IRIDESCENCE =====
  function drawArchitecturalWall(w, pal) {
    const isGear = (w.kind === 'gear');
    const isPhantom = (w.kind === 'phantom');
    // Dense sampling for crisp stepped bastions, battlements, blades, and gears
    const segs = isGear
      ? Math.max(10, Math.ceil(w.span * 12))
      : (w.profile === 'bastion' || w.profile === 'fortress' || w.profile === 'notch')
        ? Math.max(24, Math.ceil(w.span * 26))
        : Math.max(10, Math.ceil(w.span * 16));

    const botOut = [], botIn = [], topOut = [], topIn = [];
    const zTop = w.height3D;

    for (let i = 0; i <= segs; i++) {
      const f = i / segs;
      const a = w.start + f * w.span;
      let { rIn, rOut } = getWallRadialProfile(w, f);
      if (isGear) {
        const tooth = (i % 2 === 0 ? 7.5 : -2.5);
        rOut += tooth;
        rIn += tooth * 0.35;
      }
      const ca = Math.cos(a), sa = Math.sin(a);
      topOut.push(project(ca * rOut, sa * rOut, zTop));
      topIn.push(project(ca * rIn, sa * rIn, zTop));
      if (depth3D > 0.04) {
        botOut.push(project(ca * rOut, sa * rOut, 0));
        botIn.push(project(ca * rIn, sa * rIn, 0));
      }
    }

    // Disguised Phantom Tile Visual Logic (Level 2):
    // Looks SOLID & identical to normal crimson walls from afar!
    // At r < 185 gives a very subtle hairline shimmer, then dissolves rapidly right before the player (r = 138 -> 84)!
    let alpha = 1;
    let subtleGlitchRim = false;
    if (isPhantom) {
      alpha = clamp(w.phantomAlpha, 0, 1);
      if (w.r < 185 && w.r >= 138) {
        // Subtle barely-there shimmer clue for sharp-eyed players
        const pulse = Math.sin(runTime * 22 + w.start * 3);
        if (pulse > 0.65) {
          alpha = 0.88;
          subtleGlitchRim = true;
        }
      } else if (w.r < 138) {
        // Rapid dissolve flicker right before the player
        subtleGlitchRim = true;
      }
    }

    // Build smooth gradient fill across the wall (active subtly always, lushly during Chroma Flow!)
    const pStart = topOut[0];
    const pEnd = topOut[segs];
    let fillTop = pal.accentA;
    let fillSide = pal.sideA;
    if (w.hitFlash > 0.05) {
      fillTop = '#ffffff';
    } else if (chromaAmt > 0.03) {
      const gTop = ctx.createLinearGradient(pStart.x, pStart.y, pEnd.x, pEnd.y);
      gTop.addColorStop(0, pal.accentA);
      gTop.addColorStop(0.5, pal.accentB);
      gTop.addColorStop(1, pal.accentA);
      fillTop = gTop;

      const gSide = ctx.createLinearGradient(pStart.x, pStart.y, pEnd.x, pEnd.y);
      gSide.addColorStop(0, pal.sideA);
      gSide.addColorStop(0.5, pal.sideB);
      gSide.addColorStop(1, pal.sideA);
      fillSide = gSide;
    }

    ctx.save();
    ctx.globalAlpha = alpha;

    // 3D Extruded Side Walls
    if (depth3D > 0.04) {
      ctx.fillStyle = fillSide;
      ctx.beginPath();
      for (let i = 0; i <= segs; i++) {
        if (i === 0) ctx.moveTo(botIn[i].x, botIn[i].y); else ctx.lineTo(botIn[i].x, botIn[i].y);
      }
      for (let i = segs; i >= 0; i--) ctx.lineTo(topIn[i].x, topIn[i].y);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      for (let i = 0; i <= segs; i++) {
        if (i === 0) ctx.moveTo(botOut[i].x, botOut[i].y); else ctx.lineTo(botOut[i].x, botOut[i].y);
      }
      for (let i = segs; i >= 0; i--) ctx.lineTo(topOut[i].x, topOut[i].y);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(botIn[0].x, botIn[0].y); ctx.lineTo(botOut[0].x, botOut[0].y);
      ctx.lineTo(topOut[0].x, topOut[0].y); ctx.lineTo(topIn[0].x, topIn[0].y);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(botIn[segs].x, botIn[segs].y); ctx.lineTo(botOut[segs].x, botOut[segs].y);
      ctx.lineTo(topOut[segs].x, topOut[segs].y); ctx.lineTo(topIn[segs].x, topIn[segs].y);
      ctx.closePath();
      ctx.fill();
    }

    // Top Architectural Cap
    ctx.beginPath();
    for (let i = 0; i <= segs; i++) {
      if (i === 0) ctx.moveTo(topOut[i].x, topOut[i].y); else ctx.lineTo(topOut[i].x, topOut[i].y);
    }
    for (let i = segs; i >= 0; i--) ctx.lineTo(topIn[i].x, topIn[i].y);
    ctx.closePath();
    ctx.fillStyle = fillTop;
    ctx.fill();

    // Crisp leading-edge inner rim highlight (gives architectural sharpness & readability)
    ctx.beginPath();
    for (let i = 0; i <= segs; i++) {
      if (i === 0) ctx.moveTo(topIn[i].x, topIn[i].y); else ctx.lineTo(topIn[i].x, topIn[i].y);
    }
    ctx.strokeStyle = subtleGlitchRim ? '#ffffff' : (w.hitFlash > 0.05 ? '#ffffff' : pal.rim);
    ctx.lineWidth = (subtleGlitchRim ? 2.2 : (1.5 + depth3D * 0.8)) * arenaScale;
    ctx.stroke();

    ctx.restore();
  }

  function drawSkinLetter(ang, scale, pal, isPhasing, isCloneB) {
    const r = ORBIT_R + player.radialBounce;
    const ux = Math.cos(ang), uy = Math.sin(ang);
    const vx = -uy, vy = ux;
    const sz = 9.5 * scale;

    if (depth3D > 0.08) {
      const sh = project(ux * r, uy * r, 0);
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.beginPath();
      ctx.arc(sh.x, sh.y, sz * 0.72 * sh.s, 0, TAU);
      ctx.fill();
      ctx.restore();
    }

    const zLift = 12 * depth3D;
    const toScreen = (lx, ly) => project(ux * r + vx * lx * sz + ux * ly * sz, uy * r + vy * lx * sz + uy * ly * sz, zLift);

    ctx.save();
    if (isPhasing) {
      ctx.globalAlpha = 0.65 + Math.sin(runTime * 28) * 0.25;
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 16;
    } else if (player.grace > 0 && Math.floor(runTime * 18) % 2 === 0) {
      ctx.globalAlpha = 0.45;
    } else {
      ctx.shadowColor = isCloneB ? '#00f5ff' : pal.accentA;
      ctx.shadowBlur = 11;
    }

    ctx.strokeStyle = isPhasing ? '#ffffff' : (isCloneB ? '#00f5ff' : pal.rim);
    ctx.lineWidth = Math.max(2.2, 2.6 * Math.sqrt(scale) * arenaScale);
    ctx.lineJoin = 'miter';
    ctx.lineCap = 'square';

    const skin = save.skin || 'M';
    if (skin === 'M') {
      const pts = [[-0.95, -0.75], [-0.72, 0.95], [0, 0.05], [0.72, 0.95], [0.95, -0.75]].map(p => toScreen(p[0], p[1]));
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();
    } else if (skin === 'A') {
      const p1 = toScreen(-0.85, -0.8), p2 = toScreen(0, 1.05), p3 = toScreen(0.85, -0.8);
      const b1 = toScreen(-0.46, -0.15), b2 = toScreen(0.46, -0.15);
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y);
      ctx.moveTo(b1.x, b1.y); ctx.lineTo(b2.x, b2.y);
      ctx.stroke();
    } else {
      const a1 = toScreen(-0.82, -0.82), a2 = toScreen(0.82, 0.88);
      const b1 = toScreen(0.82, -0.82), b2 = toScreen(-0.82, 0.88);
      ctx.beginPath();
      ctx.moveTo(a1.x, a1.y); ctx.lineTo(a2.x, a2.y);
      ctx.moveTo(b1.x, b1.y); ctx.lineTo(b2.x, b2.y);
      ctx.stroke();
    }

    if (isPhasing) {
      const c = project(ux * r, uy * r, zLift);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(c.x, c.y, sz * 1.45 * c.s, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawLevelCore(pal) {
    const coreZ = 18 * depth3D;
    const coreR = CORE_R + beatPulse * 2.5;
    const coreSteps = 44;

    if (depth3D > 0.06) {
      ctx.save();
      ctx.fillStyle = pal.sideA;
      ctx.beginPath();
      for (let i = 0; i <= coreSteps; i++) {
        const a = (i / coreSteps) * TAU;
        const p = project(Math.cos(a) * CORE_R, Math.sin(a) * CORE_R, 0);
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    ctx.save();
    ctx.beginPath();
    if (curLvl.id === 2) {
      const teeth = 12;
      const tot = teeth * 2;
      for (let i = 0; i <= tot; i++) {
        const a = (i / tot) * TAU + runTime * 0.6;
        const rr = coreR + (i % 2 === 0 ? 4.5 : -1.5);
        const p = project(Math.cos(a) * rr, Math.sin(a) * rr, coreZ);
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      }
    } else {
      for (let i = 0; i <= coreSteps; i++) {
        const a = (i / coreSteps) * TAU;
        const p = project(Math.cos(a) * coreR, Math.sin(a) * coreR, coreZ);
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      }
    }
    ctx.closePath();
    ctx.fillStyle = pal.bgDeep;
    ctx.fill();

    if (curLvl.id === 3) {
      for (let half = 0; half < 2; half++) {
        ctx.beginPath();
        for (let i = 0; i <= 22; i++) {
          const a = half * Math.PI + (i / 22) * Math.PI;
          const p = project(Math.cos(a) * coreR, Math.sin(a) * coreR, coreZ);
          if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        }
        ctx.strokeStyle = half === 0 ? pal.accentA : '#00f5ff';
        ctx.lineWidth = 4.2 * arenaScale;
        ctx.stroke();
      }
    } else {
      ctx.strokeStyle = pal.accentA;
      ctx.lineWidth = 4.2 * arenaScale;
      ctx.stroke();
    }

    if (curLvl.id === 1) {
      ctx.strokeStyle = hsl(pal.hA, 95, 58, 0.55);
      ctx.lineWidth = 1.6;
      for (let k = 0; k < 4; k++) {
        const a = k * Math.PI * 0.5;
        const p1 = project(Math.cos(a) * (CORE_R - 11), Math.sin(a) * (CORE_R - 11), coreZ);
        const p2 = project(Math.cos(a) * (CORE_R - 3), Math.sin(a) * (CORE_R - 3), coreZ);
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
      }
    }

    if (mode === 'play') {
      const frac = player.phaseFuel / player.phaseMax;
      if (frac > 0.01) {
        const rG = CORE_R - 7.5;
        const gSteps = Math.max(4, Math.ceil(frac * 36));
        ctx.beginPath();
        for (let i = 0; i <= gSteps; i++) {
          const a = -Math.PI * 0.5 + (i / gSteps) * frac * TAU;
          const p = project(Math.cos(a) * rG, Math.sin(a) * rG, coreZ);
          if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        }
        ctx.strokeStyle = player.phasing ? '#ffffff' : 'rgba(255,255,255,0.48)';
        ctx.lineWidth = 2.4 * arenaScale;
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // ===== MAIN RENDER LOOP =====
  function draw() {
    const pal = getDynamicPalette();

    ctx.save();
    if (shake > 0.2) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    drawLevelBackground(pal);

    // 3D Depth Tunnel Rings (smooth subtle depth framing during 3D phases)
    if (depth3D > 0.04) {
      ctx.save();
      ctx.strokeStyle = chromaAmt > 0.15 ? pal.accentB : pal.accentA;
      for (let k = 1; k <= 5; k++) {
        const zDepth = -k * 65 * depth3D;
        const rad = 110 + k * 75;
        ctx.globalAlpha = (0.14 - k * 0.02) * depth3D;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        for (let s = 0; s <= 40; s++) {
          const a = (s / 40) * TAU;
          const p = project(Math.cos(a) * rad, Math.sin(a) * rad, zDepth);
          if (s === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();
        ctx.stroke();
      }
      ctx.restore();
    }

    // Walls (sorted outer-to-inner for crisp 3D painter's order)
    const sortedWalls = walls.slice().sort((a, b) => b.r - a.r);
    for (const w of sortedWalls) {
      if (w.vanished) continue;
      drawArchitecturalWall(w, pal);
    }

    // Level 3 Solar Core Lasers
    for (const lz of lasers) {
      const maxR = getSpawnRadius() + 40;
      ctx.save();
      if (lz.state === 'warn') {
        const prog = 1 - clamp(lz.timer / lz.maxWarn, 0, 1);
        const orbPos = project(Math.cos(lz.ang) * (CORE_R + 3), Math.sin(lz.ang) * (CORE_R + 3), 18);
        const spread = (1 - prog) * 0.14 + lz.halfWidth;
        ctx.strokeStyle = prog > 0.72 ? '#ffffff' : pal.accentA;
        ctx.globalAlpha = 0.35 + prog * 0.55;
        ctx.setLineDash([7, 5]);
        ctx.lineWidth = 1.6 + prog * 1.2;
        for (const sgn of [-1, 1]) {
          const a = lz.ang + sgn * spread;
          const p1 = project(Math.cos(a) * CORE_R, Math.sin(a) * CORE_R, 14);
          const p2 = project(Math.cos(a) * maxR, Math.sin(a) * maxR, 14);
          ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
        }
        ctx.setLineDash([]);
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = pal.accentA;
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.arc(orbPos.x, orbPos.y, (3 + prog * 7) * arenaScale, 0, TAU);
        ctx.fill();
      } else {
        // Active plasma beam
        const p1 = project(Math.cos(lz.ang - lz.halfWidth) * CORE_R, Math.sin(lz.ang - lz.halfWidth) * CORE_R, 20);
        const p2 = project(Math.cos(lz.ang - lz.halfWidth) * maxR, Math.sin(lz.ang - lz.halfWidth) * maxR, 20);
        const p3 = project(Math.cos(lz.ang + lz.halfWidth) * maxR, Math.sin(lz.ang + lz.halfWidth) * maxR, 20);
        const p4 = project(Math.cos(lz.ang + lz.halfWidth) * CORE_R, Math.sin(lz.ang + lz.halfWidth) * CORE_R, 20);
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = pal.accentA;
        ctx.shadowBlur = 22;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    // Coins
    for (const c of coins) {
      const p = project(Math.cos(c.ang) * c.r, Math.sin(c.ang) * c.r, 16);
      const sz = (7.2 + Math.sin(c.pulse) * 1.4) * p.s;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(c.pulse * 0.5);
      ctx.fillStyle = '#ffd800';
      ctx.shadowColor = '#ffd800';
      ctx.shadowBlur = 11;
      ctx.beginPath();
      ctx.moveTo(0, -sz); ctx.lineTo(sz * 0.78, 0); ctx.lineTo(0, sz); ctx.lineTo(-sz * 0.78, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    drawLevelCore(pal);

    // Level 4 Duality Neon Tether
    if (mode === 'play' && curLvl.id === 3 && duality.active) {
      const angA = player.ang;
      const angB = normAng(player.ang + Math.PI * duality.splitBlend);
      const rP = ORBIT_R + player.radialBounce;
      const pA = project(Math.cos(angA) * rP, Math.sin(angA) * rP, 12);
      const pB = project(Math.cos(angB) * rP, Math.sin(angB) * rP, 12);
      ctx.save();
      ctx.strokeStyle = '#00f5ff';
      ctx.globalAlpha = 0.6;
      ctx.lineWidth = 2.0 * arenaScale;
      ctx.setLineDash([5, 5]);
      ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.stroke();
      ctx.restore();
    }

    // Player(s)
    if (mode === 'play' || mode === 'menu') {
      drawSkinLetter(player.ang, player.scale, pal, player.phasing, false);
      if (mode === 'play' && curLvl.id === 3 && duality.active) {
        const angB = normAng(player.ang + Math.PI * duality.splitBlend);
        drawSkinLetter(angB, player.scale, pal, player.phasing, true);
      }
    }

    // Sparks
    for (const s of sparks) {
      const p = project(s.x, s.y, 12);
      ctx.save();
      ctx.globalAlpha = clamp(s.life / s.maxLife, 0, 1);
      ctx.fillStyle = s.color;
      ctx.fillRect(p.x - s.size * 0.5, p.y - s.size * 0.5, s.size * arenaScale, s.size * arenaScale);
      ctx.restore();
    }

    // Ricocheting Shards
    for (const sh of shards) {
      const p = project(sh.x, sh.y, 14);
      ctx.save();
      ctx.globalAlpha = clamp(sh.life / sh.maxLife, 0, 1);
      ctx.translate(p.x, p.y);
      ctx.rotate(sh.rot);
      ctx.fillStyle = sh.color;
      const sz = sh.sz * arenaScale;
      ctx.beginPath();
      ctx.moveTo(0, -sz); ctx.lineTo(sz * 0.75, sz * 0.65); ctx.lineTo(-sz * 0.75, sz * 0.45);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // Floating +1 Coin Text
    for (const ft of floatTexts) {
      const p = project(ft.x, ft.y, 18);
      ctx.save();
      ctx.globalAlpha = clamp(ft.life / ft.maxLife, 0, 1);
      ctx.fillStyle = ft.color;
      ctx.font = `900 ${Math.round(13 * arenaScale)}px Montserrat, sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(ft.text, p.x, p.y);
      ctx.restore();
    }

    ctx.restore();
  }

  // ===== RAF LOOP =====
  let lastTs = performance.now();
  function loop(ts) {
    const dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  applyTheme(curLvl);
  applyLanguageUI();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
