<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>.Spiral Pulse</title>
  <meta name="description" content=".Spiral Pulse — 3D радиальная аркада на реакцию" />
  <meta name="theme-color" content="#051016" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content=".Spiral Pulse" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #002024;
      --accent: #00f5ff;
      --font: 'Montserrat', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #040d12;
      font-family: var(--font);
      touch-action: none;
    }
    #stage {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      transform-origin: center center;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Chamfered geometric HUD boxes inspired by classic .Spiral Pulse reference */
    #timerBox {
      position: absolute;
      top: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.92);
      border-bottom: 3px solid var(--accent);
      padding: 7px 18px 8px 26px;
      color: #ffffff;
      font-weight: 900;
      font-size: 25px;
      letter-spacing: 0.8px;
      font-variant-numeric: tabular-nums;
      z-index: 20;
      pointer-events: none;
      display: none;
      clip-path: polygon(16px 0, 100% 0, 100% 100%, 0 100%, 0 58%);
      box-shadow: -4px 4px 18px rgba(0, 0, 0, 0.5);
    }
    #hudTopLeft {
      position: absolute;
      top: 0;
      left: 0;
      display: none;
      align-items: center;
      gap: 8px;
      z-index: 20;
    }
    #bestHud {
      background: rgba(0, 0, 0, 0.92);
      border-bottom: 3px solid var(--accent);
      padding: 8px 22px 8px 14px;
      color: #ffffff;
      font-weight: 900;
      font-size: 14px;
      letter-spacing: 0.6px;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      clip-path: polygon(0 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
    }
    .pillBtn {
      background: rgba(0, 0, 0, 0.74);
      color: var(--accent);
      border: 2px solid var(--accent);
      padding: 6px 12px;
      font-family: var(--font);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      cursor: pointer;
      text-transform: uppercase;
      transition: transform 0.12s ease, background 0.15s ease, color 0.15s ease;
    }
    .pillBtn:active { transform: scale(0.94); }
    #coinHud {
      background: rgba(0, 0, 0, 0.74);
      color: #ffd800;
      border: 2px solid #ffd800;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.4px;
      pointer-events: none;
    }
    #eventBanner {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      padding: 6px 18px;
      background: rgba(0, 0, 0, 0.86);
      border: 2px solid var(--accent);
      color: #ffffff;
      font-weight: 900;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.35s ease;
      z-index: 25;
      white-space: nowrap;
    }
    #eventBanner.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    /* Overlays */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 22px;
      background: radial-gradient(circle at 50% 50%, rgba(0, 12, 16, 0.42) 0%, rgba(0, 6, 10, 0.86) 100%);
      z-index: 30;
      transition: opacity 0.25s ease;
    }
    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .topBar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brandWrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brandIcon {
      width: 28px;
      height: 28px;
      display: block;
      filter: drop-shadow(0 0 8px color-mix(in srgb, var(--accent) 60%, transparent));
    }
    .brand {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1.6px;
      color: var(--accent);
      text-shadow: 0 0 18px color-mix(in srgb, var(--accent) 45%, transparent);
    }
    .topRight {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .levelsGrid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 860px;
      margin: auto;
    }
    .lvlCard {
      background: rgba(0, 0, 0, 0.78);
      border: 2px solid rgba(255, 255, 255, 0.18);
      padding: 12px 12px 11px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
      position: relative;
      overflow: hidden;
    }
    .lvlCard::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--c);
      opacity: 0.4;
      transition: opacity 0.16s ease;
    }
    .lvlCard.selected {
      transform: translateY(-3px);
      border-color: var(--c);
      box-shadow: 0 0 22px color-mix(in srgb, var(--c) 45%, transparent);
    }
    .lvlCard.selected::before { opacity: 1; }
    .lvlNum {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1.4px;
      color: var(--c);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .lvlName {
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.4px;
      color: #fff;
      line-height: 1.2;
    }
    .lvlTag {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.64);
      text-transform: uppercase;
      margin-top: 3px;
    }
    .lvlFoot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 10.5px;
      font-weight: 800;
      color: var(--c);
      font-variant-numeric: tabular-nums;
    }
    .medal {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
    }
    .medal.bronze { background: #cd7f32; box-shadow: 0 0 6px #cd7f32; }
    .medal.silver { background: #e2e8f0; box-shadow: 0 0 6px #e2e8f0; }
    .medal.gold { background: #ffd800; box-shadow: 0 0 8px #ffd800; }

    .bottomBar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .ctrlHints {
      display: flex;
      gap: 8px;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.72);
      flex-wrap: wrap;
    }
    .ctrlHints span {
      border: 1px solid rgba(255, 255, 255, 0.24);
      padding: 4px 8px;
      background: rgba(0, 0, 0, 0.56);
    }
    #playBtn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 11px 38px;
      font-family: var(--font);
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 55%, transparent);
      transition: transform 0.12s ease;
    }
    #playBtn:active { transform: scale(0.95); }

    /* Modals (Shop & Settings) */
    #shopModal, #settingsModal {
      justify-content: center;
      align-items: center;
      background: rgba(0, 8, 12, 0.92);
      z-index: 40;
    }
    .modalPanel {
      width: 100%;
      max-width: 720px;
      background: #060d12;
      border: 2px solid var(--accent);
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }
    .settingsPanel {
      max-width: 460px;
    }
    .modalHead {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modalTitle {
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: var(--accent);
      text-transform: uppercase;
    }
    .shopRow {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .shopLabel {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1.8px;
      color: rgba(255, 255, 255, 0.55);
      margin-bottom: -5px;
      text-transform: uppercase;
    }
    .shopItem {
      background: rgba(255, 255, 255, 0.04);
      border: 2px solid rgba(255, 255, 255, 0.18);
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: #fff;
      transition: border-color 0.15s ease, transform 0.12s ease;
    }
    .shopItem:active { transform: scale(0.96); }
    .shopItem.owned { border-color: rgba(0, 245, 255, 0.45); }
    .shopItem.active {
      border-color: #ffd800;
      background: rgba(255, 216, 0, 0.12);
    }
    .skinGlyph {
      font-size: 26px;
      font-weight: 900;
      color: var(--accent);
      line-height: 1;
    }
    .perkName {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.6px;
      text-align: center;
    }
    .perkSub {
      font-size: 9.5px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.65);
      text-align: center;
    }
    .priceTag {
      font-size: 10.5px;
      font-weight: 900;
      color: #ffd800;
      letter-spacing: 0.5px;
    }

    /* Settings rows */
    .setRow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .setLabel {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.6px;
      color: #fff;
      text-transform: uppercase;
    }
    .segGroup {
      display: flex;
      gap: 6px;
    }
    .segBtn {
      background: rgba(0, 0, 0, 0.6);
      color: rgba(255, 255, 255, 0.65);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      padding: 6px 12px;
      font-family: var(--font);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.6px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .segBtn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    /* Game Over */
    #overOverlay {
      justify-content: center;
      align-items: center;
      gap: 16px;
      background: rgba(0, 0, 0, 0.72);
      z-index: 35;
    }
    .overBox {
      background: rgba(0, 0, 0, 0.9);
      border: 2px solid var(--accent);
      padding: 20px 34px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      min-width: 320px;
    }
    .overTime {
      font-size: 44px;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: 1.5px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .overMeta {
      display: flex;
      gap: 18px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: rgba(255, 255, 255, 0.8);
    }
    .overBtns {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }
    #retryBtn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px 26px;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1.4px;
      cursor: pointer;
      text-transform: uppercase;
    }
    #installBtn {
      display: none;
      border-color: #ffd800;
      color: #ffd800;
    }
    @media (max-height: 410px) {
      .overlay { padding: 10px 14px; }
      .brand { font-size: 18px; }
      .lvlCard { padding: 8px 9px; gap: 5px; }
      .lvlName { font-size: 12.5px; }
      #playBtn { padding: 8px 26px; font-size: 13px; }
      .modalPanel { padding: 10px 14px; gap: 8px; }
      .skinGlyph { font-size: 20px; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>

    <div id="timerBox">0:00</div>
    <div id="hudTopLeft">
      <div id="bestHud">РЕКОРД: 0:00</div>
      <button class="pillBtn" id="pauseBackBtn">МЕНЮ</button>
      <div id="coinHud">◈ 0</div>
    </div>
    <div id="eventBanner">ГРАДИЕНТ-ПОТОК</div>

    <!-- MAIN MENU -->
    <div id="menuOverlay" class="overlay">
      <div class="topBar">
        <div class="brandWrap">
          <svg class="brandIcon" viewBox="0 0 100 100" aria-hidden="true">
            <polygon points="12,84 12,16 32,16 50,48 68,16 88,16 88,84 70,84 70,44 50,76 30,44 30,84" fill="currentColor" style="color:var(--accent)"/>
            <polygon points="50,10 56,19 50,28 44,19" fill="#ffd800"/>
          </svg>
          <div class="brand">.SPIRAL PULSE</div>
        </div>
        <div class="topRight">
          <div id="menuCoins" class="pillBtn" style="border-color:#ffd800;color:#ffd800;cursor:default;">◈ 0</div>
          <button id="installBtn" class="pillBtn">УСТАНОВИТЬ</button>
          <button id="shopOpenBtn" class="pillBtn">МАГАЗИН</button>
          <button id="settingsOpenBtn" class="pillBtn">НАСТРОЙКИ</button>
        </div>
      </div>

      <div class="levelsGrid" id="levelsGrid"></div>

      <div class="bottomBar">
        <div class="ctrlHints">
          <span id="hintTurn">УДЕРЖ. Л / П: ПОВОРОТ</span>
          <span id="hintPhase">Л + П: ФАЗОВЫЙ ЩИТ</span>
        </div>
        <button id="playBtn">ИГРАТЬ</button>
      </div>
    </div>

    <!-- SHOP MODAL -->
    <div id="shopModal" class="overlay hidden">
      <div class="modalPanel">
        <div class="modalHead">
          <div class="modalTitle" id="shopTitle">МАГАЗИН</div>
          <div style="display:flex;gap:8px;align-items:center;">
            <div id="shopCoins" class="pillBtn" style="border-color:#ffd800;color:#ffd800;cursor:default;">◈ 0</div>
            <button id="shopCloseBtn" class="pillBtn">ЗАКРЫТЬ</button>
          </div>
        </div>

        <div class="shopLabel" id="skinsLabel">СКИНЫ</div>
        <div class="shopRow" id="skinsRow"></div>

        <div class="shopLabel" id="perksLabel">УЛУЧШЕНИЯ</div>
        <div class="shopRow" id="perksRow"></div>
      </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settingsModal" class="overlay hidden">
      <div class="modalPanel settingsPanel">
        <div class="modalHead">
          <div class="modalTitle" id="settingsTitle">НАСТРОЙКИ</div>
          <button id="settingsCloseBtn" class="pillBtn">ЗАКРЫТЬ</button>
        </div>

        <div class="setRow">
          <div class="setLabel" id="setLangLabel">ЯЗЫК / LANGUAGE</div>
          <div class="segGroup">
            <button id="langRuBtn" class="segBtn">РУССКИЙ</button>
            <button id="langEnBtn" class="segBtn">ENGLISH</button>
          </div>
        </div>

        <div class="setRow">
          <div class="setLabel" id="setSoundLabel">ЗВУК И МУЗЫКА</div>
          <div class="segGroup">
            <button id="soundOnBtn" class="segBtn">ВКЛ</button>
            <button id="soundOffBtn" class="segBtn">ВЫКЛ</button>
          </div>
        </div>

        <div class="setRow">
          <div class="setLabel" id="setVibeLabel">ВИБРАЦИЯ</div>
          <div class="segGroup">
            <button id="vibeOnBtn" class="segBtn">ВКЛ</button>
            <button id="vibeOffBtn" class="segBtn">ВЫКЛ</button>
          </div>
        </div>
      </div>
    </div>

    <!-- GAME OVER -->
    <div id="overOverlay" class="overlay hidden">
      <div class="overBox">
        <div id="overLevel" style="font-size:11px;font-weight:900;letter-spacing:1.4px;color:rgba(255,255,255,0.62);">01 · ЦИАН-ПУЛЬС</div>
        <div class="overTime" id="overTime">0:00</div>
        <div class="overMeta">
          <span id="overBest">РЕКОРД 0:00</span>
          <span id="overRunCoins" style="color:#ffd800;">+0 ◈</span>
        </div>
        <div class="overBtns">
          <button id="retryBtn">ЗАНОВО</button>
          <button id="overMenuBtn" class="pillBtn">МЕНЮ</button>
        </div>
      </div>
    </div>
  </div>

<script>
(() => {
  'use strict';

  // ===== PWA REGISTRATION & INSTALL PROMPT =====
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
  let deferredInstallPrompt = null;
  const installBtn = document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    installBtn.style.display = 'inline-block';
  });
  installBtn.addEventListener('click', async () => {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    try { await deferredInstallPrompt.userChoice; } catch (_) {}
    deferredInstallPrompt = null;
    installBtn.style.display = 'none';
  });
  window.addEventListener('appinstalled', () => {
    installBtn.style.display = 'none';
  });

  // ===== LOCALIZATION (RUSSIAN DEFAULT + ENGLISH IN SETTINGS) =====
  const I18N = {
    ru: {
      play: 'ИГРАТЬ',
      menu: 'МЕНЮ',
      retry: 'ЗАНОВО',
      shop: 'МАГАЗИН',
      settings: 'НАСТРОЙКИ',
      close: 'ЗАКРЫТЬ',
      install: 'УСТАНОВИТЬ',
      best: 'РЕКОРД',
      skins: 'СКИНЫ',
      perks: 'УЛУЧШЕНИЯ',
      equipped: 'ВЫБРАН',
      equip: 'ВЫБРАТЬ',
      active: 'АКТИВНО',
      on: 'ВКЛ',
      off: 'ВЫКЛ',
      hintTurn: 'УДЕРЖ. Л / П: ПОВОРОТ',
      hintPhase: 'Л + П: ФАЗОВЫЙ ЩИТ',
      setLang: 'ЯЗЫК / LANGUAGE',
      setSound: 'ЗВУК И МУЗЫКА',
      setVibe: 'ВИБРАЦИЯ',
      banner3D: '3D-РЕЖИМ · УСКОРЕНИЕ',
      bannerChroma: 'ГРАДИЕНТ-ПОТОК',
      bannerOverdrive: 'ФОРСАЖ',
      bannerSpeed: (p) => `СКОРОСТЬ +${p}%`,
      bannerDual: 'ДВОЙНОЙ КЛОН',
      bannerCloneLost: 'КЛОН РАЗБИТ · 9 СЕК',
      perksMeta: {
        magnet: { name: 'МАГНИТ', sub: 'ПРИТЯГИВАЕТ МОНЕТЫ' },
        phasePlus: { name: 'ФАЗА+', sub: 'ЩИТ НА 4.0 СЕК' },
        stabilizer: { name: 'СТАБИЛИЗАТОР', sub: 'РОСТ ДО 1.55X' }
      }
    },
    en: {
      play: 'PLAY',
      menu: 'MENU',
      retry: 'RETRY',
      shop: 'SHOP',
      settings: 'SETTINGS',
      close: 'CLOSE',
      install: 'INSTALL',
      best: 'BEST',
      skins: 'SKINS',
      perks: 'PERKS',
      equipped: 'EQUIPPED',
      equip: 'EQUIP',
      active: 'ACTIVE',
      on: 'ON',
      off: 'OFF',
      hintTurn: 'HOLD L / R: TURN',
      hintPhase: 'HOLD L + R: PHASE SHIELD',
      setLang: 'LANGUAGE / ЯЗЫК',
      setSound: 'SOUND & MUSIC',
      setVibe: 'VIBRATION',
      banner3D: '3D PHASE · SPEED UP',
      bannerChroma: 'CHROMA FLOW',
      bannerOverdrive: 'OVERDRIVE',
      bannerSpeed: (p) => `SPEED +${p}%`,
      bannerDual: 'DUAL CLONE ACTIVE',

  function hsl(h, s, l, a = 1) {
    h = ((h % 360) + 360) % 360;
    return a >= 0.999 ? `hsl(${h.toFixed(1)}, ${s}%, ${l}%)` : `hsla(${h.toFixed(1)}, ${s}%, ${l}%, ${a.toFixed(3)})`;

    const hB = h0 + curLvl.huePartner * (0.25 + 0.75 * c) + drift2;
    const hC = h0 - curLvl.huePartner * 0.65 * c + Math.sin(chromaPhase * 0.5) * 18 * c;

    return {
      hA, hB, hC,
      accentA: c < 0.01 ? curLvl.accent : hsl(hA, 98, 56),
      accentB: c < 0.01 ? curLvl.accent : hsl(hB, 96, 60),
