  // ===== MATHEMATICALLY GUARANTEED FAIR SPATIAL WAVE SPAWNER =====
  function getSpawnRadius() {
    const vW = W / arenaScale;
    const vH = H / arenaScale;
    return Math.hypot(vW, vH) * 0.54 + 34;
  }

  function getOutermostWallOuterR() {
    let maxR = 0;
    for (let i = 0; i < walls.length; i++) {
      const outer = walls[i].r + walls[i].thick;
      if (outer > maxR) maxR = outer;
    }
    return maxR;
  }

  function addWall(opts) {
    walls.push({
      r: opts.r,
      thick: opts.thick || 24,
      start: normAng(opts.start),
      span: clamp(opts.span, 0.14, TAU - 0.14),
      rotSpd: opts.rotSpd || 0,
      kind: opts.kind || 'arc',        // 'arc' | 'gear' | 'phantom' | 'split' | 'breathe'
      baseStart: normAng(opts.start),
      baseSpan: clamp(opts.span, 0.14, TAU - 0.14),
      oscAmp: opts.oscAmp || 0.16,
      phase: opts.phase || 0,
      phantomTriggerR: opts.phantomTriggerR || 285,
      phantomAlpha: 1,
      vanished: false,
      hitFlash: 0,
      vibeOff: 0,
      nearAwarded: false,
      height3D: opts.height3D || 32
    });
  }

  function addCoin(r, ang) {
    coins.push({ r, ang: normAng(ang), taken: false, pulse: Math.random() * TAU });
  }

  // Helper: creates a single ring with a guaranteed gap centered at `gapCenter` of width `gapWidth`
  function addRingWithGap(r, thick, gapCenter, gapWidth, extra = {}) {
    const start = normAng(gapCenter + gapWidth * 0.5);
    const span = TAU - gapWidth;
    addWall({ r, thick, start, span, ...extra });
  }

  // Helper: creates a 180°-symmetric pair of walls with TWO gaps centered at `gapCenter` and `gapCenter + PI`
  function addSymmetricPair(r, thick, gapCenter, gapWidth, extra = {}) {
    const startA = normAng(gapCenter + gapWidth * 0.5);
    const span = Math.PI - gapWidth;
    addWall({ r, thick, start: startA, span, ...extra });
    addWall({ r, thick, start: normAng(startA + Math.PI), span, ...extra });
  }

  function spawnFairWave(wallSpd) {
    const R0 = getSpawnRadius();
    const t = runTime;
    const ease = clamp(1 - t / 42, 0, 1); // Gentle difficulty ramp over 42s
    patternCount++;

    // Choose a reachable next gap center relative to lastSafeGapAng (never forcing impossible snaps!)
    const isDualLvl = (curLvl.id === 3);
    const maxDelta = isDualLvl ? 0.92 : 1.38;
    const minDelta = 0.42;
    const dir = Math.random() < 0.5 ? 1 : -1;
    const delta = dir * (minDelta + Math.random() * (maxDelta - minDelta));
    const gapAng = normAng(lastSafeGapAng + delta);

    // Guaranteed generous gap width (always >= 2.6x enlarged 2x player width!)
    const stdGap = lerp(1.18, 1.62, ease);
    const dualGap = lerp(1.06, 1.34, ease);

    let exitGapAng = gapAng;
    let extraClearance = 0;

    // --- 3D HYPER-TUNNEL (20.0 - 30.0s): Wide, rhythmic, exhilarating warp corridors ---
    if (t >= 19.0 && t <= 29.4) {
      if (isDualLvl) {
        const g = 1.24;
        const step = dir * 0.36;
        for (let k = 0; k < 3; k++) {
          const a = normAng(gapAng + k * step);
          const r = R0 + k * 108;
          addSymmetricPair(r, 24, a, g, { height3D: 54 });
          if (k === 1) {
            addCoin(r + 12, a);
            addCoin(r + 12, a + Math.PI);
          }
          exitGapAng = a;
        }
        extraClearance = 40;
      } else {
        const g = 1.50;
        const step = dir * 0.44;
        for (let k = 0; k < 3; k++) {
          const a = normAng(gapAng + k * step);
          const r = R0 + k * 104;
          addRingWithGap(r, 24, a, g, { height3D: 56 });
          if (k === 1) addCoin(r + 12, a);
          exitGapAng = a;
        }
        extraClearance = 40;
      }
    }

    // --- LEVEL 04: VIOLET DUALITY (Always 100% 180°-symmetric so solo & dual clone are always fair!) ---
    else if (curLvl.id === 3) {
      const pick = patternCount % 4;
      if (pick === 0) {
        // Twin Breathing Gates (oscAmp capped so narrowest opening is STILL >= 0.96 rad!)
        const safeBaseGap = Math.max(1.22, dualGap);
        addSymmetricPair(R0, 26, gapAng, safeBaseGap, { kind: 'breathe', oscAmp: 0.12, phase: 0, height3D: 38 });
        if (Math.random() < 0.6) {
          addCoin(R0 + 13, gapAng);
          addCoin(R0 + 13, gapAng + Math.PI);
        }
        exitGapAng = gapAng;
      } else if (pick === 1) {
        // Flowing Twin Staircase (gentle 0.42 rad steps, generous 112u radial spacing)
        const step = dir * 0.42;
        for (let k = 0; k < 3; k++) {
          const a = normAng(gapAng + k * step);
          const r = R0 + k * 112;
          addSymmetricPair(r, 22, a, dualGap + 0.08, { height3D: 34 + k * 4 });
          if (k === 1) addCoin(r + 11, a);
          exitGapAng = a;
        }
        extraClearance = 35;
      } else if (pick === 2) {
        // Symmetric 4-Way Prism Cross (four 0.72+ rad openings, gentle slow rotation)
        const open = lerp(0.72, 0.86, ease);
        const span = Math.PI * 0.5 - open;
        const rot = dir * 0.24;
        for (let k = 0; k < 4; k++) {
          addWall({ r: R0, thick: 26, start: gapAng + open * 0.5 + k * Math.PI * 0.5, span, rotSpd: rot, height3D: 36 });
        }
        exitGapAng = gapAng;
      } else {
        // Twin Stepped-Thickness Prism Anvils
        const span = Math.PI - dualGap;
        const sA = normAng(gapAng + dualGap * 0.5);
        addWall({ r: R0, thick: 40, start: sA, span: span * 0.5, height3D: 44 });
        addWall({ r: R0 + 10, thick: 22, start: sA + span * 0.5, span: span * 0.5, height3D: 28 });
        addWall({ r: R0, thick: 40, start: sA + Math.PI, span: span * 0.5, height3D: 44 });
        addWall({ r: R0 + 10, thick: 22, start: sA + Math.PI + span * 0.5, span: span * 0.5, height3D: 28 });
        exitGapAng = gapAng;
      }
    }

    // --- LEVEL 01: CYAN PULSE (Classic Stepped Snails, Cloverleaf, Stepped Anvils) ---
    else if (curLvl.id === 0) {
      const pick = patternCount % 4;
      if (pick === 0) {
        // Authentic Stepped Snail Spiral (steps along arc around a wide safe gap)
        const steps = 4;
        const arcTotal = TAU - stdGap;
        const segSpan = arcTotal / steps;
        const s0 = normAng(gapAng + stdGap * 0.5);
        for (let k = 0; k < steps; k++) {
          const idx = dir > 0 ? k : (steps - 1 - k);
          addWall({ r: R0 + idx * 18, thick: 24 + (k % 2) * 6, start: s0 + k * segSpan, span: segSpan + 0.02, height3D: 30 + idx * 4 });
        }
        if (Math.random() < 0.6) addCoin(R0 + 26, gapAng);
        exitGapAng = gapAng;
      } else if (pick === 1) {
        // 3-Way Cloverleaf + Follow-Up Wide Ring (spaced 128u apart!)
        const open = lerp(0.76, 0.94, ease);
        const span = TAU / 3 - open;
        for (let k = 0; k < 3; k++) {
          addWall({ r: R0, thick: 26, start: gapAng + open * 0.5 + k * (TAU / 3), span, height3D: 34 });
        }
        const nextA = normAng(gapAng + dir * 0.65);
        addRingWithGap(R0 + 128, 24, nextA, stdGap + 0.1, { height3D: 30 });
        if (Math.random() < 0.55) addCoin(R0 + 140, nextA);
        exitGapAng = nextA;
        extraClearance = 30;
      } else if (pick === 2) {
        // Classic Stepped-Thickness Anvil Ring
        const total = TAU - stdGap;
        const s0 = normAng(gapAng + stdGap * 0.5);
        addWall({ r: R0, thick: 44, start: s0, span: total * 0.46, height3D: 44 });
        addWall({ r: R0 + 10, thick: 22, start: s0 + total * 0.46, span: total * 0.54, height3D: 28 });
        exitGapAng = gapAng;
      } else {
        // Flowing 2-Step Neon Corridor
        const a2 = normAng(gapAng + dir * 0.85);
        addRingWithGap(R0, 24, gapAng, stdGap + 0.08, { height3D: 32 });
        addRingWithGap(R0 + 122, 24, a2, stdGap + 0.08, { height3D: 32 });
        exitGapAng = a2;
        extraClearance = 28;
      }
    }

    // --- LEVEL 02: CRIMSON PHANTOM (Tactical Radar Wedges, Splitting Gates & Clear Holographic Mirages) ---
    else if (curLvl.id === 1) {
      const pick = patternCount % 4;
      if (pick === 0) {
        // Radar Wedges with WIDE clear corridors (2 opposite safe lanes!)
        const wedgeSpan = lerp(1.05, 0.92, ease);
        const laneCenter = gapAng;
        const laneHalf = (Math.PI - wedgeSpan) * 0.5;
        addWall({ r: R0, thick: 72, start: laneCenter + laneHalf, span: wedgeSpan, height3D: 46 });
        addWall({ r: R0, thick: 72, start: laneCenter + laneHalf + Math.PI, span: wedgeSpan, height3D: 46 });
        // Place a clearly glowing mirage bar across one lane that dissolves early!
        addWall({ r: R0 + 18, thick: 22, start: laneCenter - laneHalf + 0.06, span: laneHalf * 2 - 0.12, kind: 'phantom', phantomTriggerR: 295, height3D: 28 });
        if (Math.random() < 0.65) addCoin(R0 + 36, laneCenter);
        exitGapAng = laneCenter;
        extraClearance = 38;
      } else if (pick === 1) {
        // Full Mirage Ring: solid crimson wall + wide holographic mirage door that dissolves at r=295 -> gone by r=180!
        const mirageGap = lerp(1.32, 1.68, ease);
        addRingWithGap(R0, 26, gapAng, mirageGap, { height3D: 34 });
        addWall({
          r: R0, thick: 26,
          start: normAng(gapAng - mirageGap * 0.5 + 0.04),
          span: mirageGap - 0.08,
          kind: 'phantom',
          phantomTriggerR: 295,
          height3D: 34
        });
        addCoin(R0 + 13, gapAng);
        exitGapAng = gapAng;
      } else if (pick === 2) {
        // Dynamic Splitting/Rejoining Dual Arcs (always leaves >= 1.05 rad safe corridors)
        const baseGap = lerp(1.12, 1.38, ease);
        addSymmetricPair(R0, 24, gapAng, baseGap, { kind: 'split', oscAmp: 0.14, phase: 0, height3D: 34 });
        exitGapAng = gapAng;
      } else {
        // Crimson Stepped Snail
        const steps = 4;
        const seg = (TAU - stdGap) / steps;
        const s0 = normAng(gapAng + stdGap * 0.5);
        for (let k = 0; k < steps; k++) {
          addWall({ r: R0 + k * 18, thick: 26, start: s0 + k * seg, span: seg + 0.02, height3D: 36 });
        }
        exitGapAng = gapAng;
      }
    }

    // --- LEVEL 03: GOLD ECLIPSE (Clockwork Gears, Rotating Saw Sectors + Telegraphed Core Lasers) ---
    else {
      const pick = patternCount % 3;
      if (pick === 0) {
        // Smooth Rotating Clockwork Gear Ring
        const g = lerp(1.28, 1.62, ease);
        const rot = dir * 0.28;
        addRingWithGap(R0, 28, gapAng, g, { kind: 'gear', rotSpd: rot, height3D: 40 });
        if (Math.random() < 0.6) addCoin(R0 + 14, gapAng);
        exitGapAng = normAng(gapAng + rot * 1.4);
      } else if (pick === 1) {
        // Counter-Rotating Twin Gear Pair + Spaced Outer Gear
        const g1 = lerp(1.10, 1.36, ease);
        addSymmetricPair(R0, 26, gapAng, g1, { kind: 'gear', rotSpd: 0.24, height3D: 38 });
        const a2 = normAng(gapAng + dir * 0.72);
        addRingWithGap(R0 + 126, 26, a2, stdGap + 0.12, { kind: 'gear', rotSpd: -0.22, height3D: 34 });
        exitGapAng = a2;
        extraClearance = 34;
      } else {
        // Triple Clockwork Saw Blades (3 wide openings)
        const open = lerp(0.82, 0.98, ease);
        const span = TAU / 3 - open;
        const rot = -dir * 0.22;
        for (let k = 0; k < 3; k++) {
          addWall({ r: R0, thick: 28, start: gapAng + open * 0.5 + k * (TAU / 3), span, kind: 'gear', rotSpd: rot, height3D: 42 });
        }
        if (Math.random() < 0.55) addCoin(R0 + 14, gapAng);
        exitGapAng = gapAng;
      }
    }

    lastSafeGapAng = exitGapAng;

    // Compute exact minimum radial clearance before the NEXT wave is allowed to spawn
    // Accounts for human reaction time + turning across maxDelta at current wall speed!
    const safeTurnTime = (maxDelta / (TURN_SPEED * 0.68)) + 0.34;
    nextRequiredClearance = Math.max(132, safeTurnTime * wallSpd) + extraClearance;
  }

  // ===== PARTICLES & SHATTER PHYSICS =====
  function emitSparks(x, y, nx, ny, count, color, speedMul = 1) {
    for (let i = 0; i < count; i++) {
      const spread = (Math.random() - 0.5) * 1.9;
      const baseA = Math.atan2(ny, nx) + spread;
      const spd = (80 + Math.random() * 175) * speedMul;
      sparks.push({
        x, y,
        vx: Math.cos(baseA) * spd,
        vy: Math.sin(baseA) * spd,
        life: 0.25 + Math.random() * 0.28,
        maxLife: 0.53,
        size: 1.8 + Math.random() * 2.4,
        color
      });
    }
  }

  function shatterAt(ang, scale, color) {
    const r = ORBIT_R + player.radialBounce;
    const ox = Math.cos(ang) * r;
    const oy = Math.sin(ang) * r;
    emitSparks(ox, oy, Math.cos(ang), Math.sin(ang), 24, '#ffffff', 1.35);
    for (let i = 0; i < 18; i++) {
      const a = (i / 18) * TAU + (Math.random() - 0.5) * 0.4;
      const spd = 110 + Math.random() * 230;
      const sz = (3.4 + Math.random() * 5.2) * Math.sqrt(scale);
      shards.push({
        x: ox + (Math.random() - 0.5) * 8,
        y: oy + (Math.random() - 0.5) * 8,
        vx: Math.cos(a) * spd,
        vy: Math.sin(a) * spd,
        rot: Math.random() * TAU,
        vrot: (Math.random() - 0.5) * 15,
        sz,
        life: 1.05 + Math.random() * 0.5,
        maxLife: 1.55,
        color: i % 3 === 0 ? '#ffffff' : color
      });
    }
  }

  function addFloatText(x, y, text, color) {
    floatTexts.push({ x, y, text, color, life: 0.85, maxLife: 0.85 });
  }

  function triggerDeath(hitAng) {
    playSfx('shatter');
    vibe([35, 30, 55]);
    hitStop = 0.08;
    shake = 13;
    shatterAt(hitAng, player.scale, curLvl.accent);
    if (duality.active) {
      shatterAt(normAng(hitAng + Math.PI), player.scale, '#00f5ff');
    }
    mode = 'dying';
    deathTimer = 0.92;
    if (runTime > (save.best[curLvl.id] || 0)) {
      save.best[curLvl.id] = runTime;
    }
    persist();
  }

  // ===== HONEST COLLISION: SIDE SLIDE = SAFE, FRONTAL HIT = DEATH =====
  function processCloneCollisions(cloneAng, dt, wallSpd) {
    const pR = ORBIT_R + player.radialBounce;
    // Slightly forgiving hitbox (0.82x) so grazes feel heroic instead of unfair
    const halfW = (PLAYER_BASE_W * 0.42 * player.scale) / pR;
    const noseR = pR + PLAYER_BASE_H * 0.44 * player.scale;
    const tailR = pR - PLAYER_BASE_H * 0.30 * player.scale;
    let pushedAng = cloneAng;
    let died = false;

    for (let i = 0; i < walls.length; i++) {
      const w = walls[i];
      if (w.vanished) continue;

      const innerR = w.r;
      const outerR = w.r + w.thick;
      const prevInnerR = innerR + wallSpd * dt;

      // Near Miss coin bonus
      if (!w.nearAwarded && !player.phasing && outerR < pR && outerR > pR - wallSpd * dt - 8) {
        const dStart = Math.abs(angDiff(pushedAng, w.start));
        const dEnd = Math.abs(angDiff(pushedAng, w.start + w.span));
        const nearThresh = halfW + 0.16;
        if ((dStart < nearThresh || dEnd < nearThresh) && !isAngleInArc(pushedAng, w.start, w.span)) {
          w.nearAwarded = true;
          if (player.nearMissCd <= 0) {
            player.nearMissCd = 0.48;
            save.coins += 1;
            runCoins += 1;
            coinHud.textContent = `◈ ${save.coins}`;
            playSfx('nearmiss');
            const mx = Math.cos(pushedAng) * pR;
            const my = Math.sin(pushedAng) * pR;
            emitSparks(mx, my, Math.cos(pushedAng), Math.sin(pushedAng), 8, '#ffd800', 0.8);
            addFloatText(mx, my - 12, '+1 ◈', '#ffd800');
          }
        }
      }

      if (innerR > noseR || outerR < tailR) continue;

      const inCore = isAngleInArc(pushedAng, w.start, w.span);
      const inLeft = isAngleInArc(pushedAng - halfW, w.start, w.span);
      const inRight = isAngleInArc(pushedAng + halfW, w.start, w.span);
      if (!inCore && !inLeft && !inRight) continue;

      if (player.phasing || player.grace > 0) continue;

      const dToStart = angDiff(pushedAng, w.start);
      const dToEnd = angDiff(pushedAng, normAng(w.start + w.span));
      const distStart = Math.abs(dToStart);
      const distEnd = Math.abs(dToEnd);
      const sideEdgeMargin = halfW + 0.24;

      const isAlreadyPastNose = innerR < pR - 1;
      const touchingSideEdge = !inCore || distStart < sideEdgeMargin || distEnd < sideEdgeMargin;

      if (isAlreadyPastNose && touchingSideEdge) {
        if (distStart <= distEnd) {
          pushedAng = normAng(w.start - halfW - 0.012);
          player.angVel = Math.min(player.angVel, -0.7);
        } else {
          pushedAng = normAng(w.start + w.span + halfW + 0.012);
          player.angVel = Math.max(player.angVel, 0.7);
        }
        player.radialVel -= 32;
        w.hitFlash = 1.0;
        w.vibeOff = (Math.random() < 0.5 ? 1 : -1) * 3.2;
        const sx = Math.cos(pushedAng) * pR;
        const sy = Math.sin(pushedAng) * pR;
        emitSparks(sx, sy, -Math.sin(pushedAng) * (distStart <= distEnd ? 1 : -1), Math.cos(pushedAng) * (distStart <= distEnd ? 1 : -1), 3, '#ffffff', 0.7);
        if (scrapeCooldown <= 0) {
          playSfx('scrape');
          vibe(7);
          scrapeCooldown = 0.08;
        }
      } else if (prevInnerR >= noseR - 12 || inCore) {
        died = true;
        break;
      }
    }

    // Active Laser check (Level 3)
    if (!died && !player.phasing && player.grace <= 0) {
      for (const lz of lasers) {
        if (lz.state === 'fire') {
          if (Math.abs(angDiff(pushedAng, lz.ang)) < lz.halfWidth + halfW * 0.55) {
            died = true;
            break;
          }
        }
      }
    }

    return { ang: pushedAng, died };
  }

  // ===== MAIN UPDATE LOOP =====
  function update(dt) {
    if (bannerTimer > 0) {
      bannerTimer -= dt;
      if (bannerTimer <= 0) eventBanner.classList.remove('show');
    }

    // Background ambient star/ember drift
    for (const p of bgParticles) {
      p.r -= p.spd * dt * (1 + hyperAmt * 2.5);
      p.ang += 0.08 * dt * (curLvl.id === 1 ? -1 : 1);
      if (p.r < CORE_R) {
        p.r = 440 + Math.random() * 80;
        p.ang = Math.random() * TAU;
      }
    }
    for (let i = sonarRipples.length - 1; i >= 0; i--) {
      const rp = sonarRipples[i];
      rp.r += 240 * dt;
      rp.alpha -= 0.75 * dt;
      if (rp.alpha <= 0) sonarRipples.splice(i, 1);
    }

    if (mode === 'menu') {
      worldRot += 0.28 * dt;
      depth3D = lerp(depth3D, 0.35, dt * 2);
      camTiltX = Math.sin(performance.now() * 0.00065) * 0.26;
      camTiltY = Math.cos(performance.now() * 0.00048) * 0.15;
      return;
    }

    if (hitStop > 0) {
      hitStop -= dt;
      return;
    }

    // Sparks & ricocheting shards
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.vx *= Math.pow(0.18, dt);
      s.vy *= Math.pow(0.18, dt);
      const dist = Math.hypot(s.x, s.y);
      if (dist < CORE_R + 2 && dist > 0.1) {
        const nx = s.x / dist, ny = s.y / dist;
        const dot = s.vx * nx + s.vy * ny;
        if (dot < 0) { s.vx -= 1.8 * dot * nx; s.vy -= 1.8 * dot * ny; }
        s.x = nx * (CORE_R + 3);
        s.y = ny * (CORE_R + 3);
      }
      s.life -= dt;
      if (s.life <= 0) sparks.splice(i, 1);
    }

    for (let i = shards.length - 1; i >= 0; i--) {
      const sh = shards[i];
      sh.x += sh.vx * dt;
      sh.y += sh.vy * dt;
      sh.rot += sh.vrot * dt;
      sh.vx *= Math.pow(0.32, dt);
      sh.vy *= Math.pow(0.32, dt);
      const dist = Math.hypot(sh.x, sh.y);
      if (dist < CORE_R + sh.sz * 0.6 && dist > 0.1) {
        const nx = sh.x / dist, ny = sh.y / dist;
        const dot = sh.vx * nx + sh.vy * ny;
        if (dot < 0) {
          sh.vx -= 1.75 * dot * nx;
          sh.vy -= 1.75 * dot * ny;
          sh.vrot = -sh.vrot * 0.85;
          emitSparks(sh.x, sh.y, nx, ny, 2, '#ffffff', 0.45);
        }
        sh.x = nx * (CORE_R + sh.sz * 0.65);
        sh.y = ny * (CORE_R + sh.sz * 0.65);
      }
      const shAng = normAng(Math.atan2(sh.y, sh.x));
      for (const w of walls) {
        if (w.vanished) continue;
        if (dist >= w.r - sh.sz * 0.5 && dist <= w.r + w.thick + sh.sz * 0.5 && isAngleInArc(shAng, w.start, w.span)) {
          const nx = sh.x / (dist || 1), ny = sh.y / (dist || 1);
          const dot = sh.vx * nx + sh.vy * ny;
          if ((dist < w.r + w.thick * 0.5 && dot > 0) || (dist >= w.r + w.thick * 0.5 && dot < 0)) {
            sh.vx -= 1.7 * dot * nx;
            sh.vy -= 1.7 * dot * ny;
          }
          break;
        }
      }
      sh.life -= dt;
      if (sh.life <= 0) shards.splice(i, 1);
    }

    for (let i = floatTexts.length - 1; i >= 0; i--) {
      floatTexts[i].y -= 28 * dt;
      floatTexts[i].life -= dt;
      if (floatTexts[i].life <= 0) floatTexts.splice(i, 1);
    }

    shake = Math.max(0, shake - 32 * dt);

    if (mode === 'dying') {
      deathTimer -= dt;
      worldRot += worldSpin * 0.25 * dt;
      if (deathTimer <= 0) {
        mode = 'over';
        document.getElementById('overLevel').textContent = `${curLvl.num} · ${curLvl.name}`;
        document.getElementById('overTime').textContent = formatTime(runTime);
        document.getElementById('overBest').textContent = `BEST ${formatTime(save.best[curLvl.id] || 0)}`;
        document.getElementById('overRunCoins').textContent = `+${runCoins} ◈`;
        overOverlay.classList.remove('hidden');
      }
      return;
    }
    if (mode !== 'play') return;

    // ===== ACTIVE GAMEPLAY UPDATE =====
    runTime += dt;
    timerBox.textContent = formatTime(runTime);
    if (player.grace > 0) player.grace -= dt;
    if (player.nearMissCd > 0) player.nearMissCd -= dt;
    if (scrapeCooldown > 0) scrapeCooldown -= dt;

    // Gentle speed tiers every 10s (+5% per tier, smoothly capped at 1.40x)
    const speedTier = Math.floor(runTime / 10);
    if (speedTier > lastSpeedTier) {
      lastSpeedTier = speedTier;
      if (speedTier === 2) {
        showBanner('3D HYPER-TUNNEL', 2.2);
        vibe([22, 28, 40]);
      } else if (speedTier === 3) {
        showBanner('OVERDRIVE', 1.8);
        vibe(28);
      } else if (speedTier === 1) {
        showBanner('3D PHASE · SPEED UP', 1.6);
        vibe(18);
      } else {
        showBanner(`SPEED +${Math.min(40, speedTier * 5)}%`, 1.4);
      }
    }

    // 3D & Hyper-Tunnel envelopes
    let targetHyper = 0;
    if (runTime >= 20.0 && runTime <= 30.0) {
      targetHyper = Math.min(smoothstep((runTime - 20.0) / 1.5), smoothstep((30.0 - runTime) / 1.5));
    }
    hyperAmt = lerp(hyperAmt, targetHyper, 1 - Math.exp(-4.5 * dt));

    let target3D = 0;
    if (runTime >= 10.0 && runTime <= 18.6) {
      target3D = Math.min(smoothstep((runTime - 10.0) / 1.7), smoothstep((18.6 - runTime) / 1.7)) * 0.82;
    } else if (runTime > 19.6 && runTime < 30.4) {
      target3D = Math.max(target3D, hyperAmt);
    } else if (runTime >= 32.0) {
      const cyc = (runTime - 32.0) % 18.0;
      if (cyc < 11.0) {
        target3D = Math.min(smoothstep(cyc / 1.7), smoothstep((11.0 - cyc) / 1.7)) * 0.88;
      }
    }
    depth3D = lerp(depth3D, target3D, 1 - Math.exp(-3.8 * dt));

    const speedMul = (1 + Math.min(0.40, speedTier * 0.05)) * (1 + hyperAmt * 0.16);
    const wallSpd = curLvl.baseSpeed * speedMul;

    // Beat Sequencer
    const effBpm = curLvl.bpm * (1 + Math.min(0.12, speedTier * 0.02) + hyperAmt * 0.05);
    const stepDur = 60 / effBpm / 2;
    beatAccum += dt;
    while (beatAccum >= stepDur) {
      beatAccum -= stepDur;
      const idx = stepIdx % 8;
      if (idx % 2 === 0) {
        playKick(hyperAmt > 0.3 || idx === 0);
        beatPulse = 1.0;
        if (curLvl.id === 0) {
          sonarRipples.push({ r: CORE_R + 4, alpha: 0.45 });
        }
      }
      playBass(curLvl.notes[idx], stepDur * 0.9, hyperAmt > 0.25);
      if (hyperAmt > 0.25 || stepIdx % 4 === 2) {
        playHat(hyperAmt > 0.25 ? 0.13 : 0.065);
      }
      if (hyperAmt > 0.35 || runTime >= 30) {
        playLead(curLvl.lead[idx], stepDur * 0.72);
      }
      stepIdx++;
    }
    beatPulse = Math.max(0, beatPulse - dt * 4.2);

    // Smooth Beat Camera & 3D Profile
    let tX = 0, tY = 0;
    if (curLvl.camProfile === 'dive') {
      tX = depth3D * (0.46 + hyperAmt * 0.14);
      tY = Math.sin(runTime * 0.85) * 0.20 * depth3D;
    } else if (curLvl.camProfile === 'bank') {
      tX = depth3D * 0.40;
      tY = Math.sin(runTime * 1.15) * 0.38 * depth3D;
    } else if (curLvl.camProfile === 'iso') {
      tX = depth3D * 0.52;
      tY = Math.cos(runTime * 0.8) * 0.32 * depth3D;
    } else {
      tX = (0.34 + Math.sin(runTime * 1.0) * 0.16) * depth3D;
      tY = Math.cos(runTime * 0.9) * 0.34 * depth3D;
    }
    camTiltX = lerp(camTiltX, tX, 1 - Math.exp(-4.2 * dt));
    camTiltY = lerp(camTiltY, tY, 1 - Math.exp(-4.2 * dt));
    const targetZoom = 1 + beatPulse * 0.032 + hyperAmt * 0.07;
    camZoom = lerp(camZoom, targetZoom, 1 - Math.exp(-9 * dt));
    camSway = lerp(camSway, Math.sin(runTime * 1.9) * 0.02 * (1 + beatPulse * 0.7), 1 - Math.exp(-6 * dt));

    // Smooth World Rotation
    if (curLvl.id === 3) {
      const targetSpin = Math.sin(runTime * 0.38) * 0.56 * (1 + Math.min(0.25, speedTier * 0.04));
      worldSpin = lerp(worldSpin, targetSpin, 1 - Math.exp(-2.4 * dt));
    } else {
      const dirFlip = (curLvl.id === 1 && Math.floor(runTime / 15) % 2 === 1) ? -1 : 1;
      const targetSpin = curLvl.baseSpin * dirFlip * (1 + Math.min(0.3, speedTier * 0.05));
      worldSpin = lerp(worldSpin, targetSpin, 1 - Math.exp(-2.0 * dt));
    }
    worldRot += worldSpin * dt;

    // Level 4 Duality Split
    if (curLvl.id === 3) {
      if (!duality.active) {
        duality.respawnTimer -= dt;
        if (duality.respawnTimer <= 0) {
          duality.active = true;
          duality.splitBlend = 0;
          player.grace = 0.8;
          playSfx('split');
          vibe([18, 22, 22]);
          showBanner('DUAL CLONE ACTIVE', 1.6);
        }
      } else {
        duality.splitBlend = lerp(duality.splitBlend, 1, 1 - Math.exp(-5.0 * dt));
      }
    }

    // Player Controls & Phase Shield (Irreversible growth up to maxScale)
    const inp = getInput();
    const bothHeld = inp.left && inp.right;

    if (bothHeld && player.phaseFuel > 0) {
      player.phasing = true;
      player.phaseFuel = Math.max(0, player.phaseFuel - dt);
      const maxScale = save.perks.stabilizer ? 1.55 : 2.0;
      const usedFrac = 1 - (player.phaseFuel / player.phaseMax);
      const grown = 1.0 + usedFrac * (maxScale - 1.0);
      if (grown > player.scale) player.scale = grown;
    } else {
      player.phasing = false;
    }

    let targetAngVel = 0;
    if (!bothHeld) {
      if (inp.right) targetAngVel = TURN_SPEED;
      else if (inp.left) targetAngVel = -TURN_SPEED;
    }
    player.angVel = lerp(player.angVel, targetAngVel, 1 - Math.exp(-26 * dt));
    if (Math.abs(player.angVel) < 0.02 && targetAngVel === 0) player.angVel = 0;
    player.ang = normAng(player.ang + player.angVel * dt);

    player.radialVel += (-player.radialBounce * 180 - player.radialVel * 14) * dt;
    player.radialBounce += player.radialVel * dt;

    // ===== SPATIAL WAVE SPAWNER (ZERO OVERLAP GUARANTEED) =====
    const spawnR = getSpawnRadius();
    if (getOutermostWallOuterR() <= spawnR - nextRequiredClearance) {
      spawnFairWave(wallSpd);
    }

    // Update Walls
    for (let i = walls.length - 1; i >= 0; i--) {
      const w = walls[i];
      w.r -= wallSpd * dt;
      w.start = normAng(w.start + w.rotSpd * dt);
      if (w.hitFlash > 0) w.hitFlash = Math.max(0, w.hitFlash - dt * 5);
      w.vibeOff *= Math.pow(0.01, dt);

      if (w.kind === 'phantom' && !w.vanished) {
        if (w.r < w.phantomTriggerR) {
          w.phantomAlpha -= dt * 1.45;
          if (Math.random() < 0.45) {
            const pa = w.start + Math.random() * w.span;
            emitSparks(Math.cos(pa) * w.r, Math.sin(pa) * w.r, Math.cos(pa), Math.sin(pa), 1, '#a6ffff', 0.45);
          }
          if (w.phantomAlpha <= 0.04 || w.r < 155) {
            w.vanished = true;
            w.phantomAlpha = 0;
          }
        }
      } else if (w.kind === 'split') {
        const osc = Math.sin(runTime * 2.6 + w.phase);
        w.span = clamp(w.baseSpan + osc * w.oscAmp, 0.4, Math.PI - 0.96);
        w.start = normAng(w.baseStart - osc * w.oscAmp * 0.5);
      } else if (w.kind === 'breathe') {
        const osc = Math.sin(runTime * 2.8 + w.phase);
        w.span = clamp(w.baseSpan + osc * w.oscAmp, 0.42, Math.PI - 0.96);
      }

      if (w.r + w.thick < CORE_R - 8) walls.splice(i, 1);
    }

    // Level 3 Telegraphed Solar Core Lasers (fair 1.70s charge + audio ticks)
    if (curLvl.id === 2 && hyperAmt < 0.25 && runTime > 3.5) {
      laserTimer -= dt;
      if (laserTimer <= 0) {
        const aimAng = normAng(player.ang + (Math.random() - 0.5) * 0.4);
        lasers.push({
          ang: aimAng,
          state: 'warn',
          timer: 1.70,
          maxWarn: 1.70,
          ticks: 3,
          halfWidth: 0.082
        });
        laserTimer = Math.max(3.6, 5.4 - speedTier * 0.22);
      }
    }
    for (let i = lasers.length - 1; i >= 0; i--) {
      const lz = lasers[i];
      lz.timer -= dt;
      if (lz.state === 'warn') {
        const remainTicks = Math.ceil(lz.timer / 0.52);
        if (remainTicks < lz.ticks && remainTicks >= 0) {
          lz.ticks = remainTicks;
          playSfx('tick');
        }
        if (lz.timer <= 0) {
          lz.state = 'fire';
          lz.timer = 0.42;
          playSfx('laser');
          shake = Math.max(shake, 4.0);
        }
      } else if (lz.timer <= 0) {
        lasers.splice(i, 1);
      }
    }

    // Coins
    const pR = ORBIT_R + player.radialBounce;
    const magnetRange = save.perks.magnet ? 115 : 28 * player.scale;
    for (let i = coins.length - 1; i >= 0; i--) {
      const c = coins[i];
      c.r -= wallSpd * dt;
      c.pulse += dt * 5;
      const checkAngs = duality.active ? [player.ang, normAng(player.ang + Math.PI * duality.splitBlend)] : [player.ang];
      for (const a of checkAngs) {
        const dx = Math.cos(c.ang) * c.r - Math.cos(a) * pR;
        const dy = Math.sin(c.ang) * c.r - Math.sin(a) * pR;
        const dist = Math.hypot(dx, dy);
        if (save.perks.magnet && dist < magnetRange && dist > 1) {
          c.r = lerp(c.r, pR, dt * 7);
          c.ang = normAng(c.ang + angDiff(a, c.ang) * dt * 8);
        }
        if (dist < 24 * Math.sqrt(player.scale)) {
          c.taken = true;
          save.coins += 1;
          runCoins += 1;
          coinHud.textContent = `◈ ${save.coins}`;
          playSfx('coin');
          vibe(10);
          emitSparks(Math.cos(c.ang) * c.r, Math.sin(c.ang) * c.r, Math.cos(c.ang), Math.sin(c.ang), 10, '#ffd800', 0.85);
          addFloatText(Math.cos(c.ang) * c.r, Math.sin(c.ang) * c.r - 10, '+1 ◈', '#ffd800');
          break;
        }
      }
      if (c.taken || c.r < CORE_R) coins.splice(i, 1);
    }

    // Hyper-Tunnel warp streaks
    if (hyperAmt > 0.02) {
      for (const st of warpStreaks) {
        st.r -= st.spd * dt * (1.1 + hyperAmt * 1.3);
        if (st.r < 0.08) {
          st.r = 1.05;
          st.ang = Math.random() * TAU;
        }
      }
    }

    // Collisions
    if (curLvl.id === 3 && duality.active) {
      const angA = player.ang;
      const angB = normAng(player.ang + Math.PI * duality.splitBlend);
      const resA = processCloneCollisions(angA, dt, wallSpd);
      const resB = processCloneCollisions(angB, dt, wallSpd);

      if (resA.died && resB.died) {
        triggerDeath(angA);
      } else if (resA.died || resB.died) {
        const hitAng = resA.died ? angA : angB;
        const survAng = resA.died ? angB : angA;
        playSfx('shatter');
        vibe([25, 25, 20]);
        hitStop = 0.06;
        shake = 9;
        shatterAt(hitAng, player.scale, resA.died ? curLvl.accent : '#00f5ff');
        duality.active = false;
        duality.splitBlend = 0;
        duality.respawnTimer = 9.0;
        player.ang = survAng;
        player.grace = 0.9;
        showBanner('CLONE LOST · SURVIVE 9S', 1.7);
      } else {
        if (resA.ang !== angA) player.ang = resA.ang;
        else if (resB.ang !== angB) player.ang = normAng(resB.ang - Math.PI * duality.splitBlend);
      }
    } else {
      const res = processCloneCollisions(player.ang, dt, wallSpd);
      if (res.died) triggerDeath(player.ang);
      else player.ang = res.ang;
    }
  }

  // ===== 3D PROJECTION (SCALED TO NORMALIZED VIRTUAL ARENA) =====
  function project(wx, wy, wz) {
    const rot = worldRot + camSway;
    const cr = Math.cos(rot), sr = Math.sin(rot);
    let x = wx * cr - wy * sr;
    let y = wx * sr + wy * cr;
    let z = wz * depth3D;

    const cx = Math.cos(camTiltX), sx = Math.sin(camTiltX);
    const y1 = y * cx - z * sx;
    const z1 = y * sx + z * cx;

    const cy = Math.cos(camTiltY), sy = Math.sin(camTiltY);
    const x2 = x * cy + z1 * sy;
    const z2 = -x * sy + z1 * cy;

    const fov = 720;
    const persp = fov / Math.max(170, fov - z2);
    const s = persp * camZoom * arenaScale;
    return { x: W * 0.5 + x2 * s, y: H * 0.5 + y1 * s, s };
  }

  // ===== LEVEL-SPECIFIC ATMOSPHERIC BACKGROUNDS =====
  function drawLevelBackground() {
    const t = performance.now() * 0.001;

    // 1. Rich multi-stop radial gradient backdrop
    const grad = ctx.createRadialGradient(W * 0.5, H * 0.5, 16 * arenaScale, W * 0.5, H * 0.5, Math.max(W, H) * 0.72);
    grad.addColorStop(0, curLvl.bg);
    grad.addColorStop(0.55, curLvl.bgMid);
    grad.addColorStop(1, curLvl.bgDeep);
    ctx.fillStyle = grad;
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // 2. Unique architectural motif per level
    ctx.save();
    if (curLvl.id === 0) {
      // LEVEL 1: CYAN PULSE — Holographic 6-sector blueprint grid + expanding beat sonar ripples
      ctx.strokeStyle = curLvl.gridCol;
      ctx.lineWidth = 1.2;
      for (let k = 0; k < 6; k++) {
        const a = (k / 6) * TAU;
        const p1 = project(Math.cos(a) * CORE_R, Math.sin(a) * CORE_R, -12);
        const p2 = project(Math.cos(a) * 520, Math.sin(a) * 520, -12);
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }
      for (const rp of sonarRipples) {
        ctx.strokeStyle = curLvl.accent;
        ctx.globalAlpha = clamp(rp.alpha, 0, 1);
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        for (let s = 0; s <= 40; s++) {
          const a = (s / 40) * TAU;
          const p = project(Math.cos(a) * rp.r, Math.sin(a) * rp.r, -6);
          if (s === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();
        ctx.stroke();
      }
    } else if (curLvl.id === 1) {
      // LEVEL 2: CRIMSON PHANTOM — Rotating Tactical Radar Sweep + Range Rings
      ctx.strokeStyle = curLvl.gridCol;
      ctx.lineWidth = 1;
      for (let rad = 110; rad <= 440; rad += 110) {
        ctx.beginPath();
        for (let s = 0; s <= 44; s++) {
          const a = (s / 44) * TAU;
          const p = project(Math.cos(a) * rad, Math.sin(a) * rad, -10);
          if (s === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();
        ctx.stroke();
      }
      // Rotating radar sweep cone
      const sweepA = t * 1.15;
      const c0 = project(0, 0, -8);
      ctx.beginPath();
      ctx.moveTo(c0.x, c0.y);
      for (let s = 0; s <= 12; s++) {
        const a = sweepA - (s / 12) * 0.72;
        const p = project(Math.cos(a) * 480, Math.sin(a) * 480, -8);
        ctx.lineTo(p.x, p.y);
      }
      ctx.closePath();
      ctx.fillStyle = 'rgba(255, 30, 60, 0.08)';
      ctx.fill();
    } else if (curLvl.id === 2) {
      // LEVEL 3: GOLD ECLIPSE — Giant Counter-Rotating Background Clockwork Gears + Solar Rays
      const drawBgGear = (rad, teeth, rotOff, alpha) => {
        ctx.strokeStyle = curLvl.accent;
        ctx.globalAlpha = alpha;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        const total = teeth * 2;
        for (let i = 0; i <= total; i++) {
          const a = rotOff + (i / total) * TAU;
          const rr = rad + (i % 2 === 0 ? 18 : -6);
          const p = project(Math.cos(a) * rr, Math.sin(a) * rr, -22);
          if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();
        ctx.stroke();
      };
      drawBgGear(190, 16, t * 0.25, 0.11);
      drawBgGear(325, 24, -t * 0.18, 0.08);
      // Warm solar corona glow behind core
      const c0 = project(0, 0, 0);
      const sg = ctx.createRadialGradient(c0.x, c0.y, 12 * arenaScale, c0.x, c0.y, 165 * arenaScale);
      sg.addColorStop(0, 'rgba(255, 212, 0, 0.16)');
      sg.addColorStop(1, 'rgba(255, 212, 0, 0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = sg;
      ctx.beginPath();
      ctx.arc(c0.x, c0.y, 165 * arenaScale, 0, TAU);
      ctx.fill();
    } else {
      // LEVEL 4: VIOLET DUALITY — Cosmic Starfield + Symmetrical Hex-Prism Lattice
      ctx.strokeStyle = 'rgba(0, 245, 255, 0.07)';
      ctx.lineWidth = 1.2;
      for (let ring = 1; ring <= 3; ring++) {
        const rad = ring * 135;
        ctx.beginPath();
        for (let s = 0; s <= 6; s++) {
          const a = (s / 6) * TAU + (ring % 2) * 0.52;
          const p = project(Math.cos(a) * rad, Math.sin(a) * rad, -18);
          if (s === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();
        ctx.stroke();
      }
      // Harmonic rotation direction indicator chevron around core
      if (mode === 'play') {
        const spinDir = worldSpin >= 0 ? 1 : -1;
        const indR = CORE_R + 14;
        ctx.strokeStyle = spinDir > 0 ? '#ca4eff' : '#00f5ff';
        ctx.globalAlpha = 0.35 + Math.abs(worldSpin) * 0.45;
        ctx.lineWidth = 2;
        for (let side = 0; side < 2; side++) {
          const base = side * Math.PI + t * spinDir * 1.4;
          ctx.beginPath();
          for (let s = 0; s <= 8; s++) {
            const a = base + (s / 8) * 0.55 * spinDir;
            const p = project(Math.cos(a) * indR, Math.sin(a) * indR, 4);
            if (s === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
          }
          ctx.stroke();
        }
      }
    }

    // Subtle drifting ambient motes/embers/stars
    for (const bp of bgParticles) {
      const p = project(Math.cos(bp.ang) * bp.r, Math.sin(bp.ang) * bp.r, -25);
      ctx.globalAlpha = bp.alpha * (curLvl.id === 3 ? 0.85 : 0.45);
      ctx.fillStyle = curLvl.id === 3 && (bp.sz > 2.2) ? '#00f5ff' : curLvl.rim;
      ctx.fillRect(p.x, p.y, bp.sz * arenaScale, bp.sz * arenaScale);
    }
    ctx.restore();
  }

  // ===== EXTRUDED 3D WALL RENDERER WITH LEVEL-SPECIFIC STYLING =====
  function drawExtrudedSector(rIn, rOut, startAng, span, zTop, fillTop, fillSide, rimCol, alpha, style) {
    const isGear = (style === 'gear');
    const isPhantom = (style === 'phantom');
    const segs = isGear ? Math.max(8, Math.ceil(span * 11)) : Math.max(6, Math.ceil(span * 14));
    const botOut = [], botIn = [], topOut = [], topIn = [];

    for (let i = 0; i <= segs; i++) {
      const f = i / segs;
      const a = startAng + f * span;
      let rO = rOut;
      let rI = rIn;
      if (isGear) {
        const tooth = (i % 2 === 0 ? 6.5 : -2.5);
        rO += tooth;
        rI += tooth * 0.35;
      }
      const ca = Math.cos(a), sa = Math.sin(a);
      topOut.push(project(ca * rO, sa * rO, zTop));
      topIn.push(project(ca * rI, sa * rI, zTop));
      if (depth3D > 0.04) {
        botOut.push(project(ca * rO, sa * rO, 0));
        botIn.push(project(ca * rI, sa * rI, 0));
      }
    }

    ctx.save();
    ctx.globalAlpha = alpha;

    // 3D Extruded Side Walls
    if (depth3D > 0.04 && !isPhantom) {
      ctx.fillStyle = fillSide;
      ctx.beginPath();
      for (let i = 0; i <= segs; i++) {
        if (i === 0) ctx.moveTo(botIn[i].x, botIn[i].y); else ctx.lineTo(botIn[i].x, botIn[i].y);
      }
      for (let i = segs; i >= 0; i--) ctx.lineTo(topIn[i].x, topIn[i].y);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      for (let i = 0; i <= segs; i++) {
        if (i === 0) ctx.moveTo(botOut[i].x, botOut[i].y); else ctx.lineTo(botOut[i].x, botOut[i].y);
      }
      for (let i = segs; i >= 0; i--) ctx.lineTo(topOut[i].x, topOut[i].y);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(botIn[0].x, botIn[0].y); ctx.lineTo(botOut[0].x, botOut[0].y);
      ctx.lineTo(topOut[0].x, topOut[0].y); ctx.lineTo(topIn[0].x, topIn[0].y);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(botIn[segs].x, botIn[segs].y); ctx.lineTo(botOut[segs].x, botOut[segs].y);
      ctx.lineTo(topOut[segs].x, topOut[segs].y); ctx.lineTo(topIn[segs].x, topIn[segs].y);
      ctx.closePath();
      ctx.fill();
    }

    // Top Cap (Phantom walls get distinct translucent holographic look!)
    ctx.beginPath();
    for (let i = 0; i <= segs; i++) {
      if (i === 0) ctx.moveTo(topOut[i].x, topOut[i].y); else ctx.lineTo(topOut[i].x, topOut[i].y);
    }
    for (let i = segs; i >= 0; i--) ctx.lineTo(topIn[i].x, topIn[i].y);
    ctx.closePath();

    if (isPhantom) {
      ctx.fillStyle = 'rgba(130, 255, 255, 0.24)';
      ctx.fill();
      ctx.setLineDash([6, 5]);
      ctx.strokeStyle = '#a8ffff';
      ctx.lineWidth = 2.0;
      ctx.stroke();
      ctx.setLineDash([]);
    } else {
      ctx.fillStyle = fillTop;
      ctx.fill();

      // Bright inner leading-edge rim highlight for crystal-clear readability!
      ctx.beginPath();
      for (let i = 0; i <= segs; i++) {
        if (i === 0) ctx.moveTo(topIn[i].x, topIn[i].y); else ctx.lineTo(topIn[i].x, topIn[i].y);
      }
      ctx.strokeStyle = rimCol;
      ctx.lineWidth = (1.6 + depth3D * 0.9) * arenaScale;
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawSkinLetter(ang, scale, color, isPhasing, isCloneB) {
    const r = ORBIT_R + player.radialBounce;
    const ux = Math.cos(ang), uy = Math.sin(ang);
    const vx = -uy, vy = ux;
    const sz = 9.5 * scale;

    if (depth3D > 0.08) {
      const sh = project(ux * r, uy * r, 0);
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.beginPath();
      ctx.arc(sh.x, sh.y, sz * 0.72 * sh.s, 0, TAU);
      ctx.fill();
      ctx.restore();
    }

    const zLift = 12 * depth3D;
    const toScreen = (lx, ly) => project(ux * r + vx * lx * sz + ux * ly * sz, uy * r + vy * lx * sz + uy * ly * sz, zLift);

    ctx.save();
    if (isPhasing) {
      ctx.globalAlpha = 0.65 + Math.sin(runTime * 28) * 0.25;
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 16;
    } else if (player.grace > 0 && Math.floor(runTime * 18) % 2 === 0) {
      ctx.globalAlpha = 0.45;
    } else {
      ctx.shadowColor = isCloneB ? '#00f5ff' : color;
      ctx.shadowBlur = 10;
    }

    ctx.strokeStyle = isPhasing ? '#ffffff' : (isCloneB ? '#00f5ff' : curLvl.rim);
    ctx.lineWidth = Math.max(2.2, 2.6 * Math.sqrt(scale) * arenaScale);
    ctx.lineJoin = 'miter';
    ctx.lineCap = 'square';

    const skin = save.skin || 'M';
    if (skin === 'M') {
      const pts = [[-0.95, -0.75], [-0.72, 0.95], [0, 0.05], [0.72, 0.95], [0.95, -0.75]].map(p => toScreen(p[0], p[1]));
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();
    } else if (skin === 'A') {
      const p1 = toScreen(-0.85, -0.8), p2 = toScreen(0, 1.05), p3 = toScreen(0.85, -0.8);
      const b1 = toScreen(-0.46, -0.15), b2 = toScreen(0.46, -0.15);
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y);
      ctx.moveTo(b1.x, b1.y); ctx.lineTo(b2.x, b2.y);
      ctx.stroke();
    } else {
      const a1 = toScreen(-0.82, -0.82), a2 = toScreen(0.82, 0.88);
      const b1 = toScreen(0.82, -0.82), b2 = toScreen(-0.82, 0.88);
      ctx.beginPath();
      ctx.moveTo(a1.x, a1.y); ctx.lineTo(a2.x, a2.y);
      ctx.moveTo(b1.x, b1.y); ctx.lineTo(b2.x, b2.y);
      ctx.stroke();
    }

    if (isPhasing) {
      const c = project(ux * r, uy * r, zLift);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(c.x, c.y, sz * 1.45 * c.s, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ===== UNIQUE CENTRAL CORE PER LEVEL =====
  function drawLevelCore() {
    const coreZ = 18 * depth3D;
    const coreR = CORE_R + beatPulse * 2.5;
    const coreSteps = 44;

    if (depth3D > 0.06) {
      ctx.save();
      ctx.fillStyle = curLvl.sideShade;
      ctx.beginPath();
      for (let i = 0; i <= coreSteps; i++) {
        const a = (i / coreSteps) * TAU;
        const p = project(Math.cos(a) * CORE_R, Math.sin(a) * CORE_R, 0);
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    ctx.save();
    ctx.beginPath();
    if (curLvl.id === 2) {
      // Level 3: Toothed Clockwork Gear Core
      const teeth = 12;
      const tot = teeth * 2;
      for (let i = 0; i <= tot; i++) {
        const a = (i / tot) * TAU + runTime * 0.6;
        const rr = coreR + (i % 2 === 0 ? 4.5 : -1.5);
        const p = project(Math.cos(a) * rr, Math.sin(a) * rr, coreZ);
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      }
    } else {
      for (let i = 0; i <= coreSteps; i++) {
        const a = (i / coreSteps) * TAU;
        const p = project(Math.cos(a) * coreR, Math.sin(a) * coreR, coreZ);
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      }
    }
    ctx.closePath();
    ctx.fillStyle = curLvl.bgDeep;
    ctx.fill();

    if (curLvl.id === 3) {
      // Level 4: Dual-Colored Quantum Core (Violet + Cyan halves)
      for (let half = 0; half < 2; half++) {
        ctx.beginPath();
        for (let i = 0; i <= 22; i++) {
          const a = half * Math.PI + (i / 22) * Math.PI;
          const p = project(Math.cos(a) * coreR, Math.sin(a) * coreR, coreZ);
          if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        }
        ctx.strokeStyle = half === 0 ? curLvl.accent : '#00f5ff';
        ctx.lineWidth = 4.2 * arenaScale;
        ctx.stroke();
      }
    } else {
      ctx.strokeStyle = curLvl.accent;
      ctx.lineWidth = 4.2 * arenaScale;
      ctx.stroke();
    }

    // Level 2: Tactical Reticle Ticks inside Core
    if (curLvl.id === 1) {
      ctx.strokeStyle = 'rgba(255, 30, 60, 0.55)';
      ctx.lineWidth = 1.6;
      for (let k = 0; k < 4; k++) {
        const a = k * Math.PI * 0.5;
        const p1 = project(Math.cos(a) * (CORE_R - 11), Math.sin(a) * (CORE_R - 11), coreZ);
        const p2 = project(Math.cos(a) * (CORE_R - 3), Math.sin(a) * (CORE_R - 3), coreZ);
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }
    }

    // Subtle Phase Fuel Arc inside Core
    if (mode === 'play') {
      const frac = player.phaseFuel / player.phaseMax;
      if (frac > 0.01) {
        const rG = CORE_R - 7.5;
        const gSteps = Math.max(4, Math.ceil(frac * 36));
        ctx.beginPath();
        for (let i = 0; i <= gSteps; i++) {
          const a = -Math.PI * 0.5 + (i / gSteps) * frac * TAU;
          const p = project(Math.cos(a) * rG, Math.sin(a) * rG, coreZ);
          if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        }
        ctx.strokeStyle = player.phasing ? '#ffffff' : 'rgba(255,255,255,0.48)';
        ctx.lineWidth = 2.4 * arenaScale;
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // ===== MAIN RENDER LOOP =====
  function draw() {
    ctx.save();
    if (shake > 0.2) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    drawLevelBackground();

    // 3D Depth Tunnel Rings
    if (depth3D > 0.04) {
      ctx.save();
      ctx.strokeStyle = curLvl.accent;
      for (let k = 1; k <= 5; k++) {
        const zDepth = -k * 65 * depth3D;
        const rad = 110 + k * 75;
        ctx.globalAlpha = (0.14 - k * 0.02) * depth3D * (1 + hyperAmt * 0.85);
        ctx.lineWidth = 1.2 + hyperAmt;
        ctx.beginPath();
        for (let s = 0; s <= 40; s++) {
          const a = (s / 40) * TAU;
          const p = project(Math.cos(a) * rad, Math.sin(a) * rad, zDepth);
          if (s === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();
        ctx.stroke();
      }
      ctx.restore();
    }

    // 3D HYPER-TUNNEL Warp Streaks
    if (hyperAmt > 0.03) {
      ctx.save();
      ctx.strokeStyle = curLvl.rim;
      ctx.lineWidth = 1.6;
      const maxR = getSpawnRadius();
      for (const st of warpStreaks) {
        const r1 = st.r * maxR;
        const r2 = Math.max(CORE_R, (st.r - 0.14) * maxR);
        const p1 = project(Math.cos(st.ang) * r1, Math.sin(st.ang) * r1, 20);
        const p2 = project(Math.cos(st.ang) * r2, Math.sin(st.ang) * r2, -30);
        ctx.globalAlpha = hyperAmt * 0.45 * (1 - Math.abs(st.r - 0.5));
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }
      ctx.restore();
    }

    // Walls (sorted outer-to-inner for crisp 3D painter's order)
    const sortedWalls = walls.slice().sort((a, b) => b.r - a.r);
    for (const w of sortedWalls) {
      if (w.vanished) continue;
      let alpha = 1;
      let topCol = curLvl.accent;
      let sideCol = curLvl.sideShade;
      let rimCol = curLvl.rim;

      if (w.kind === 'phantom') {
        alpha = clamp(w.phantomAlpha, 0, 1);
      } else if (curLvl.id === 3) {
        // Level 4 twin walls have cyan rim glow on alternating phase
        rimCol = '#96ffff';
      }
      if (w.hitFlash > 0.05) {
        topCol = '#ffffff';
        rimCol = '#ffffff';
      }

      const rIn = Math.max(CORE_R * 0.86, w.r + w.vibeOff);
      const rOut = Math.max(rIn + 2, w.r + w.thick + w.vibeOff);
      const h3d = w.height3D * (1 + hyperAmt * 0.5);
      drawExtrudedSector(rIn, rOut, w.start, w.span, h3d, topCol, sideCol, rimCol, alpha, w.kind);
    }

    // Level 3 Solar Core Lasers (Charging Orb + Converging Sightlines + Plasma Beam)
    for (const lz of lasers) {
      const maxR = getSpawnRadius() + 40;
      ctx.save();
      if (lz.state === 'warn') {
        const prog = 1 - clamp(lz.timer / lz.maxWarn, 0, 1);
        const orbPos = project(Math.cos(lz.ang) * (CORE_R + 3), Math.sin(lz.ang) * (CORE_R + 3), 18);
        // Converging telegraph lines
        const spread = (1 - prog) * 0.14 + lz.halfWidth;
        ctx.strokeStyle = prog > 0.72 ? '#ffffff' : '#ffd400';
        ctx.globalAlpha = 0.35 + prog * 0.55;
        ctx.setLineDash([7, 5]);
        ctx.lineWidth = 1.6 + prog * 1.2;
        for (const sgn of [-1, 1]) {
          const a = lz.ang + sgn * spread;
          const p1 = project(Math.cos(a) * CORE_R, Math.sin(a) * CORE_R, 14);
          const p2 = project(Math.cos(a) * maxR, Math.sin(a) * maxR, 14);
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }
        ctx.setLineDash([]);
        // Charging plasma orb at core rim
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#ffd400';
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.arc(orbPos.x, orbPos.y, (3 + prog * 7) * arenaScale, 0, TAU);
        ctx.fill();
      } else {
        drawExtrudedSector(CORE_R, maxR, lz.ang - lz.halfWidth, lz.halfWidth * 2, 24, '#ffffff', '#ffd400', '#ffffff', 0.94, 'arc');
      }
      ctx.restore();
    }

    // Coins
    for (const c of coins) {
      const p = project(Math.cos(c.ang) * c.r, Math.sin(c.ang) * c.r, 16);
      const sz = (7.2 + Math.sin(c.pulse) * 1.4) * p.s;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(c.pulse * 0.5);
      ctx.fillStyle = '#ffd800';
      ctx.shadowColor = '#ffd800';
      ctx.shadowBlur = 11;
      ctx.beginPath();
      ctx.moveTo(0, -sz);
      ctx.lineTo(sz * 0.78, 0);
      ctx.lineTo(0, sz);
      ctx.lineTo(-sz * 0.78, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    drawLevelCore();

    // Level 4 Duality Neon Tether
    if (mode === 'play' && curLvl.id === 3 && duality.active) {
      const angA = player.ang;
      const angB = normAng(player.ang + Math.PI * duality.splitBlend);
      const rP = ORBIT_R + player.radialBounce;
      const pA = project(Math.cos(angA) * rP, Math.sin(angA) * rP, 12);
      const pB = project(Math.cos(angB) * rP, Math.sin(angB) * rP, 12);
      ctx.save();
      ctx.strokeStyle = '#00f5ff';
      ctx.globalAlpha = 0.6;
      ctx.lineWidth = 2.0 * arenaScale;
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.moveTo(pA.x, pA.y);
      ctx.lineTo(pB.x, pB.y);
      ctx.stroke();
      ctx.restore();
    }

    // Player(s)
    if (mode === 'play' || mode === 'menu') {
      drawSkinLetter(player.ang, player.scale, curLvl.accent, player.phasing, false);
      if (mode === 'play' && curLvl.id === 3 && duality.active) {
        const angB = normAng(player.ang + Math.PI * duality.splitBlend);
        drawSkinLetter(angB, player.scale, '#00f5ff', player.phasing, true);
      }
    }

    // Sparks
    for (const s of sparks) {
      const p = project(s.x, s.y, 12);
      ctx.save();
      ctx.globalAlpha = clamp(s.life / s.maxLife, 0, 1);
      ctx.fillStyle = s.color;
      ctx.fillRect(p.x - s.size * 0.5, p.y - s.size * 0.5, s.size * arenaScale, s.size * arenaScale);
      ctx.restore();
    }

    // Ricocheting Shards
    for (const sh of shards) {
      const p = project(sh.x, sh.y, 14);
      ctx.save();
      ctx.globalAlpha = clamp(sh.life / sh.maxLife, 0, 1);
      ctx.translate(p.x, p.y);
      ctx.rotate(sh.rot);
      ctx.fillStyle = sh.color;
      const sz = sh.sz * arenaScale;
      ctx.beginPath();
      ctx.moveTo(0, -sz);
      ctx.lineTo(sz * 0.75, sz * 0.65);
      ctx.lineTo(-sz * 0.75, sz * 0.45);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // Floating +1 Coin Text
    for (const ft of floatTexts) {
      const p = project(ft.x, ft.y, 18);
      ctx.save();
      ctx.globalAlpha = clamp(ft.life / ft.maxLife, 0, 1);
      ctx.fillStyle = ft.color;
      ctx.font = `900 ${Math.round(13 * arenaScale)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(ft.text, p.x, p.y);
      ctx.restore();
    }

    ctx.restore();
  }

  // ===== RAF LOOP =====
  let lastTs = performance.now();
  function loop(ts) {
    const dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  applyTheme(curLvl);
  renderMenu();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
