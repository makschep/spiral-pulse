<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>.Spiral Pulse</title>
  <meta name="description" content=".Spiral Pulse — 3D Radial Survival Arcade" />
  <meta name="theme-color" content="#001417" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content=".Spiral Pulse" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png" />
  <style>
    :root {
      --bg: #002024;
      --accent: #00ffff;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000e10;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      touch-action: none;
    }
    #stage {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      transform-origin: center center;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #timerBox {
      position: absolute;
      top: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.9);
      border-left: 3px solid var(--accent);
      border-bottom: 3px solid var(--accent);
      padding: 6px 15px 7px 17px;
      color: var(--accent);
      font-weight: 900;
      font-size: 26px;
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
      z-index: 20;
      pointer-events: none;
      display: none;
      box-shadow: -4px 4px 18px rgba(0, 0, 0, 0.5);
    }
    #hudTopLeft {
      position: absolute;
      top: 10px;
      left: 12px;
      display: none;
      align-items: center;
      gap: 8px;
      z-index: 20;
    }
    .pillBtn {
      background: rgba(0, 0, 0, 0.72);
      color: var(--accent);
      border: 2px solid var(--accent);
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      text-transform: uppercase;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .pillBtn:active { transform: scale(0.94); }
    #coinHud {
      background: rgba(0, 0, 0, 0.72);
      color: #ffd800;
      border: 2px solid #ffd800;
      padding: 5px 10px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.5px;
      pointer-events: none;
    }
    #eventBanner {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      padding: 5px 16px;
      background: rgba(0, 0, 0, 0.84);
      border: 2px solid var(--accent);
      color: var(--accent);
      font-weight: 900;
      font-size: 13px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.35s ease;
      z-index: 25;
      white-space: nowrap;
    }
    #eventBanner.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 22px;
      background: radial-gradient(circle at 50% 50%, rgba(0, 12, 16, 0.42) 0%, rgba(0, 6, 10, 0.86) 100%);
      z-index: 30;
      transition: opacity 0.25s ease;
    }
    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .topBar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--accent);
      text-shadow: 0 0 18px color-mix(in srgb, var(--accent) 45%, transparent);
    }
    .topRight {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .levelsGrid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 840px;
      margin: auto;
    }
    .lvlCard {
      background: rgba(0, 0, 0, 0.76);
      border: 2px solid rgba(255, 255, 255, 0.18);
      padding: 12px 12px 11px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
      position: relative;
      overflow: hidden;
    }
    .lvlCard::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--c);
      opacity: 0.4;
      transition: opacity 0.16s ease;
    }
    .lvlCard.selected {
      transform: translateY(-3px);
      border-color: var(--c);
      box-shadow: 0 0 22px color-mix(in srgb, var(--c) 45%, transparent);
    }
    .lvlCard.selected::before { opacity: 1; }
    .lvlNum {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: var(--c);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .lvlName {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.8px;
      color: #fff;
      line-height: 1.15;
    }
    .lvlTag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.7px;
      color: rgba(255, 255, 255, 0.62);
      text-transform: uppercase;
    }
    .lvlFoot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 11px;
      font-weight: 800;
      color: var(--c);
      font-variant-numeric: tabular-nums;
    }
    .medal {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
    }
    .medal.bronze { background: #cd7f32; box-shadow: 0 0 6px #cd7f32; }
    .medal.silver { background: #e2e8f0; box-shadow: 0 0 6px #e2e8f0; }
    .medal.gold { background: #ffd800; box-shadow: 0 0 8px #ffd800; }

    .bottomBar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .ctrlHints {
      display: flex;
      gap: 10px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.68);
    }
    .ctrlHints span {
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 4px 8px;
      background: rgba(0, 0, 0, 0.55);
    }
    #playBtn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 11px 40px;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 3px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 55%, transparent);
      transition: transform 0.12s ease;
    }
    #playBtn:active { transform: scale(0.95); }

    #shopModal {
      justify-content: center;
      align-items: center;
      background: rgba(0, 8, 12, 0.92);
      z-index: 40;
    }
    .shopPanel {
      width: 100%;
      max-width: 720px;
      background: #060d12;
      border: 2px solid var(--accent);
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .shopHead {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .shopTitle {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--accent);
    }
    .shopRow {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .shopLabel {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.55);
      margin-bottom: -6px;
    }
    .shopItem {
      background: rgba(255, 255, 255, 0.04);
      border: 2px solid rgba(255, 255, 255, 0.18);
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: #fff;
      transition: border-color 0.15s ease, transform 0.12s ease;
    }
    .shopItem:active { transform: scale(0.96); }
    .shopItem.owned { border-color: rgba(0, 255, 255, 0.45); }
    .shopItem.active {
      border-color: #ffd800;
      background: rgba(255, 216, 0, 0.12);
    }
    .skinGlyph {
      font-size: 26px;
      font-weight: 900;
      color: var(--accent);
      line-height: 1;
    }
    .perkName {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .perkSub {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.6);
      text-align: center;
    }
    .priceTag {
      font-size: 11px;
      font-weight: 900;
      color: #ffd800;
      letter-spacing: 0.8px;
    }

    #overOverlay {
      justify-content: center;
      align-items: center;
      gap: 16px;
      background: rgba(0, 0, 0, 0.72);
      z-index: 35;
    }
    .overBox {
      background: rgba(0, 0, 0, 0.9);
      border: 2px solid var(--accent);
      padding: 20px 34px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      min-width: 310px;
    }
    .overTime {
      font-size: 44px;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .overMeta {
      display: flex;
      gap: 18px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: rgba(255, 255, 255, 0.78);
    }
    .overBtns {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }
    #retryBtn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px 28px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
    }
    #installBtn {
      display: none;
      border-color: #ffd800;
      color: #ffd800;
    }
    @media (max-height: 410px) {
      .overlay { padding: 10px 14px; }
      .brand { font-size: 19px; }
      .lvlCard { padding: 8px 9px; gap: 5px; }
      .lvlName { font-size: 13px; }
      #playBtn { padding: 8px 26px; font-size: 14px; }
      .shopPanel { padding: 10px 14px; gap: 8px; }
      .skinGlyph { font-size: 20px; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>

    <div id="timerBox">0:00</div>
    <div id="hudTopLeft">
      <button class="pillBtn" id="pauseBackBtn">MENU</button>
      <div id="coinHud">◈ 0</div>
    </div>
    <div id="eventBanner">3D HYPER-TUNNEL</div>

    <!-- MAIN MENU -->
    <div id="menuOverlay" class="overlay">
      <div class="topBar">
        <div class="brand">.SPIRAL PULSE</div>
        <div class="topRight">
          <div id="menuCoins" class="pillBtn" style="border-color:#ffd800;color:#ffd800;cursor:default;">◈ 0</div>
          <button id="installBtn" class="pillBtn">INSTALL</button>
          <button id="soundBtn" class="pillBtn">SFX: ON</button>
          <button id="shopOpenBtn" class="pillBtn">SHOP</button>
        </div>
      </div>

      <div class="levelsGrid" id="levelsGrid"></div>

      <div class="bottomBar">
        <div class="ctrlHints">
          <span>HOLD L / R: TURN</span>
          <span>HOLD L + R: PHASE</span>
        </div>
        <button id="playBtn">PLAY</button>
      </div>
    </div>

    <!-- SHOP MODAL -->
    <div id="shopModal" class="overlay hidden">
      <div class="shopPanel">
        <div class="shopHead">
          <div class="shopTitle">SHOP</div>
          <div style="display:flex;gap:8px;align-items:center;">
            <div id="shopCoins" class="pillBtn" style="border-color:#ffd800;color:#ffd800;cursor:default;">◈ 0</div>
            <button id="shopCloseBtn" class="pillBtn">CLOSE</button>
          </div>
        </div>

        <div class="shopLabel">SKINS</div>
        <div class="shopRow" id="skinsRow"></div>

        <div class="shopLabel">PERKS</div>
        <div class="shopRow" id="perksRow"></div>
      </div>
    </div>

    <!-- GAME OVER -->
    <div id="overOverlay" class="overlay hidden">
      <div class="overBox">
        <div id="overLevel" style="font-size:11px;font-weight:900;letter-spacing:2px;color:rgba(255,255,255,0.6);">01 · CYAN PULSE</div>
        <div class="overTime" id="overTime">0:00</div>
        <div class="overMeta">
          <span id="overBest">BEST 0:00</span>
          <span id="overRunCoins" style="color:#ffd800;">+0 ◈</span>
        </div>
        <div class="overBtns">
          <button id="retryBtn">RETRY</button>
          <button id="overMenuBtn" class="pillBtn">MENU</button>
        </div>
      </div>
    </div>
  </div>

<script>
(() => {
  'use strict';

  // ===== PWA REGISTRATION & INSTALL PROMPT =====
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
  let deferredInstallPrompt = null;
  const installBtn = document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    installBtn.style.display = 'inline-block';
  });
  installBtn.addEventListener('click', async () => {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    try { await deferredInstallPrompt.userChoice; } catch (_) {}
    deferredInstallPrompt = null;
    installBtn.style.display = 'none';
  });
  window.addEventListener('appinstalled', () => {
    installBtn.style.display = 'none';
  });

  // ===== STORAGE & STATE =====
  const SAVE_KEY = 'spiral_pulse_pwa_v1';
  const defaultSave = {
    coins: 0,
    skin: 'M',
    ownedSkins: ['M'],
    perks: { magnet: false, phasePlus: false, stabilizer: false },
    best: [0, 0, 0, 0],
    sound: true,
    selectedLevel: 0
  };
  let save;
  try {
    const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
    save = {
      ...defaultSave,
      ...raw,
      perks: { ...defaultSave.perks, ...(raw.perks || {}) },
      ownedSkins: Array.isArray(raw.ownedSkins) ? raw.ownedSkins : ['M'],
      best: Array.isArray(raw.best) && raw.best.length === 4 ? raw.best : [0, 0, 0, 0]
    };
  } catch (_) {
    save = JSON.parse(JSON.stringify(defaultSave));
  }
  function persist() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (_) {}
  }

  // ===== 4 VISUALLY & MECHANICALLY DISTINCT LEVELS (BALANCED VIRTUAL SPEEDS) =====
  // All coordinates & speeds are in normalized virtual arena units (Virtual Height = 520)
  // so gameplay feels identically smooth & fair on phones, tablets, and desktops!
  const LEVELS = [
    {
      id: 0,
      num: '01',
      name: 'CYAN PULSE',
      tag: 'SONAR · SPIRALS',
      bg: '#002228',
      bgMid: '#00171c',
      bgDeep: '#000c0f',
      accent: '#00f5ff',
      rim: '#c8ffff',
      sideShade: '#007480',
      gridCol: 'rgba(0, 245, 255, 0.08)',
      bpm: 122,
      baseSpeed: 120,
      baseSpin: 0.34,
      camProfile: 'dive',
      notes: [55, 65.41, 73.42, 82.41, 98, 82.41, 73.42, 65.41],
      lead: [220, 261.63, 329.63, 392, 440, 392, 329.63, 293.66]
    },
    {
      id: 1,
      num: '02',
      name: 'CRIMSON PHANTOM',
      tag: 'RADAR · MIRAGE',
      bg: '#240208',
      bgMid: '#160004',
      bgDeep: '#0b0002',
      accent: '#ff1e3c',
      rim: '#ffb8c4',
      sideShade: '#7d0a1c',
      gridCol: 'rgba(255, 30, 60, 0.09)',
      bpm: 128,
      baseSpeed: 128,
      baseSpin: -0.40,
      camProfile: 'bank',
      notes: [51.91, 51.91, 61.74, 69.3, 77.78, 69.3, 61.74, 58.27],
      lead: [207.65, 246.94, 311.13, 369.99, 415.3, 369.99, 311.13, 277.18]
    },
    {
      id: 2,
      num: '03',
      name: 'GOLD ECLIPSE',
      tag: 'CLOCKWORK · LASERS',
      bg: '#201900',
      bgMid: '#140f00',
      bgDeep: '#0a0700',
      accent: '#ffd400',
      rim: '#fff6be',
      sideShade: '#856900',
      gridCol: 'rgba(255, 212, 0, 0.08)',
      bpm: 132,
      baseSpeed: 134,
      baseSpin: 0.44,
      camProfile: 'iso',
      notes: [58.27, 58.27, 69.3, 77.78, 87.31, 77.78, 69.3, 65.41],
      lead: [233.08, 277.18, 349.23, 415.3, 466.16, 415.3, 349.23, 311.13]
    },
    {
      id: 3,
      num: '04',
      name: 'VIOLET DUALITY',
      tag: 'TWIN CLONE · 180°',
      bg: '#19052e',
      bgMid: '#10021f',
      bgDeep: '#070110',
      accent: '#ca4eff',
      rim: '#f0ccff',
      sideShade: '#621a8c',
      gridCol: 'rgba(202, 78, 255, 0.09)',
      bpm: 130,
      baseSpeed: 124,
      baseSpin: 0.38,
      camProfile: 'wave',
      notes: [49, 58.27, 65.41, 73.42, 87.31, 73.42, 65.41, 58.27],
      lead: [196, 233.08, 293.66, 349.23, 392, 349.23, 293.66, 261.63]
    }
  ];

  const SKINS = [
    { id: 'M', price: 0 },
    { id: 'A', price: 25 },
    { id: 'X', price: 50 }
  ];
  const PERKS = [
    { id: 'magnet', name: 'MAGNET', sub: 'PULLS COINS', price: 30 },
    { id: 'phasePlus', name: 'PHASE+', sub: '4.0S SHIELD', price: 45 },
    { id: 'stabilizer', name: 'STABILIZER', sub: 'MAX 1.55X SIZE', price: 60 }
  ];

  // ===== DOM & STAGE (STRICT LANDSCAPE + NORMALIZED VIRTUAL ARENA) =====
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  const timerBox = document.getElementById('timerBox');
  const hudTopLeft = document.getElementById('hudTopLeft');
  const coinHud = document.getElementById('coinHud');
  const eventBanner = document.getElementById('eventBanner');
  const menuOverlay = document.getElementById('menuOverlay');
  const shopModal = document.getElementById('shopModal');
  const overOverlay = document.getElementById('overOverlay');

  const VIRTUAL_H = 520;
  let W = 960, H = 540, DPR = 1, isRotated = false, arenaScale = 1;

  function resize() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    isRotated = vh > vw;
    if (isRotated) {
      W = vh;
      H = vw;
      stage.style.width = W + 'px';
      stage.style.height = H + 'px';
      stage.style.left = ((vw - W) / 2) + 'px';
      stage.style.top = ((vh - H) / 2) + 'px';
      stage.style.transform = 'rotate(90deg)';
    } else {
      W = vw;
      H = vh;
      stage.style.width = W + 'px';
      stage.style.height = H + 'px';
      stage.style.left = '0px';
      stage.style.top = '0px';
      stage.style.transform = 'none';
    }
    arenaScale = Math.max(0.55, Math.min(1.65, H / VIRTUAL_H));
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 80));
  resize();

  function clientToStageX(clientX, clientY) {
    return isRotated ? clientY : clientX;
  }

  // ===== AUDIO ENGINE =====
  let audioCtx = null;
  let masterGain = null;
  let beatAccum = 0;
  let stepIdx = 0;
  let beatPulse = 0;

  function ensureAudio() {
    if (!save.sound) return;
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.28;
      masterGain.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
  }

  function playKick(strong) {
    if (!audioCtx || !save.sound) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(strong ? 160 : 130, now);
    osc.frequency.exponentialRampToValueAtTime(36, now + 0.13);
    g.gain.setValueAtTime(strong ? 0.62 : 0.42, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(now);
    osc.stop(now + 0.17);
  }

  function playBass(freq, dur, hyper) {
    if (!audioCtx || !save.sound) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const filt = audioCtx.createBiquadFilter();
    const g = audioCtx.createGain();
    osc.type = hyper ? 'sawtooth' : 'triangle';
    osc.frequency.setValueAtTime(freq, now);
    filt.type = 'lowpass';
    filt.frequency.setValueAtTime(hyper ? 1500 : 600, now);
    filt.frequency.exponentialRampToValueAtTime(210, now + dur);
    g.gain.setValueAtTime(hyper ? 0.2 : 0.26, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(filt);
    filt.connect(g);
    g.connect(masterGain);
    osc.start(now);
    osc.stop(now + dur + 0.02);
  }

  function playLead(freq, dur) {
    if (!audioCtx || !save.sound) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(0.08, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(now);
    osc.stop(now + dur + 0.02);
  }

  function playHat(vol) {
    if (!audioCtx || !save.sound) return;
    const now = audioCtx.currentTime;
    const len = Math.floor(audioCtx.sampleRate * 0.032);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 6500;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.032);
    src.connect(hp);
    hp.connect(g);
    g.connect(masterGain);
    src.start(now);
  }

  function playSfx(type) {
    if (!audioCtx || !save.sound) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    if (type === 'coin') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.exponentialRampToValueAtTime(1480, now + 0.11);
      g.gain.setValueAtTime(0.25, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
    } else if (type === 'nearmiss') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(660, now);
      osc.frequency.exponentialRampToValueAtTime(1180, now + 0.09);
      g.gain.setValueAtTime(0.16, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    } else if (type === 'scrape') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(190 + Math.random() * 70, now);
      g.gain.setValueAtTime(0.05, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
    } else if (type === 'tick') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(980, now);
      g.gain.setValueAtTime(0.14, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
    } else if (type === 'laser') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(420, now);
      osc.frequency.exponentialRampToValueAtTime(95, now + 0.22);
      g.gain.setValueAtTime(0.22, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
    } else if (type === 'split') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(820, now + 0.25);
      g.gain.setValueAtTime(0.24, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
    } else if (type === 'shatter') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(240, now);
      osc.frequency.exponentialRampToValueAtTime(38, now + 0.36);
      g.gain.setValueAtTime(0.4, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
    } else {
      return;
    }
    osc.connect(g);
    g.connect(masterGain);
    osc.start(now);
    osc.stop(now + 0.4);
  }

  // ===== MATH HELPERS =====
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smoothstep = (t) => {
    const x = clamp(t, 0, 1);
    return x * x * (3 - 2 * x);
  };
  function normAng(a) {
    a = a % TAU;
    return a < 0 ? a + TAU : a;
  }
  function angDiff(a, b) {
    let d = normAng(a - b);
    if (d > Math.PI) d -= TAU;
    return d;
  }
  function isAngleInArc(ang, start, span) {
    if (span >= TAU - 0.001) return true;
    const d = normAng(ang - start);
    return d >= 0 && d <= span;
  }

  // ===== GAME STATE (ALL IN VIRTUAL ARENA UNITS) =====

  let player = {

  // ===== INPUT (HOLD L / R + MULTITOUCH + KEYBOARD) =====
  let keyL = false, keyR = false;
  const activeTouches = new Map();
  let mouseSide = null;

  function getInput() {
    let left = keyL || mouseSide === 'L';
    let right = keyR || mouseSide === 'R';
    for (const side of activeTouches.values()) {
      if (side === 'L') left = true;
      if (side === 'R') right = true;

  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keyL = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keyR = true;
    if ((e.code === 'Space' || e.code === 'Enter') && mode === 'over') startRun(curLvl.id);
    if (e.code === 'Escape' && mode === 'play') openMenu();
  });
  window.addEventListener('keyup', (e) => {

    if (e.code === 'ArrowRight' || e.code === 'KeyD') keyR = false;

  canvas.addEventListener('touchstart', (e) => {

      activeTouches.set(t.identifier, sx < W * 0.5 ? 'L' : 'R');

      activeTouches.set(t.identifier, sx < W * 0.5 ? 'L' : 'R');

  // ===== UI RENDERING =====

  function renderShop() {
    document.getElementById('shopCoins').textContent = `◈ ${save.coins}`;
    const sRow = document.getElementById('skinsRow');
    sRow.innerHTML = '';
    SKINS.forEach((s) => {
      const owned = save.ownedSkins.includes(s.id);
      const active = save.skin === s.id;
      const el = document.createElement('div');
      el.className = 'shopItem' + (owned ? ' owned' : '') + (active ? ' active' : '');
      el.innerHTML = `
        <div class="skinGlyph">${s.id}</div>
        <div class="priceTag">${active ? 'EQUIPPED' : owned ? 'EQUIP' : `◈ ${s.price}`}</div>
      `;
      el.onclick = () => {
        ensureAudio();
        if (owned) {
          save.skin = s.id;
          playSfx('coin');
        } else if (save.coins >= s.price) {
          save.coins -= s.price;
          save.ownedSkins.push(s.id);
          save.skin = s.id;
          playSfx('split');
        } else {
          playSfx('scrape');
        }
        persist();
        renderShop();
        renderMenu();
      };
      sRow.appendChild(el);
    });

    const pRow = document.getElementById('perksRow');
    pRow.innerHTML = '';
    PERKS.forEach((p) => {

        <div class="perkSub">${p.sub}</div>
        <div class="priceTag">${owned ? 'ACTIVE' : `◈ ${p.price}`}</div>

      el.onclick = () => {
