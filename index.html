<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>.Spiral Pulse</title>
  <meta name="description" content=".Spiral Pulse — 3D Radial Survival Arcade" />
  <meta name="theme-color" content="#001d20" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content=".Spiral Pulse" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png" />
  <style>
    :root {
      --bg: #00282b;
      --accent: #00ffff;
      --ink: #000000;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #001417;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      touch-action: none;
    }
    #stage {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      transform-origin: center center;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* Classic top-right timer box */
    #timerBox {
      position: absolute;
      top: 0;
      right: 0;
      background: #000;
      border-left: 3px solid var(--accent);
      border-bottom: 3px solid var(--accent);
      padding: 6px 14px 7px 16px;
      color: var(--accent);
      font-weight: 900;
      font-size: 26px;
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
      z-index: 20;
      pointer-events: none;
      display: none;
    }
    #hudTopLeft {
      position: absolute;
      top: 10px;
      left: 12px;
      display: none;
      align-items: center;
      gap: 8px;
      z-index: 20;
    }
    .pillBtn {
      background: rgba(0, 0, 0, 0.72);
      color: var(--accent);
      border: 2px solid var(--accent);
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      text-transform: uppercase;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .pillBtn:active { transform: scale(0.94); }
    #coinHud {
      background: rgba(0, 0, 0, 0.72);
      color: #ffd800;
      border: 2px solid #ffd800;
      padding: 5px 10px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.5px;
      pointer-events: none;
    }
    #eventBanner {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      padding: 5px 16px;
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid var(--accent);
      color: var(--accent);
      font-weight: 900;
      font-size: 13px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.35s ease;
      z-index: 25;
      white-space: nowrap;
    }
    #eventBanner.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }
    /* Menu Overlay */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 22px;
      background: radial-gradient(circle at 50% 50%, rgba(0, 18, 22, 0.48) 0%, rgba(0, 8, 12, 0.84) 100%);
      z-index: 30;
      transition: opacity 0.25s ease;
    }
    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .topBar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--accent);
      text-shadow: 0 0 16px rgba(0, 255, 255, 0.35);
    }
    .topRight {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .levelsGrid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 820px;
      margin: auto;
    }
    .lvlCard {
      background: rgba(0, 0, 0, 0.72);
      border: 2px solid rgba(255, 255, 255, 0.2);
      padding: 12px 12px 11px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
      position: relative;
    }
    .lvlCard.selected {
      transform: translateY(-3px);
      border-color: var(--c);
      box-shadow: 0 0 18px color-mix(in srgb, var(--c) 45%, transparent);
    }
    .lvlNum {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: var(--c);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .lvlName {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.8px;
      color: #fff;
      line-height: 1.15;
    }
    .lvlTag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: rgba(255, 255, 255, 0.62);
      text-transform: uppercase;
    }
    .lvlFoot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 11px;
      font-weight: 800;
      color: var(--c);
      font-variant-numeric: tabular-nums;
    }
    .medal {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
    }
    .medal.bronze { background: #cd7f32; box-shadow: 0 0 6px #cd7f32; }
    .medal.silver { background: #e2e8f0; box-shadow: 0 0 6px #e2e8f0; }
    .medal.gold { background: #ffd800; box-shadow: 0 0 8px #ffd800; }

    .bottomBar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .ctrlHints {
      display: flex;
      gap: 10px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.65);
    }
    .ctrlHints span {
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 4px 8px;
      background: rgba(0, 0, 0, 0.55);
    }
    #playBtn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 11px 38px;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 3px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 22px color-mix(in srgb, var(--accent) 50%, transparent);
      transition: transform 0.12s ease;
    }
    #playBtn:active { transform: scale(0.95); }

    /* Shop Modal */
    #shopModal {
      justify-content: center;
      align-items: center;
      background: rgba(0, 8, 12, 0.92);
      z-index: 40;
    }
    .shopPanel {
      width: 100%;
      max-width: 720px;
      background: #060d12;
      border: 2px solid var(--accent);
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .shopHead {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .shopTitle {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--accent);
    }
    .shopRow {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .shopLabel {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.55);
      margin-bottom: -6px;
    }
    .shopItem {
      background: rgba(255, 255, 255, 0.04);
      border: 2px solid rgba(255, 255, 255, 0.18);
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: #fff;
      transition: border-color 0.15s ease, transform 0.12s ease;
    }
    .shopItem:active { transform: scale(0.96); }
    .shopItem.owned { border-color: rgba(0, 255, 255, 0.45); }
    .shopItem.active {
      border-color: #ffd800;
      background: rgba(255, 216, 0, 0.12);
    }
    .skinGlyph {
      font-size: 26px;
      font-weight: 900;
      color: var(--accent);
      line-height: 1;
    }
    .perkName {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .perkSub {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.6);
      text-align: center;
    }
    .priceTag {
      font-size: 11px;
      font-weight: 900;
      color: #ffd800;
      letter-spacing: 0.8px;
    }

    /* Game Over Overlay */
    #overOverlay {
      justify-content: center;
      align-items: center;
      gap: 16px;
      background: rgba(0, 0, 0, 0.72);
      z-index: 35;
    }
    .overBox {
      background: rgba(0, 0, 0, 0.88);
      border: 2px solid var(--accent);
      padding: 20px 34px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      min-width: 310px;
    }
    .overTime {
      font-size: 44px;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .overMeta {
      display: flex;
      gap: 18px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: rgba(255, 255, 255, 0.78);
    }
    .overBtns {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }
    #retryBtn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px 28px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
    }
    #installBtn {
      display: none;
      border-color: #ffd800;
      color: #ffd800;
    }
    @media (max-height: 410px) {
      .overlay { padding: 10px 14px; }
      .brand { font-size: 19px; }
      .lvlCard { padding: 8px 9px; gap: 5px; }
      .lvlName { font-size: 13px; }
      #playBtn { padding: 8px 26px; font-size: 14px; }
      .shopPanel { padding: 10px 14px; gap: 8px; }
      .skinGlyph { font-size: 20px; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>

    <div id="timerBox">0:00</div>
    <div id="hudTopLeft">
      <button class="pillBtn" id="pauseBackBtn">MENU</button>
      <div id="coinHud">◈ 0</div>
    </div>
    <div id="eventBanner">3D HYPER-TUNNEL</div>

    <!-- MAIN MENU -->
    <div id="menuOverlay" class="overlay">
      <div class="topBar">
        <div class="brand">.SPIRAL PULSE</div>
        <div class="topRight">
          <div id="menuCoins" class="pillBtn" style="border-color:#ffd800;color:#ffd800;cursor:default;">◈ 0</div>
          <button id="installBtn" class="pillBtn">INSTALL</button>
          <button id="soundBtn" class="pillBtn">SFX: ON</button>
          <button id="shopOpenBtn" class="pillBtn">SHOP</button>
        </div>
      </div>

      <div class="levelsGrid" id="levelsGrid"></div>

      <div class="bottomBar">
        <div class="ctrlHints">
          <span>HOLD L / R: TURN</span>
          <span>HOLD L + R: PHASE</span>
        </div>
        <button id="playBtn">PLAY</button>
      </div>
    </div>

    <!-- SHOP MODAL -->
    <div id="shopModal" class="overlay hidden">
      <div class="shopPanel">
        <div class="shopHead">
          <div class="shopTitle">SHOP</div>
          <div style="display:flex;gap:8px;align-items:center;">
            <div id="shopCoins" class="pillBtn" style="border-color:#ffd800;color:#ffd800;cursor:default;">◈ 0</div>
            <button id="shopCloseBtn" class="pillBtn">CLOSE</button>
          </div>
        </div>

        <div class="shopLabel">SKINS</div>
        <div class="shopRow" id="skinsRow"></div>

        <div class="shopLabel">PERKS</div>
        <div class="shopRow" id="perksRow"></div>
      </div>
    </div>

    <!-- GAME OVER -->
    <div id="overOverlay" class="overlay hidden">
      <div class="overBox">
        <div id="overLevel" style="font-size:11px;font-weight:900;letter-spacing:2px;color:rgba(255,255,255,0.6);">01 · CYAN PULSE</div>
        <div class="overTime" id="overTime">0:00</div>
        <div class="overMeta">
          <span id="overBest">BEST 0:00</span>
          <span id="overRunCoins" style="color:#ffd800;">+0 ◈</span>
        </div>
        <div class="overBtns">
          <button id="retryBtn">RETRY</button>
          <button id="overMenuBtn" class="pillBtn">MENU</button>
        </div>
      </div>
    </div>
  </div>

<script>
(() => {
  'use strict';

  // ===== PWA REGISTRATION & INSTALL PROMPT =====
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
  let deferredInstallPrompt = null;
  const installBtn = document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    installBtn.style.display = 'inline-block';
  });
  installBtn.addEventListener('click', async () => {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    try { await deferredInstallPrompt.userChoice; } catch (_) {}
    deferredInstallPrompt = null;
    installBtn.style.display = 'none';
  });
  window.addEventListener('appinstalled', () => {
    installBtn.style.display = 'none';
  });

  // ===== STORAGE & STATE =====
  const SAVE_KEY = 'spiral_pulse_pwa_v1';
  const defaultSave = {
    coins: 0,
    skin: 'M',
    ownedSkins: ['M'],
    perks: { magnet: false, phasePlus: false, stabilizer: false },
    best: [0, 0, 0, 0],
    sound: true,
    selectedLevel: 0
  };
  let save;
  try {
    const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
    save = {
      ...defaultSave,
      ...raw,
      perks: { ...defaultSave.perks, ...(raw.perks || {}) },
      ownedSkins: Array.isArray(raw.ownedSkins) ? raw.ownedSkins : ['M'],
      best: Array.isArray(raw.best) && raw.best.length === 4 ? raw.best : [0, 0, 0, 0]
    };
  } catch (_) {
    save = JSON.parse(JSON.stringify(defaultSave));
  }
  function persist() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (_) {}
  }

  // ===== 4 UNIQUE LEVELS =====
  const LEVELS = [
    {
      id: 0,
      num: '01',
      name: 'CYAN PULSE',
      tag: 'SPIRALS · GATES',
      bg: '#00262a',
      bgDeep: '#001215',
      accent: '#00ffff',
      sideShade: '#008b94',
      bpm: 126,
      baseSpeed: 198,
      baseSpin: 0.42,
      camProfile: 'dive',
      notes: [55, 65.41, 73.42, 82.41, 98, 82.41, 73.42, 65.41],
      lead: [220, 261.63, 329.63, 392, 440, 392, 329.63, 293.66]
    },
    {
      id: 1,
      num: '02',
      name: 'CRIMSON PHANTOM',
      tag: 'MIRAGE · RADAR',
      bg: '#230005',
      bgDeep: '#110002',
      accent: '#ff1e32',
      sideShade: '#8c0c18',
      bpm: 132,
      baseSpeed: 212,
      baseSpin: -0.52,
      camProfile: 'bank',
      notes: [51.91, 51.91, 61.74, 69.3, 77.78, 69.3, 61.74, 58.27],
      lead: [207.65, 246.94, 311.13, 369.99, 415.3, 369.99, 311.13, 277.18]
    },
    {
      id: 2,
      num: '03',
      name: 'GOLD ECLIPSE',
      tag: 'GEARS · LASERS',
      bg: '#1c1900',
      bgDeep: '#0e0c00',
      accent: '#ffd800',
      sideShade: '#8f7500',
      bpm: 136,
      baseSpeed: 222,
      baseSpin: 0.56,
      camProfile: 'iso',
      notes: [58.27, 58.27, 69.3, 77.78, 87.31, 77.78, 69.3, 65.41],
      lead: [233.08, 277.18, 349.23, 415.3, 466.16, 415.3, 349.23, 311.13]
    },
    {
      id: 3,
      num: '04',
      name: 'VIOLET DUALITY',
      tag: 'DUAL CLONE · 180°',
      bg: '#160426',
      bgDeep: '#0a0214',
      accent: '#c84bff',
      sideShade: '#691f91',
      bpm: 134,
      baseSpeed: 208,
      baseSpin: 0.48,
      camProfile: 'wave',
      notes: [49, 58.27, 65.41, 73.42, 87.31, 73.42, 65.41, 58.27],
      lead: [196, 233.08, 293.66, 349.23, 392, 349.23, 293.66, 261.63]
    }
  ];

  const SKINS = [
    { id: 'M', price: 0 },
    { id: 'A', price: 25 },
    { id: 'X', price: 50 }
  ];
  const PERKS = [
    { id: 'magnet', name: 'MAGNET', sub: 'PULLS COINS', price: 30 },
    { id: 'phasePlus', name: 'PHASE+', sub: '4.0S SHIELD', price: 45 },
    { id: 'stabilizer', name: 'STABILIZER', sub: 'MAX 1.55X SIZE', price: 60 }
  ];

  // ===== DOM & STAGE (STRICT LANDSCAPE) =====
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  const timerBox = document.getElementById('timerBox');
  const hudTopLeft = document.getElementById('hudTopLeft');
  const coinHud = document.getElementById('coinHud');
  const eventBanner = document.getElementById('eventBanner');
  const menuOverlay = document.getElementById('menuOverlay');
  const shopModal = document.getElementById('shopModal');
  const overOverlay = document.getElementById('overOverlay');

  let W = 960, H = 540, DPR = 1, isRotated = false;
  function resize() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    isRotated = vh > vw;
    if (isRotated) {
      W = vh;
      H = vw;
      stage.style.width = W + 'px';
      stage.style.height = H + 'px';
      stage.style.left = ((vw - W) / 2) + 'px';
      stage.style.top = ((vh - H) / 2) + 'px';
      stage.style.transform = 'rotate(90deg)';
    } else {
      W = vw;
      H = vh;
      stage.style.width = W + 'px';
      stage.style.height = H + 'px';
      stage.style.left = '0px';
      stage.style.top = '0px';
      stage.style.transform = 'none';
    }
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 80));
  resize();

  function clientToStageX(clientX, clientY) {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    if (isRotated) {
      // Visual top of portrait screen becomes left side of rotated 90deg CW landscape stage
      return clientY;
    }
    return clientX;
  }

  // ===== AUDIO ENGINE (WEB AUDIO PROCEDURAL SYNTH) =====
  let audioCtx = null;
  let masterGain = null;
  let beatAccum = 0;
  let stepIdx = 0;
  let beatPulse = 0;

  function ensureAudio() {
    if (!save.sound) return;
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.28;
      masterGain.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
  }

  function playKick(strong) {
    if (!audioCtx || !save.sound) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(strong ? 165 : 135, now);
    osc.frequency.exponentialRampToValueAtTime(36, now + 0.13);
    g.gain.setValueAtTime(strong ? 0.65 : 0.45, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(now);
    osc.stop(now + 0.17);
  }

  function playBass(freq, dur, hyper) {
    if (!audioCtx || !save.sound) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const filt = audioCtx.createBiquadFilter();
    const g = audioCtx.createGain();
    osc.type = hyper ? 'sawtooth' : 'triangle';
    osc.frequency.setValueAtTime(freq, now);
    filt.type = 'lowpass';
    filt.frequency.setValueAtTime(hyper ? 1600 : 620, now);
    filt.frequency.exponentialRampToValueAtTime(220, now + dur);
    g.gain.setValueAtTime(hyper ? 0.22 : 0.28, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(filt);
    filt.connect(g);
    g.connect(masterGain);
    osc.start(now);
    osc.stop(now + dur + 0.02);
  }

  function playLead(freq, dur) {
    if (!audioCtx || !save.sound) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(0.09, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(now);
    osc.stop(now + dur + 0.02);
  }

  function playHat(vol) {
    if (!audioCtx || !save.sound) return;
    const now = audioCtx.currentTime;
    const len = Math.floor(audioCtx.sampleRate * 0.035);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 6500;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
    src.connect(hp);
    hp.connect(g);
    g.connect(masterGain);
    src.start(now);
  }

  function playSfx(type) {
    if (!audioCtx || !save.sound) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    if (type === 'coin') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.exponentialRampToValueAtTime(1480, now + 0.11);
      g.gain.setValueAtTime(0.26, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
    } else if (type === 'nearmiss') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(660, now);
      osc.frequency.exponentialRampToValueAtTime(1180, now + 0.09);
      g.gain.setValueAtTime(0.18, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    } else if (type === 'scrape') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(190 + Math.random() * 80, now);
      g.gain.setValueAtTime(0.06, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
    } else if (type === 'tick') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(1040, now);
      g.gain.setValueAtTime(0.14, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
    } else if (type === 'laser') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(420, now);
      osc.frequency.exponentialRampToValueAtTime(90, now + 0.22);
      g.gain.setValueAtTime(0.24, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
    } else if (type === 'split') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(820, now + 0.25);
      g.gain.setValueAtTime(0.24, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
    } else if (type === 'shatter') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(240, now);
      osc.frequency.exponentialRampToValueAtTime(38, now + 0.36);
      g.gain.setValueAtTime(0.42, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
    } else {
      return;
    }
    osc.connect(g);
    g.connect(masterGain);
    osc.start(now);
    osc.stop(now + 0.4);
  }

  function vibe(ms) {
    if (navigator.vibrate) {
      try { navigator.vibrate(ms); } catch (_) {}
    }
  }

  // ===== MATH HELPERS =====
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smoothstep = (t) => {
    const x = clamp(t, 0, 1);
    return x * x * (3 - 2 * x);
  };
  function normAng(a) {
    a = a % TAU;
    return a < 0 ? a + TAU : a;
  }
  function angDiff(a, b) {
    let d = normAng(a - b);
    if (d > Math.PI) d -= TAU;
    return d;
  }
  function isAngleInArc(ang, start, span) {
    if (span >= TAU - 0.001) return true;
    const d = normAng(ang - start);
    return d >= 0 && d <= span;
  }

  // ===== GAME STATE =====
  let mode = 'menu'; // 'menu' | 'play' | 'dying' | 'over'
  let curLvl = LEVELS[save.selectedLevel] || LEVELS[0];
  let runTime = 0;
  let runCoins = 0;
  let worldRot = 0;
  let worldSpin = 0;
  let shake = 0;
  let hitStop = 0;
  let deathTimer = 0;
  let bannerTimer = 0;
  let lastSpeedTier = 0;
  let scrapeCooldown = 0;

  // 3D Camera state
  let depth3D = 0;     // 0 = 2D, 1 = full 3D extrusion
  let hyperAmt = 0;    // 0..1 during 20-30s 3D Hyper-Tunnel
  let camTiltX = 0;
  let camTiltY = 0;
  let camZoom = 1;
  let camSway = 0;
  let warpStreaks = [];
  for (let i = 0; i < 42; i++) {
    warpStreaks.push({ ang: Math.random() * TAU, r: Math.random(), spd: 0.6 + Math.random() * 1.1 });
  }

  // Player state
  const CORE_R = 34;
  const ORBIT_R = 54;
  const PLAYER_BASE_H = 12;
  const PLAYER_BASE_W = 11;

  let player = {
    ang: -Math.PI / 2,
    angVel: 0,
    radialBounce: 0,
    radialVel: 0,
    scale: 1.0,       // grows 1.0 -> maxScale irreversibly during run
    phaseFuel: 3.0,
    phaseMax: 3.0,
    phasing: false,
    nearMissCd: 0,
    grace: 0
  };

  // Level 4 Dual Clone state
  let duality = {
    active: false,
    splitBlend: 0,    // 0..1 smooth separation animation
    respawnTimer: 5.0,
    aliveA: true,
    aliveB: false
  };

  let walls = [];
  let coins = [];
  let lasers = [];
  let sparks = [];
  let shards = [];
  let floatTexts = [];
  let spawnTimer = 0;
  let laserTimer = 3.6;
  let patternCount = 0;

  // ===== INPUT (HOLD L / R + MULTITOUCH + KEYBOARD) =====
  let keyL = false, keyR = false;
  const activeTouches = new Map();
  let mouseSide = null;

  function getInput() {
    let left = keyL || mouseSide === 'L';
    let right = keyR || mouseSide === 'R';
    for (const side of activeTouches.values()) {
      if (side === 'L') left = true;
      if (side === 'R') right = true;
    }
    return { left, right };
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keyL = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keyR = true;
    if ((e.code === 'Space' || e.code === 'Enter') && mode === 'over') startRun(curLvl.id);
    if (e.code === 'Escape' && mode === 'play') openMenu();
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keyL = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keyR = false;
  });

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    ensureAudio();
    for (const t of e.changedTouches) {
      const sx = clientToStageX(t.clientX, t.clientY);
      activeTouches.set(t.identifier, sx < W * 0.5 ? 'L' : 'R');
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      const sx = clientToStageX(t.clientX, t.clientY);
      activeTouches.set(t.identifier, sx < W * 0.5 ? 'L' : 'R');
    }
  }, { passive: false });

  function clearTouches(e) {
    for (const t of e.changedTouches) activeTouches.delete(t.identifier);
  }
  canvas.addEventListener('touchend', clearTouches);
  canvas.addEventListener('touchcancel', clearTouches);

  canvas.addEventListener('mousedown', (e) => {
    ensureAudio();
    const sx = clientToStageX(e.clientX, e.clientY);
    mouseSide = sx < W * 0.5 ? 'L' : 'R';
  });
  window.addEventListener('mouseup', () => { mouseSide = null; });

  // ===== UI RENDERING =====
  function formatTime(t) {
    const secs = Math.floor(t);
    const cs = Math.floor((t - secs) * 100);
    return `${secs}:${cs < 10 ? '0' : ''}${cs}`;
  }
  function getMedal(t) {
    if (t >= 45) return 'gold';
    if (t >= 30) return 'silver';
    if (t >= 15) return 'bronze';
    return '';
  }

  function applyTheme(lvl) {
    document.documentElement.style.setProperty('--bg', lvl.bg);
    document.documentElement.style.setProperty('--accent', lvl.accent);
    const metaTheme = document.querySelector('meta[name="theme-color"]');
    if (metaTheme) metaTheme.setAttribute('content', lvl.bgDeep);
  }

  function renderMenu() {
    document.getElementById('menuCoins').textContent = `◈ ${save.coins}`;
    document.getElementById('soundBtn').textContent = save.sound ? 'SFX: ON' : 'SFX: OFF';
    const grid = document.getElementById('levelsGrid');
    grid.innerHTML = '';
    LEVELS.forEach((lvl, idx) => {
      const best = save.best[idx] || 0;
      const med = getMedal(best);
      const card = document.createElement('div');
      card.className = 'lvlCard' + (idx === save.selectedLevel ? ' selected' : '');
      card.style.setProperty('--c', lvl.accent);
      card.innerHTML = `
        <div class="lvlNum"><span>${lvl.num}</span><span class="medal ${med}"></span></div>
        <div>
          <div class="lvlName">${lvl.name}</div>
          <div class="lvlTag">${lvl.tag}</div>
        </div>
        <div class="lvlFoot">
          <span>BEST</span>
          <span>${formatTime(best)}</span>
        </div>
      `;
      card.onclick = () => {
        ensureAudio();
        save.selectedLevel = idx;
        curLvl = lvl;
        applyTheme(lvl);
        persist();
        renderMenu();
      };
      grid.appendChild(card);
    });
  }

  function renderShop() {
    document.getElementById('shopCoins').textContent = `◈ ${save.coins}`;
    const sRow = document.getElementById('skinsRow');
    sRow.innerHTML = '';
    SKINS.forEach((s) => {
      const owned = save.ownedSkins.includes(s.id);
      const active = save.skin === s.id;
      const el = document.createElement('div');
      el.className = 'shopItem' + (owned ? ' owned' : '') + (active ? ' active' : '');
      el.innerHTML = `
        <div class="skinGlyph">${s.id}</div>
        <div class="priceTag">${active ? 'EQUIPPED' : owned ? 'EQUIP' : `◈ ${s.price}`}</div>
      `;
      el.onclick = () => {
        ensureAudio();
        if (owned) {
          save.skin = s.id;
          playSfx('coin');
        } else if (save.coins >= s.price) {
          save.coins -= s.price;
          save.ownedSkins.push(s.id);
          save.skin = s.id;
          playSfx('split');
        } else {
          playSfx('scrape');
        }
        persist();
        renderShop();
        renderMenu();
      };
      sRow.appendChild(el);
    });

    const pRow = document.getElementById('perksRow');
    pRow.innerHTML = '';
    PERKS.forEach((p) => {
      const owned = !!save.perks[p.id];
      const el = document.createElement('div');
      el.className = 'shopItem' + (owned ? ' active' : '');
      el.innerHTML = `
        <div class="perkName">${p.name}</div>
        <div class="perkSub">${p.sub}</div>
        <div class="priceTag">${owned ? 'ACTIVE' : `◈ ${p.price}`}</div>
      `;
      el.onclick = () => {
        ensureAudio();
        if (!owned && save.coins >= p.price) {
          save.coins -= p.price;
          save.perks[p.id] = true;
          playSfx('split');
          persist();
          renderShop();
          renderMenu();
        } else if (!owned) {
          playSfx('scrape');
        }
      };
      pRow.appendChild(el);
    });
  }

  function showBanner(text, dur = 1.9) {
    eventBanner.textContent = text;
    eventBanner.classList.add('show');
    bannerTimer = dur;
  }

  function openMenu() {
    mode = 'menu';
    activeTouches.clear();
    mouseSide = null;
    keyL = false;
    keyR = false;
    timerBox.style.display = 'none';
    hudTopLeft.style.display = 'none';
    overOverlay.classList.add('hidden');
    shopModal.classList.add('hidden');
    menuOverlay.classList.remove('hidden');
    eventBanner.classList.remove('show');
    renderMenu();
  }

  document.getElementById('playBtn').onclick = () => { ensureAudio(); startRun(save.selectedLevel); };
  document.getElementById('retryBtn').onclick = () => { ensureAudio(); startRun(curLvl.id); };
  document.getElementById('overMenuBtn').onclick = () => openMenu();
  document.getElementById('pauseBackBtn').onclick = () => openMenu();
  document.getElementById('shopOpenBtn').onclick = () => {
    ensureAudio();
    renderShop();
    shopModal.classList.remove('hidden');
  };
  document.getElementById('shopCloseBtn').onclick = () => shopModal.classList.add('hidden');
  document.getElementById('soundBtn').onclick = () => {
    save.sound = !save.sound;
    if (save.sound) ensureAudio();
    persist();
    renderMenu();
  };

  // ===== START RUN =====
  function startRun(lvlIdx) {
    curLvl = LEVELS[lvlIdx] || LEVELS[0];
    applyTheme(curLvl);
    mode = 'play';
    runTime = 0;
    runCoins = 0;
    worldRot = 0;
    worldSpin = curLvl.baseSpin;
    shake = 0;
    hitStop = 0;
    deathTimer = 0;
    lastSpeedTier = 0;
    depth3D = 0;
    hyperAmt = 0;
    camTiltX = 0;
    camTiltY = 0;
    camZoom = 1;
    camSway = 0;
    beatAccum = 0;
    stepIdx = 0;
    beatPulse = 0;

    player.ang = -Math.PI / 2;
    player.angVel = 0;
    player.radialBounce = 0;
    player.radialVel = 0;
    player.scale = 1.0;
    player.phaseMax = save.perks.phasePlus ? 4.0 : 3.0;
    player.phaseFuel = player.phaseMax;
    player.phasing = false;
    player.nearMissCd = 0;
    player.grace = 0.6;

    duality.active = false;
    duality.splitBlend = 0;
    duality.respawnTimer = 5.0;
    duality.aliveA = true;
    duality.aliveB = false;

    walls = [];
    coins = [];
    lasers = [];
    sparks = [];
    shards = [];
    floatTexts = [];
    spawnTimer = 0.25;
    laserTimer = 4.2;
    patternCount = 0;

    activeTouches.clear();
    mouseSide = null;
    menuOverlay.classList.add('hidden');
    shopModal.classList.add('hidden');
    overOverlay.classList.add('hidden');
    timerBox.style.display = 'block';
    hudTopLeft.style.display = 'flex';
    coinHud.textContent = `◈ ${save.coins}`;
    showBanner(`${curLvl.num} · ${curLvl.name}`, 1.6);
  }

  // ===== WALL / PATTERN GENERATOR =====
  function maxSpawnRadius() {
    return Math.hypot(W, H) * 0.64 + 60;
  }

  function addWall(opts) {
    walls.push({
      r: opts.r,
      thick: opts.thick || 26,
      start: normAng(opts.start),
      span: clamp(opts.span, 0.12, TAU - 0.12),
      rotSpd: opts.rotSpd || 0,
      kind: opts.kind || 'arc',        // 'arc' | 'gear' | 'phantom' | 'split' | 'breathe'
      baseStart: normAng(opts.start),
      baseSpan: clamp(opts.span, 0.12, TAU - 0.12),
      phase: opts.phase || Math.random() * TAU,
      phantomTriggerR: opts.phantomTriggerR || 195,
      phantomAlpha: 1,
      vanished: false,
      hitFlash: 0,
      vibeOff: 0,
      nearAwarded: false,
      height3D: opts.height3D || 32
    });
  }

  function addCoin(r, ang) {
    coins.push({ r, ang: normAng(ang), taken: false, pulse: Math.random() * TAU });
  }

  function spawnPattern() {
    const R0 = maxSpawnRadius();
    const t = runTime;
    const easyFactor = clamp(1 - t / 32, 0, 1); // Generous openings at start
    const baseGap = lerp(0.95, 1.38, easyFactor);
    const baseAng = Math.random() * TAU;
    patternCount++;

    // 3D HYPER-TUNNEL (20.0 - 30.0s): Wide rhythmic warp corridors + bonus coins
    if (t >= 19.2 && t <= 29.6) {
      const sym = (curLvl.id === 3 && duality.active);
      if (sym) {
        const gap = 0.92;
        const arcSpan = Math.PI - gap;
        for (let k = 0; k < 2; k++) {
          const stepAng = baseAng + k * 0.42;
          const r = R0 + k * 105;
          addWall({ r, thick: 28, start: stepAng, span: arcSpan, height3D: 54 });
          addWall({ r, thick: 28, start: stepAng + Math.PI, span: arcSpan, height3D: 54 });
          if (k === 0) {
            addCoin(r + 14, stepAng + arcSpan + gap * 0.5);
            addCoin(r + 14, stepAng + Math.PI + arcSpan + gap * 0.5);
          }
        }
        return 0.78;
      } else {
        const gap = 1.28;
        const step = (Math.random() < 0.5 ? 1 : -1) * 0.52;
        for (let k = 0; k < 3; k++) {
          const a = baseAng + k * step;
          const r = R0 + k * 96;
          addWall({ r, thick: 26, start: a, span: TAU - gap, height3D: 56 });
          if (k === 1) addCoin(r + 13, a + TAU - gap * 0.5);
        }
        return 0.96;
      }
    }

    // LEVEL 4: VIOLET DUALITY (180° Centrally-Symmetric Fair Patterns)
    if (curLvl.id === 3) {
      const dual = duality.active || t > 4.2;
      if (dual) {
        const pick = patternCount % 4;
        if (pick === 0) {
          // Twin Breathing Gates (180° symmetric)
          const gap = lerp(0.84, 1.08, easyFactor);
          const span = Math.PI - gap;
          addWall({ r: R0, thick: 28, start: baseAng, span, kind: 'breathe', phase: 0, height3D: 38 });
          addWall({ r: R0, thick: 28, start: baseAng + Math.PI, span, kind: 'breathe', phase: 0, height3D: 38 });
          if (Math.random() < 0.55) {
            addCoin(R0 + 14, baseAng + span + gap * 0.5);
            addCoin(R0 + 14, baseAng + Math.PI + span + gap * 0.5);
          }
          return 0.95;
        } else if (pick === 1) {
          // Twin Stepped Spiral (180° symmetric)
          const dir = Math.random() < 0.5 ? 1 : -1;
          const gap = lerp(0.9, 1.12, easyFactor);
          const span = Math.PI - gap;
          for (let k = 0; k < 3; k++) {
            const r = R0 + k * 92;
            const a = baseAng + k * dir * 0.52;
            addWall({ r, thick: 24, start: a, span, height3D: 34 });
            addWall({ r, thick: 24, start: a + Math.PI, span, height3D: 34 });
          }
          addCoin(R0 + 92 + 12, baseAng + dir * 0.52 + span + gap * 0.5);
          return 1.38;
        } else if (pick === 2) {
          // Symmetric 4-way clover (still 180° symmetric!)
          const span = Math.PI * 0.5 - lerp(0.46, 0.58, easyFactor);
          for (let k = 0; k < 4; k++) {
            addWall({ r: R0, thick: 30, start: baseAng + k * Math.PI * 0.5, span, rotSpd: 0.32, height3D: 36 });
          }
          return 0.88;
        } else {
          // Twin Thick Anvils (180° symmetric)
          const gap = lerp(0.95, 1.15, easyFactor);
          const span = Math.PI - gap;
          addWall({ r: R0, thick: 46, start: baseAng, span: span * 0.55, height3D: 44 });
          addWall({ r: R0 + 10, thick: 24, start: baseAng + span * 0.55, span: span * 0.45, height3D: 30 });
          addWall({ r: R0, thick: 46, start: baseAng + Math.PI, span: span * 0.55, height3D: 44 });
          addWall({ r: R0 + 10, thick: 24, start: baseAng + Math.PI + span * 0.55, span: span * 0.45, height3D: 30 });
          return 1.05;
        }
      }
    }

    // LEVEL 1: CYAN PULSE (Classic Stepped Snails, Cloverleaf, Stepped-Thickness Arcs)
    if (curLvl.id === 0) {
      const pick = patternCount % 4;
      if (pick === 0) {
        // Stepped Snail Spiral (authentic screenshot 5:14 & 4:24)
        const dir = Math.random() < 0.5 ? 1 : -1;
        const steps = 4;
        const segSpan = (TAU - baseGap) / steps;
        for (let k = 0; k < steps; k++) {
          const a = dir > 0 ? baseAng + k * segSpan : baseAng - (k + 1) * segSpan;
          addWall({ r: R0 + k * 24, thick: 26 + (k % 2) * 8, start: a, span: segSpan + 0.03, height3D: 32 + k * 4 });
        }
        if (Math.random() < 0.55) addCoin(R0 + 36, baseAng - dir * baseGap * 0.5);
        return 1.08;
      } else if (pick === 1) {
        // Cloverleaf 3-way gate (authentic screenshot 3:90)
        const span = TAU / 3 - lerp(0.54, 0.72, easyFactor);
        for (let k = 0; k < 3; k++) {
          addWall({ r: R0, thick: 28, start: baseAng + k * (TAU / 3), span, height3D: 34 });
        }
        addWall({ r: R0 + 92, thick: 24, start: baseAng + 0.4, span: TAU - baseGap * 1.05, height3D: 30 });
        if (Math.random() < 0.5) addCoin(R0 + 104, baseAng + 0.4 + TAU - baseGap * 0.52);
        return 1.25;
      } else if (pick === 2) {
        // Stepped-thickness Anvil Ring (authentic screenshot 3:78)
        const total = TAU - baseGap;
        addWall({ r: R0, thick: 48, start: baseAng, span: total * 0.48, height3D: 44 });
        addWall({ r: R0 + 12, thick: 24, start: baseAng + total * 0.48, span: total * 0.52, height3D: 28 });
        return 0.96;
      } else {
        // Alternating Dual Arcs
        for (let k = 0; k < 2; k++) {
          addWall({ r: R0 + k * 88, thick: 25, start: baseAng + k * Math.PI, span: TAU - baseGap * 1.1, height3D: 30 });
        }
        return 1.18;
      }
    }

    // LEVEL 2: CRIMSON PHANTOM (Radar Wedges, Splitting Gates, Phantom Vanishing Walls)
    if (curLvl.id === 1) {
      const pick = patternCount % 4;
      if (pick === 0) {
        // Massive Radar Wedges (authentic screenshot 3:83)
        const wedgeSpan = 1.15;
        addWall({ r: R0, thick: 115, start: baseAng, span: wedgeSpan, height3D: 48 });
        addWall({ r: R0, thick: 115, start: baseAng + Math.PI, span: wedgeSpan, height3D: 48 });
        addWall({ r: R0 + 35, thick: 24, start: baseAng + wedgeSpan + 0.35, span: Math.PI - wedgeSpan - 0.7, kind: 'phantom', phantomTriggerR: 205, height3D: 28 });
        if (Math.random() < 0.6) addCoin(R0 + 48, baseAng + wedgeSpan + (Math.PI - wedgeSpan) * 0.5);
        return 1.25;
      } else if (pick === 1) {
        // Phantom Mirage Ring (looks almost closed, 1 glowing mirage segment vanishes!)
        const mirageSpan = lerp(1.15, 1.45, easyFactor);
        addWall({ r: R0, thick: 28, start: baseAng, span: TAU - mirageSpan, height3D: 34 });
        addWall({ r: R0, thick: 28, start: baseAng + TAU - mirageSpan, span: mirageSpan - 0.04, kind: 'phantom', phantomTriggerR: 225, height3D: 34 });
        addCoin(R0 + 14, baseAng + TAU - mirageSpan * 0.5);
        return 0.98;
      } else if (pick === 2) {
        // Dynamic Splitting/Rejoining Arcs
        const span = Math.PI - lerp(0.68, 0.88, easyFactor);
        addWall({ r: R0, thick: 26, start: baseAng, span, kind: 'split', phase: 0, height3D: 34 });
        addWall({ r: R0, thick: 26, start: baseAng + Math.PI, span, kind: 'split', phase: Math.PI, height3D: 34 });
        return 0.95;
      } else {
        // Red Stepped Snail
        const steps = 4;
        const seg = (TAU - baseGap) / steps;
        for (let k = 0; k < steps; k++) {
          addWall({ r: R0 + k * 26, thick: 30, start: baseAng + k * seg, span: seg + 0.02, height3D: 38 });
        }
        return 1.05;
      }
    }

    // LEVEL 3: GOLD ECLIPSE (Angular Faceted Gears + Rotating Sectors + Core Lasers)
    const pick = patternCount % 3;
    if (pick === 0) {
      // Rotating Gear Ring
      const gap = lerp(1.05, 1.38, easyFactor);
      const rot = (Math.random() < 0.5 ? 1 : -1) * 0.42;
      addWall({ r: R0, thick: 30, start: baseAng, span: TAU - gap, kind: 'gear', rotSpd: rot, height3D: 40 });
      if (Math.random() < 0.55) addCoin(R0 + 15, baseAng + TAU - gap * 0.5);
      return 0.96;
    } else if (pick === 1) {
      // Double Opposing Gear Halves
      const span = Math.PI - lerp(0.75, 0.96, easyFactor);
      addWall({ r: R0, thick: 28, start: baseAng, span, kind: 'gear', rotSpd: 0.35, height3D: 38 });
      addWall({ r: R0, thick: 28, start: baseAng + Math.PI, span, kind: 'gear', rotSpd: 0.35, height3D: 38 });
      addWall({ r: R0 + 96, thick: 26, start: baseAng + 0.9, span: TAU - baseGap * 1.1, kind: 'gear', rotSpd: -0.28, height3D: 34 });
      return 1.24;
    } else {
      // Triple Saw Blades
      const span = TAU / 3 - lerp(0.58, 0.78, easyFactor);
      for (let k = 0; k < 3; k++) {
        addWall({ r: R0, thick: 32, start: baseAng + k * (TAU / 3), span, kind: 'gear', rotSpd: -0.3, height3D: 42 });
      }
      if (Math.random() < 0.5) addCoin(R0 + 16, baseAng + span + 0.32);
      return 0.98;
    }
  }

  // ===== PARTICLES & SHATTER PHYSICS =====
  function emitSparks(x, y, nx, ny, count, color, speedMul = 1) {
    for (let i = 0; i < count; i++) {
      const spread = (Math.random() - 0.5) * 1.9;
      const baseA = Math.atan2(ny, nx) + spread;
      const spd = (90 + Math.random() * 190) * speedMul;
      sparks.push({
        x, y,
        vx: Math.cos(baseA) * spd,
        vy: Math.sin(baseA) * spd,
        life: 0.25 + Math.random() * 0.28,
        maxLife: 0.53,
        size: 1.8 + Math.random() * 2.5,
        color
      });
    }
  }

  function shatterAt(ang, scale, color) {
    const r = ORBIT_R + player.radialBounce;
    const ox = Math.cos(ang) * r;
    const oy = Math.sin(ang) * r;
    emitSparks(ox, oy, Math.cos(ang), Math.sin(ang), 24, '#ffffff', 1.4);
    for (let i = 0; i < 18; i++) {
      const a = (i / 18) * TAU + (Math.random() - 0.5) * 0.4;
      const spd = 120 + Math.random() * 260;
      const sz = (3.5 + Math.random() * 5.5) * Math.sqrt(scale);
      shards.push({
        x: ox + (Math.random() - 0.5) * 10,
        y: oy + (Math.random() - 0.5) * 10,
        vx: Math.cos(a) * spd,
        vy: Math.sin(a) * spd,
        rot: Math.random() * TAU,
        vrot: (Math.random() - 0.5) * 16,
        sz,
        life: 1.05 + Math.random() * 0.5,
        maxLife: 1.55,
        color: i % 3 === 0 ? '#ffffff' : color
      });
    }
  }

  function addFloatText(x, y, text, color) {
    floatTexts.push({ x, y, text, color, life: 0.85, maxLife: 0.85 });
  }

  function triggerDeath(hitAng) {
    playSfx('shatter');
    vibe([35, 30, 55]);
    hitStop = 0.08;
    shake = 14;
    shatterAt(hitAng, player.scale, curLvl.accent);
    if (duality.active && duality.aliveB && duality.aliveA) {
      shatterAt(normAng(hitAng + Math.PI), player.scale, '#00f0ff');
    }
    mode = 'dying';
    deathTimer = 0.92;
    if (runTime > (save.best[curLvl.id] || 0)) {
      save.best[curLvl.id] = runTime;
    }
    persist();
  }

  // ===== COLLISION CHECK FOR ONE CLONE (HONEST SIDE SLIDE VS FRONTAL HIT) =====
  function processCloneCollisions(cloneAng, isCloneB, dt, wallSpd) {
    const pR = ORBIT_R + player.radialBounce;
    const halfW = (PLAYER_BASE_W * 0.5 * player.scale) / pR; // angular half-width
    const noseR = pR + PLAYER_BASE_H * 0.52 * player.scale;
    const tailR = pR - PLAYER_BASE_H * 0.35 * player.scale;
    let pushedAng = cloneAng;
    let died = false;

    for (let i = 0; i < walls.length; i++) {
      const w = walls[i];
      if (w.vanished) continue;

      const innerR = w.r;
      const outerR = w.r + w.thick;
      const prevInnerR = innerR + wallSpd * dt;

      // Near Miss detection when wall passes cleanly just past player's radial band
      if (!w.nearAwarded && !player.phasing && outerR < pR && outerR > pR - wallSpd * dt - 8) {
        const dStart = Math.abs(angDiff(pushedAng, w.start));
        const dEnd = Math.abs(angDiff(pushedAng, w.start + w.span));
        const nearThresh = halfW + 0.16;
        if ((dStart < nearThresh || dEnd < nearThresh) && !isAngleInArc(pushedAng, w.start, w.span)) {
          w.nearAwarded = true;
          if (player.nearMissCd <= 0) {
            player.nearMissCd = 0.45;
            save.coins += 1;
            runCoins += 1;
            coinHud.textContent = `◈ ${save.coins}`;
            playSfx('nearmiss');
            const mx = Math.cos(pushedAng) * pR;
            const my = Math.sin(pushedAng) * pR;
            emitSparks(mx, my, Math.cos(pushedAng), Math.sin(pushedAng), 8, '#ffd800', 0.8);
            addFloatText(mx, my - 12, '+1 ◈', '#ffd800');
          }
        }
      }

      // Check radial overlap with player
      if (innerR > noseR || outerR < tailR) continue;

      // Check angular overlap with player's frontal core + side wings
      const inCore = isAngleInArc(pushedAng, w.start, w.span);
      const inLeft = isAngleInArc(pushedAng - halfW, w.start, w.span);
      const inRight = isAngleInArc(pushedAng + halfW, w.start, w.span);

      if (!inCore && !inLeft && !inRight) continue;

      if (player.phasing || player.grace > 0) continue;

      // Determine whether this is a FRONTAL impact or a SAFE SIDE contact:
      // If wall's inner edge just arrived at/above player's nose AND player's center is inside the wall -> FRONTAL DEATH.
      // If wall was already deep around player's radial band -> SIDE SLIDE!
      const dToStart = angDiff(pushedAng, w.start);
      const dToEnd = angDiff(pushedAng, normAng(w.start + w.span));
      const distStart = Math.abs(dToStart);
      const distEnd = Math.abs(dToEnd);
      const sideEdgeMargin = halfW + 0.22;

      const isAlreadyPastNose = innerR < pR - 2;
      const touchingSideEdge = !inCore || distStart < sideEdgeMargin || distEnd < sideEdgeMargin;

      if (isAlreadyPastNose && touchingSideEdge) {
        // SAFE SIDE SLIDE with elastic micro-bounce, wall vibration, and sparks!
        if (distStart <= distEnd) {
          pushedAng = normAng(w.start - halfW - 0.012);
          player.angVel = Math.min(player.angVel, -0.8);
        } else {
          pushedAng = normAng(w.start + w.span + halfW + 0.012);
          player.angVel = Math.max(player.angVel, 0.8);
        }
        player.radialVel -= 38;
        w.hitFlash = 1.0;
        w.vibeOff = (Math.random() < 0.5 ? 1 : -1) * 3.8;
        const sx = Math.cos(pushedAng) * pR;
        const sy = Math.sin(pushedAng) * pR;
        emitSparks(sx, sy, -Math.sin(pushedAng) * (distStart <= distEnd ? 1 : -1), Math.cos(pushedAng) * (distStart <= distEnd ? 1 : -1), 3, '#ffffff', 0.75);
        if (scrapeCooldown <= 0) {
          playSfx('scrape');
          vibe(8);
          scrapeCooldown = 0.08;
        }
      } else if (prevInnerR >= noseR - 14 || inCore) {
        died = true;
        break;
      }
    }

    // Check active lasers (Level 3)
    if (!died && !player.phasing && player.grace <= 0) {
      for (const lz of lasers) {
        if (lz.state === 'fire') {
          if (Math.abs(angDiff(pushedAng, lz.ang)) < lz.halfWidth + halfW * 0.6) {
            died = true;
            break;
          }
        }
      }
    }

    return { ang: pushedAng, died };
  }

  // ===== MAIN UPDATE LOOP =====
  function update(dt) {
    if (bannerTimer > 0) {
      bannerTimer -= dt;
      if (bannerTimer <= 0) eventBanner.classList.remove('show');
    }

    // Idle menu background animation
    if (mode === 'menu') {
      worldRot += 0.35 * dt;
      depth3D = lerp(depth3D, 0.35, dt * 2);
      camTiltX = Math.sin(performance.now() * 0.0007) * 0.28;
      camTiltY = Math.cos(performance.now() * 0.0005) * 0.16;
      return;
    }

    // Hit-stop freeze frame on impact
    if (hitStop > 0) {
      hitStop -= dt;
      return;
    }

    // Update particles & ricocheting shards (both during play & dying!)
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.vx *= Math.pow(0.18, dt);
      s.vy *= Math.pow(0.18, dt);
      // Ricochet sparks off central core
      const dist = Math.hypot(s.x, s.y);
      if (dist < CORE_R + 2 && dist > 0.1) {
        const nx = s.x / dist, ny = s.y / dist;
        const dot = s.vx * nx + s.vy * ny;
        if (dot < 0) {
          s.vx -= 1.8 * dot * nx;
          s.vy -= 1.8 * dot * ny;
        }
        s.x = nx * (CORE_R + 3);
        s.y = ny * (CORE_R + 3);
      }
      s.life -= dt;
      if (s.life <= 0) sparks.splice(i, 1);
    }

    for (let i = shards.length - 1; i >= 0; i--) {
      const sh = shards[i];
      sh.x += sh.vx * dt;
      sh.y += sh.vy * dt;
      sh.rot += sh.vrot * dt;
      sh.vx *= Math.pow(0.32, dt);
      sh.vy *= Math.pow(0.32, dt);

      const dist = Math.hypot(sh.x, sh.y);
      // Bounce off central core
      if (dist < CORE_R + sh.sz * 0.6 && dist > 0.1) {
        const nx = sh.x / dist, ny = sh.y / dist;
        const dot = sh.vx * nx + sh.vy * ny;
        if (dot < 0) {
          sh.vx -= 1.75 * dot * nx;
          sh.vy -= 1.75 * dot * ny;
          sh.vrot = -sh.vrot * 0.85;
          emitSparks(sh.x, sh.y, nx, ny, 2, '#ffffff', 0.45);
        }
        sh.x = nx * (CORE_R + sh.sz * 0.65);
        sh.y = ny * (CORE_R + sh.sz * 0.65);
      }
      // Bounce off nearby walls
      const shAng = normAng(Math.atan2(sh.y, sh.x));
      for (const w of walls) {
        if (w.vanished) continue;
        if (dist >= w.r - sh.sz * 0.5 && dist <= w.r + w.thick + sh.sz * 0.5 && isAngleInArc(shAng, w.start, w.span)) {
          const nx = sh.x / (dist || 1), ny = sh.y / (dist || 1);
          const dot = sh.vx * nx + sh.vy * ny;
          if (dist < w.r + w.thick * 0.5 && dot > 0) {
            sh.vx -= 1.7 * dot * nx;
            sh.vy -= 1.7 * dot * ny;
          } else if (dist >= w.r + w.thick * 0.5 && dot < 0) {
            sh.vx -= 1.7 * dot * nx;
            sh.vy -= 1.7 * dot * ny;
          }
          break;
        }
      }

      sh.life -= dt;
      if (sh.life <= 0) shards.splice(i, 1);
    }

    for (let i = floatTexts.length - 1; i >= 0; i--) {
      floatTexts[i].y -= 28 * dt;
      floatTexts[i].life -= dt;
      if (floatTexts[i].life <= 0) floatTexts.splice(i, 1);
    }

    shake = Math.max(0, shake - 32 * dt);

    if (mode === 'dying') {
      deathTimer -= dt;
      worldRot += worldSpin * 0.25 * dt;
      if (deathTimer <= 0) {
        mode = 'over';
        document.getElementById('overLevel').textContent = `${curLvl.num} · ${curLvl.name}`;
        document.getElementById('overTime').textContent = formatTime(runTime);
        document.getElementById('overBest').textContent = `BEST ${formatTime(save.best[curLvl.id] || 0)}`;
        document.getElementById('overRunCoins').textContent = `+${runCoins} ◈`;
        overOverlay.classList.remove('hidden');
      }
      return;
    }
    if (mode !== 'play') return;

    // ===== ACTIVE GAMEPLAY UPDATE =====
    runTime += dt;
    timerBox.textContent = formatTime(runTime);
    if (player.grace > 0) player.grace -= dt;
    if (player.nearMissCd > 0) player.nearMissCd -= dt;
    if (scrapeCooldown > 0) scrapeCooldown -= dt;

    // Speed tiers every 10 seconds (+7% per 10s, capped smoothly)
    const speedTier = Math.floor(runTime / 10);
    if (speedTier > lastSpeedTier) {
      lastSpeedTier = speedTier;
      if (speedTier === 2) {
        showBanner('3D HYPER-TUNNEL', 2.2);
        vibe([25, 30, 45]);
      } else if (speedTier === 3) {
        showBanner('OVERDRIVE', 1.8);
        vibe(30);
      } else if (speedTier === 1) {
        showBanner('3D PHASE · SPEED UP', 1.6);
        vibe(20);
      } else {
        showBanner(`SPEED +${speedTier * 7}%`, 1.4);
      }
    }

    // 3D Phase & 3D HYPER-TUNNEL envelopes (smooth ease, zero snapping)
    let targetHyper = 0;
    if (runTime >= 20.0 && runTime <= 30.0) {
      const fadeIn = smoothstep((runTime - 20.0) / 1.4);
      const fadeOut = smoothstep((30.0 - runTime) / 1.4);
      targetHyper = Math.min(fadeIn, fadeOut);
    }
    hyperAmt = lerp(hyperAmt, targetHyper, 1 - Math.exp(-5 * dt));

    let target3D = 0;
    if (runTime >= 10.0 && runTime <= 18.6) {
      const a = smoothstep((runTime - 10.0) / 1.6);
      const b = smoothstep((18.6 - runTime) / 1.6);
      target3D = Math.min(a, b) * 0.85;
    } else if (runTime > 19.6 && runTime < 30.4) {
      target3D = Math.max(target3D, hyperAmt);
    } else if (runTime >= 32.0) {
      const cyc = (runTime - 32.0) % 18.0;
      if (cyc < 11.0) {
        target3D = Math.min(smoothstep(cyc / 1.6), smoothstep((11.0 - cyc) / 1.6)) * 0.9;
      }
    }
    depth3D = lerp(depth3D, target3D, 1 - Math.exp(-4 * dt));

    // Speed calculation
    const speedMul = Math.min(1.62, 1 + speedTier * 0.07) * (1 + hyperAmt * 0.24);
    const wallSpd = curLvl.baseSpeed * speedMul;

    // Procedural Beat & Music Sequencer
    const effBpm = curLvl.bpm * (1 + Math.min(0.16, speedTier * 0.025) + hyperAmt * 0.06);
    const stepDur = 60 / effBpm / 2; // 8th notes
    beatAccum += dt;
    while (beatAccum >= stepDur) {
      beatAccum -= stepDur;
      const idx = stepIdx % 8;
      if (idx % 2 === 0) {
        playKick(hyperAmt > 0.3 || idx === 0);
        beatPulse = 1.0;
      }
      playBass(curLvl.notes[idx], stepDur * 0.9, hyperAmt > 0.25);
      if (hyperAmt > 0.25 || stepIdx % 4 === 2) {
        playHat(hyperAmt > 0.25 ? 0.14 : 0.07);
      }
      if (hyperAmt > 0.35 || runTime >= 30) {
        playLead(curLvl.lead[idx], stepDur * 0.72);
      }
      stepIdx++;
    }
    beatPulse = Math.max(0, beatPulse - dt * 4.2);

    // Smooth Beat Camera & 3D Profile
    let tX = 0, tY = 0;
    if (curLvl.camProfile === 'dive') {
      tX = depth3D * (0.48 + hyperAmt * 0.16);
      tY = Math.sin(runTime * 0.9) * 0.22 * depth3D;
    } else if (curLvl.camProfile === 'bank') {
      tX = depth3D * 0.42;
      tY = Math.sin(runTime * 1.25) * 0.42 * depth3D;
    } else if (curLvl.camProfile === 'iso') {
      tX = depth3D * 0.56;
      tY = Math.cos(runTime * 0.85) * 0.34 * depth3D;
    } else {
      tX = (0.36 + Math.sin(runTime * 1.1) * 0.18) * depth3D;
      tY = Math.cos(runTime * 0.95) * 0.36 * depth3D;
    }
    camTiltX = lerp(camTiltX, tX, 1 - Math.exp(-4.5 * dt));
    camTiltY = lerp(camTiltY, tY, 1 - Math.exp(-4.5 * dt));
    const targetZoom = 1 + beatPulse * 0.038 + hyperAmt * 0.08;
    camZoom = lerp(camZoom, targetZoom, 1 - Math.exp(-10 * dt));
    camSway = lerp(camSway, Math.sin(runTime * 2.1) * 0.025 * (1 + beatPulse * 0.8), 1 - Math.exp(-6 * dt));

    // World Rotation (smooth harmonic wave on Level 4, smooth ramp on 1-3)
    if (curLvl.id === 3) {
      const targetSpin = Math.sin(runTime * 0.42) * 0.72 * (1 + speedTier * 0.05);
      worldSpin = lerp(worldSpin, targetSpin, 1 - Math.exp(-2.5 * dt));
    } else {
      const dirFlip = (curLvl.id === 1 && Math.floor(runTime / 14) % 2 === 1) ? -1 : 1;
      const targetSpin = curLvl.baseSpin * dirFlip * (1 + speedTier * 0.06);
      worldSpin = lerp(worldSpin, targetSpin, 1 - Math.exp(-2.2 * dt));
    }
    worldRot += worldSpin * dt;

    // Level 4 Duality Split Management
    if (curLvl.id === 3) {
      if (!duality.active) {
        duality.respawnTimer -= dt;
        if (duality.respawnTimer <= 0) {
          duality.active = true;
          duality.aliveA = true;
          duality.aliveB = true;
          duality.splitBlend = 0;
          player.grace = 0.75;
          playSfx('split');
          vibe([20, 25, 25]);
          showBanner('DUAL CLONE ACTIVE', 1.6);
        }
      } else {
        duality.splitBlend = lerp(duality.splitBlend, 1, 1 - Math.exp(-5.5 * dt));
      }
    }

    // ===== PLAYER INPUT, PHASE SHIELD & IRREVERSIBLE GROWTH =====
    const inp = getInput();
    const bothHeld = inp.left && inp.right;

    if (bothHeld && player.phaseFuel > 0) {
      player.phasing = true;
      player.phaseFuel = Math.max(0, player.phaseFuel - dt);
      const maxScale = save.perks.stabilizer ? 1.55 : 2.0;
      const usedFrac = 1 - (player.phaseFuel / player.phaseMax);
      const grown = 1.0 + usedFrac * (maxScale - 1.0);
      // IRREVERSIBLE growth during the run — never shrinks until death!
      if (grown > player.scale) player.scale = grown;
    } else {
      player.phasing = false;
    }

    // Hold L / R to turn; stands completely still when neither is held
    const turnSpeed = 5.45;
    let targetAngVel = 0;
    if (!bothHeld) {
      if (inp.right) targetAngVel = turnSpeed;
      else if (inp.left) targetAngVel = -turnSpeed;
    }
    player.angVel = lerp(player.angVel, targetAngVel, 1 - Math.exp(-24 * dt));
    if (Math.abs(player.angVel) < 0.02 && targetAngVel === 0) player.angVel = 0;
    player.ang = normAng(player.ang + player.angVel * dt);

    // Radial micro-bounce spring physics
    player.radialVel += (-player.radialBounce * 180 - player.radialVel * 14) * dt;
    player.radialBounce += player.radialVel * dt;

    // ===== SPAWNING & UPDATING OBSTACLES =====
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      const baseDelay = spawnPattern();
      spawnTimer = baseDelay / Math.pow(speedMul, 0.82);
    }

    for (let i = walls.length - 1; i >= 0; i--) {
      const w = walls[i];
      w.r -= wallSpd * dt;
      w.start = normAng(w.start + w.rotSpd * dt);
      if (w.hitFlash > 0) w.hitFlash = Math.max(0, w.hitFlash - dt * 5);
      w.vibeOff *= Math.pow(0.01, dt);

      // Unique dynamic obstacle behaviors
      if (w.kind === 'phantom' && !w.vanished) {
        if (w.r < w.phantomTriggerR) {
          w.phantomAlpha -= dt * 2.1;
          if (w.phantomAlpha <= 0.05) {
            w.vanished = true;
            w.phantomAlpha = 0;
          }
        }
      } else if (w.kind === 'split') {
        const osc = Math.sin(runTime * 3.1 + w.phase);
        w.span = clamp(w.baseSpan + osc * 0.24, 0.4, Math.PI - 0.55);
        w.start = normAng(w.baseStart - osc * 0.12);
      } else if (w.kind === 'breathe') {
        const osc = Math.sin(runTime * 3.4 + w.phase);
        w.span = clamp(w.baseSpan + osc * 0.22, 0.45, Math.PI - 0.62);
      }

      if (w.r + w.thick < CORE_R - 8) walls.splice(i, 1);
    }

    // Level 3 Telegraphed Core Lasers
    if (curLvl.id === 2 && hyperAmt < 0.3) {
      laserTimer -= dt;
      if (laserTimer <= 0) {
        const aimAng = normAng(player.ang + (Math.random() - 0.5) * 0.45);
        lasers.push({
          ang: aimAng,
          state: 'warn',
          timer: 1.35,
          ticks: 3,
          halfWidth: 0.095
        });
        laserTimer = Math.max(2.9, 4.8 - speedTier * 0.28);
      }
    }
    for (let i = lasers.length - 1; i >= 0; i--) {
      const lz = lasers[i];
      lz.timer -= dt;
      if (lz.state === 'warn') {
        const remainTicks = Math.ceil(lz.timer / 0.42);
        if (remainTicks < lz.ticks && remainTicks >= 0) {
          lz.ticks = remainTicks;
          playSfx('tick');
        }
        if (lz.timer <= 0) {
          lz.state = 'fire';
          lz.timer = 0.44;
          playSfx('laser');
          shake = Math.max(shake, 4.5);
        }
      } else if (lz.timer <= 0) {
        lasers.splice(i, 1);
      }
    }

    // Coins update & Magnet perk
    const pR = ORBIT_R + player.radialBounce;
    const magnetRange = save.perks.magnet ? 105 : 26 * player.scale;
    for (let i = coins.length - 1; i >= 0; i--) {
      const c = coins[i];
      c.r -= wallSpd * dt;
      c.pulse += dt * 5;

      const checkAngs = duality.active ? [player.ang, normAng(player.ang + Math.PI * duality.splitBlend)] : [player.ang];
      for (const a of checkAngs) {
        const dx = Math.cos(c.ang) * c.r - Math.cos(a) * pR;
        const dy = Math.sin(c.ang) * c.r - Math.sin(a) * pR;
        const dist = Math.hypot(dx, dy);
        if (save.perks.magnet && dist < magnetRange && dist > 1) {
          c.r = lerp(c.r, pR, dt * 7);
          c.ang = normAng(c.ang + angDiff(a, c.ang) * dt * 8);
        }
        if (dist < 22 * Math.sqrt(player.scale)) {
          c.taken = true;
          save.coins += 1;
          runCoins += 1;
          coinHud.textContent = `◈ ${save.coins}`;
          playSfx('coin');
          vibe(10);
          emitSparks(Math.cos(c.ang) * c.r, Math.sin(c.ang) * c.r, Math.cos(c.ang), Math.sin(c.ang), 10, '#ffd800', 0.9);
          addFloatText(Math.cos(c.ang) * c.r, Math.sin(c.ang) * c.r - 10, '+1 ◈', '#ffd800');
          break;
        }
      }
      if (c.taken || c.r < CORE_R) coins.splice(i, 1);
    }

    // Warp streaks animation during 3D Hyper-Tunnel
    if (hyperAmt > 0.02) {
      for (const st of warpStreaks) {
        st.r -= st.spd * dt * (1.2 + hyperAmt * 1.4);
        if (st.r < 0.08) {
          st.r = 1.05;
          st.ang = Math.random() * TAU;
        }
      }
    }

    // ===== COLLISION RESOLUTION =====
    if (curLvl.id === 3 && duality.active) {
      const angA = player.ang;
      const angB = normAng(player.ang + Math.PI * duality.splitBlend);
      const resA = processCloneCollisions(angA, false, dt, wallSpd);
      const resB = processCloneCollisions(angB, true, dt, wallSpd);

      if (resA.died && resB.died) {
        triggerDeath(angA);
      } else if (resA.died || resB.died) {
        // Tactical Clone Survival! Destroy the hit clone with full shard shatter, survivor keeps playing!
        const hitAng = resA.died ? angA : angB;
        const survAng = resA.died ? angB : angA;
        playSfx('shatter');
        vibe([25, 25, 20]);
        hitStop = 0.06;
        shake = 9;
        shatterAt(hitAng, player.scale, resA.died ? curLvl.accent : '#00f0ff');
        duality.active = false;
        duality.splitBlend = 0;
        duality.respawnTimer = 9.0;
        player.ang = survAng;
        player.grace = 0.85;
        showBanner('CLONE LOST · SURVIVE 9S', 1.7);
      } else {
        if (resA.ang !== angA) player.ang = resA.ang;
        else if (resB.ang !== angB) player.ang = normAng(resB.ang - Math.PI * duality.splitBlend);
      }
    } else {
      const res = processCloneCollisions(player.ang, false, dt, wallSpd);
      if (res.died) {
        triggerDeath(player.ang);
      } else {
        player.ang = res.ang;
      }
    }
  }

  // ===== 3D PROJECTION HELPER =====
  function project(wx, wy, wz) {
    // Rotate by worldRot + camSway
    const rot = worldRot + camSway;
    const cr = Math.cos(rot), sr = Math.sin(rot);
    let x = wx * cr - wy * sr;
    let y = wx * sr + wy * cr;
    let z = wz * depth3D;

    // Tilt around X (pitch) and Y (bank)
    const cx = Math.cos(camTiltX), sx = Math.sin(camTiltX);
    const y1 = y * cx - z * sx;
    const z1 = y * sx + z * cx;

    const cy = Math.cos(camTiltY), sy = Math.sin(camTiltY);
    const x2 = x * cy + z1 * sy;
    const z2 = -x * sy + z1 * cy;

    const fov = 720;
    const persp = fov / Math.max(160, fov - z2);
    const s = persp * camZoom;
    return { x: W * 0.5 + x2 * s, y: H * 0.5 + y1 * s, s };
  }

  // ===== DRAWING HELPERS =====
  function drawExtrudedSector(rIn, rOut, startAng, span, zTop, fillTop, fillSide, alpha, gearTeeth) {
    const segs = Math.max(6, Math.ceil(span * 14));
    const botOut = [], botIn = [], topOut = [], topIn = [];

    for (let i = 0; i <= segs; i++) {
      const f = i / segs;
      const a = startAng + f * span;
      let rO = rOut;
      let rI = rIn;
      if (gearTeeth) {
        const tooth = ((i % 2) === 0 ? 7 : -3);
        rO += tooth;
        rI += tooth * 0.45;
      }
      const ca = Math.cos(a), sa = Math.sin(a);
      topOut.push(project(ca * rO, sa * rO, zTop));
      topIn.push(project(ca * rI, sa * rI, zTop));
      if (depth3D > 0.04) {
        botOut.push(project(ca * rO, sa * rO, 0));
        botIn.push(project(ca * rI, sa * rI, 0));
      }
    }

    ctx.save();
    ctx.globalAlpha = alpha;

    // 3D Extruded Side Walls
    if (depth3D > 0.04) {
      ctx.fillStyle = fillSide;
      // Inner curved skirt
      ctx.beginPath();
      for (let i = 0; i <= segs; i++) {
        if (i === 0) ctx.moveTo(botIn[i].x, botIn[i].y);
        else ctx.lineTo(botIn[i].x, botIn[i].y);
      }
      for (let i = segs; i >= 0; i--) ctx.lineTo(topIn[i].x, topIn[i].y);
      ctx.closePath();
      ctx.fill();

      // Outer curved skirt
      ctx.beginPath();
      for (let i = 0; i <= segs; i++) {
        if (i === 0) ctx.moveTo(botOut[i].x, botOut[i].y);
        else ctx.lineTo(botOut[i].x, botOut[i].y);
      }
      for (let i = segs; i >= 0; i--) ctx.lineTo(topOut[i].x, topOut[i].y);
      ctx.closePath();
      ctx.fill();

      // End caps
      ctx.beginPath();
      ctx.moveTo(botIn[0].x, botIn[0].y);
      ctx.lineTo(botOut[0].x, botOut[0].y);
      ctx.lineTo(topOut[0].x, topOut[0].y);
      ctx.lineTo(topIn[0].x, topIn[0].y);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(botIn[segs].x, botIn[segs].y);
      ctx.lineTo(botOut[segs].x, botOut[segs].y);
      ctx.lineTo(topOut[segs].x, topOut[segs].y);
      ctx.lineTo(topIn[segs].x, topIn[segs].y);
      ctx.closePath();
      ctx.fill();
    }

    // Top Cap
    ctx.fillStyle = fillTop;
    ctx.beginPath();
    for (let i = 0; i <= segs; i++) {
      if (i === 0) ctx.moveTo(topOut[i].x, topOut[i].y);
      else ctx.lineTo(topOut[i].x, topOut[i].y);
    }
    for (let i = segs; i >= 0; i--) ctx.lineTo(topIn[i].x, topIn[i].y);
    ctx.closePath();
    ctx.fill();

    // Subtle crisp top highlight rim in 3D
    if (depth3D > 0.15) {
      ctx.strokeStyle = 'rgba(255,255,255,0.45)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawSkinLetter(ang, scale, color, isPhasing, isCloneB) {
    const r = ORBIT_R + player.radialBounce;
    const ux = Math.cos(ang), uy = Math.sin(ang);
    const vx = -uy, vy = ux;
    const sz = 9.5 * scale;

    // Ground shadow in 3D
    if (depth3D > 0.08) {
      const sh = project(ux * r, uy * r, 0);
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.beginPath();
      ctx.arc(sh.x, sh.y, sz * 0.75 * sh.s, 0, TAU);
      ctx.fill();
      ctx.restore();
    }

    const zLift = 12 * depth3D;
    const toScreen = (lx, ly) => project(ux * r + vx * lx * sz + ux * ly * sz, uy * r + vy * lx * sz + uy * ly * sz, zLift);

    ctx.save();
    if (isPhasing) {
      ctx.globalAlpha = 0.62 + Math.sin(runTime * 28) * 0.25;
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 16;
    } else if (player.grace > 0 && Math.floor(runTime * 18) % 2 === 0) {
      ctx.globalAlpha = 0.45;
    }

    ctx.strokeStyle = isPhasing ? '#ffffff' : (isCloneB ? '#00f0ff' : color);
    ctx.lineWidth = Math.max(2.2, 2.5 * Math.sqrt(scale));
    ctx.lineJoin = 'miter';
    ctx.lineCap = 'square';

    const skin = save.skin || 'M';
    if (skin === 'M') {
      const pts = [[-0.95, -0.75], [-0.72, 0.95], [0, 0.05], [0.72, 0.95], [0.95, -0.75]].map(p => toScreen(p[0], p[1]));
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();
    } else if (skin === 'A') {
      const p1 = toScreen(-0.85, -0.8), p2 = toScreen(0, 1.05), p3 = toScreen(0.85, -0.8);
      const b1 = toScreen(-0.46, -0.15), b2 = toScreen(0.46, -0.15);
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y);
      ctx.moveTo(b1.x, b1.y); ctx.lineTo(b2.x, b2.y);
      ctx.stroke();
    } else {
      const a1 = toScreen(-0.82, -0.82), a2 = toScreen(0.82, 0.88);
      const b1 = toScreen(0.82, -0.82), b2 = toScreen(-0.82, 0.88);
      ctx.beginPath();
      ctx.moveTo(a1.x, a1.y); ctx.lineTo(a2.x, a2.y);
      ctx.moveTo(b1.x, b1.y); ctx.lineTo(b2.x, b2.y);
      ctx.stroke();
    }

    // Phase ring aura around player
    if (isPhasing) {
      const c = project(ux * r, uy * r, zLift);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(c.x, c.y, sz * 1.45 * c.s, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ===== MAIN RENDER LOOP =====
  function draw() {
    ctx.save();
    if (shake > 0.2) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    // Background with subtle radial depth
    const grad = ctx.createRadialGradient(W * 0.5, H * 0.5, 20, W * 0.5, H * 0.5, Math.max(W, H) * 0.72);
    grad.addColorStop(0, curLvl.bg);
    grad.addColorStop(1, curLvl.bgDeep);
    ctx.fillStyle = grad;
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // 3D Receding Depth Tunnel Rings
    if (depth3D > 0.04) {
      ctx.save();
      ctx.strokeStyle = curLvl.accent;
      for (let k = 1; k <= 5; k++) {
        const zDepth = -k * 65 * depth3D;
        const rad = 110 + k * 75;
        ctx.globalAlpha = (0.14 - k * 0.02) * depth3D * (1 + hyperAmt * 0.8);
        ctx.lineWidth = 1.2 + hyperAmt;
        ctx.beginPath();
        for (let s = 0; s <= 40; s++) {
          const a = (s / 40) * TAU;
          const p = project(Math.cos(a) * rad, Math.sin(a) * rad, zDepth);
          if (s === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();
        ctx.stroke();
      }
      ctx.restore();
    }

    // 3D HYPER-TUNNEL Warp Streaks
    if (hyperAmt > 0.03) {
      ctx.save();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.6;
      const maxR = Math.hypot(W, H) * 0.62;
      for (const st of warpStreaks) {
        const r1 = st.r * maxR;
        const r2 = Math.max(CORE_R, (st.r - 0.14) * maxR);
        const p1 = project(Math.cos(st.ang) * r1, Math.sin(st.ang) * r1, 20);
        const p2 = project(Math.cos(st.ang) * r2, Math.sin(st.ang) * r2, -30);
        ctx.globalAlpha = hyperAmt * 0.45 * (1 - Math.abs(st.r - 0.5));
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }
      ctx.restore();
    }

    // Walls (sorted outer-to-inner for clean 3D painter's order)
    const sortedWalls = walls.slice().sort((a, b) => b.r - a.r);
    for (const w of sortedWalls) {
      if (w.vanished) continue;
      let alpha = 1;
      let topCol = curLvl.accent;
      let sideCol = curLvl.sideShade;

      if (w.kind === 'phantom') {
        const nearTrigger = w.r < w.phantomTriggerR + 95;
        if (nearTrigger) {
          const blink = 0.5 + 0.5 * Math.sin(runTime * 28);
          topCol = blink > 0.5 ? '#ffffff' : curLvl.accent;
        }
        alpha = clamp(w.phantomAlpha, 0, 1);
      }
      if (w.hitFlash > 0.05) {
        topCol = '#ffffff';
      }

      const rIn = Math.max(CORE_R * 0.85, w.r + w.vibeOff);
      const rOut = Math.max(rIn + 2, w.r + w.thick + w.vibeOff);
      const h3d = w.height3D * (1 + hyperAmt * 0.55);
      drawExtrudedSector(rIn, rOut, w.start, w.span, h3d, topCol, sideCol, alpha, w.kind === 'gear');
    }

    // Level 3 Telegraphed Lasers
    for (const lz of lasers) {
      const maxR = Math.hypot(W, H) * 0.72;
      ctx.save();
      if (lz.state === 'warn') {
        const p1 = project(Math.cos(lz.ang) * CORE_R, Math.sin(lz.ang) * CORE_R, 14);
        const p2 = project(Math.cos(lz.ang) * maxR, Math.sin(lz.ang) * maxR, 14);
        ctx.strokeStyle = '#ffffff';
        ctx.globalAlpha = 0.35 + 0.45 * Math.abs(Math.sin(runTime * 22));
        ctx.setLineDash([8, 6]);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      } else {
        drawExtrudedSector(CORE_R, maxR, lz.ang - lz.halfWidth, lz.halfWidth * 2, 22, '#ffffff', curLvl.accent, 0.92, false);
      }
      ctx.restore();
    }

    // Coins (Gold/Neon Diamonds)
    for (const c of coins) {
      const p = project(Math.cos(c.ang) * c.r, Math.sin(c.ang) * c.r, 16);
      const sz = (7 + Math.sin(c.pulse) * 1.4) * p.s;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(c.pulse * 0.5);
      ctx.fillStyle = '#ffd800';
      ctx.shadowColor = '#ffd800';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(0, -sz);
      ctx.lineTo(sz * 0.78, 0);
      ctx.lineTo(0, sz);
      ctx.lineTo(-sz * 0.78, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // Central Core Ring (3D Pedestal + Hollow Ring + Phase Gauge)
    const coreZ = 18 * depth3D;
    const coreSteps = 44;
    if (depth3D > 0.06) {
      ctx.save();
      ctx.fillStyle = curLvl.sideShade;
      ctx.beginPath();
      for (let i = 0; i <= coreSteps; i++) {
        const a = (i / coreSteps) * TAU;
        const p = project(Math.cos(a) * CORE_R, Math.sin(a) * CORE_R, 0);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // Core dark interior + bright ring
    ctx.save();
    ctx.beginPath();
    for (let i = 0; i <= coreSteps; i++) {
      const a = (i / coreSteps) * TAU;
      const p = project(Math.cos(a) * (CORE_R + beatPulse * 2.5), Math.sin(a) * (CORE_R + beatPulse * 2.5), coreZ);
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
    ctx.closePath();
    ctx.fillStyle = curLvl.bgDeep;
    ctx.fill();
    ctx.strokeStyle = curLvl.accent;
    ctx.lineWidth = 4.2;
    ctx.stroke();

    // Subtle Phase Fuel arc inside core
    if (mode === 'play') {
      const frac = player.phaseFuel / player.phaseMax;
      if (frac > 0.01) {
        const rG = CORE_R - 7;
        const gSteps = Math.max(4, Math.ceil(frac * 36));
        ctx.beginPath();
        for (let i = 0; i <= gSteps; i++) {
          const a = -Math.PI * 0.5 + (i / gSteps) * frac * TAU;
          const p = project(Math.cos(a) * rG, Math.sin(a) * rG, coreZ);
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        ctx.strokeStyle = player.phasing ? '#ffffff' : 'rgba(255,255,255,0.45)';
        ctx.lineWidth = 2.4;
        ctx.stroke();
      }
    }
    ctx.restore();

    // Level 4 Duality Neon Tether between clones
    if (mode === 'play' && curLvl.id === 3 && duality.active) {
      const angA = player.ang;
      const angB = normAng(player.ang + Math.PI * duality.splitBlend);
      const rP = ORBIT_R + player.radialBounce;
      const pA = project(Math.cos(angA) * rP, Math.sin(angA) * rP, 12);
      const pB = project(Math.cos(angB) * rP, Math.sin(angB) * rP, 12);
      ctx.save();
      ctx.strokeStyle = '#00f0ff';
      ctx.globalAlpha = 0.55;
      ctx.lineWidth = 1.8;
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.moveTo(pA.x, pA.y);
      ctx.lineTo(pB.x, pB.y);
      ctx.stroke();
      ctx.restore();
    }

    // Player(s)
    if (mode === 'play' || mode === 'menu') {
      drawSkinLetter(player.ang, player.scale, curLvl.accent, player.phasing, false);
      if (mode === 'play' && curLvl.id === 3 && duality.active) {
        const angB = normAng(player.ang + Math.PI * duality.splitBlend);
        drawSkinLetter(angB, player.scale, '#00f0ff', player.phasing, true);
      }
    }

    // Sparks
    for (const s of sparks) {
      const p = project(s.x, s.y, 12);
      ctx.save();
      ctx.globalAlpha = clamp(s.life / s.maxLife, 0, 1);
      ctx.fillStyle = s.color;
      ctx.fillRect(p.x - s.size * 0.5, p.y - s.size * 0.5, s.size, s.size);
      ctx.restore();
    }

    // Ricocheting Shards
    for (const sh of shards) {
      const p = project(sh.x, sh.y, 14);
      ctx.save();
      ctx.globalAlpha = clamp(sh.life / sh.maxLife, 0, 1);
      ctx.translate(p.x, p.y);
      ctx.rotate(sh.rot);
      ctx.fillStyle = sh.color;
      ctx.beginPath();
      ctx.moveTo(0, -sh.sz);
      ctx.lineTo(sh.sz * 0.75, sh.sz * 0.65);
      ctx.lineTo(-sh.sz * 0.75, sh.sz * 0.45);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // Floating +1 Coin Text
    for (const ft of floatTexts) {
      const p = project(ft.x, ft.y, 18);
      ctx.save();
      ctx.globalAlpha = clamp(ft.life / ft.maxLife, 0, 1);
      ctx.fillStyle = ft.color;
      ctx.font = '900 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(ft.text, p.x, p.y);
      ctx.restore();
    }

    ctx.restore();
  }

  // ===== RAF LOOP =====
  let lastTs = performance.now();
  function loop(ts) {
    const dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  applyTheme(curLvl);
  renderMenu();
  requestAnimationFrame(loop);
})();
</script>
</body>
